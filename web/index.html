  /* A table too wide for the paper chosen moves up a size rather than
     breaking its identifiers in half. */
  let paperKey=meta.paper||'a4l';
  const fits=k=>{const pp=PDF_PAPER[k];return sections.every(sec=>pdfColumnWidths(sec,pp.w-64,7.6,3.2));};
  if(!fits(paperKey)){
    const up={a4l:'a3l',a4p:'a4l',a3p:'a3l'}[paperKey];
    if(up&&fits(up))paperKey=up;else if(fits('a3l'))paperKey='a3l';
  }
  const paper=PDF_PAPER[paperKey]||PDF_PAPER.a4l;
  const doc=new PdfDoc(paper.w,paper.h,{title:meta.title,author:meta.org});
  const M=32,top=M+40,bottom=paper.h-M-6,width=paper.w-2*M;
  const FS=7.6,LH=9.4,PAD=3.2;
  let y=top;
  const newPage=()=>{doc.addPage();y=top;};
  newPage();

  for(const sec of sections){
    const cols=sec.columns;
    const tw=cols.reduce((a,c)=>a+(c.w||1),0);
    const cw=pdfColumnWidths(sec,width,FS,PAD)||cols.map(c=>(c.w||1)/tw*width);
    const cx=[];cols.reduce((a,c,i)=>{cx[i]=a;return a+cw[i];},M);
    const headLines=cols.map((c,i)=>pdfWrap(c.label,FS,true,cw[i]-2*PAD));
    const headH=Math.max(...headLines.map(l=>l.length))*LH+2*PAD;
    const drawHead=cont=>{
      if(sec.heading){
        doc.text(M,y+10,sec.heading+(cont?'  (continued)':''),{size:10.5,bold:true});y+=15;
        if(sec.note&&!cont){doc.text(M,y+7,pdfFit(sec.note,8,false,width),{size:8,color:'#555555'});y+=12;}
      }
      doc.rect(M,y,width,headH,{fill:'#f6e7da'});
      cols.forEach((c,i)=>headLines[i].forEach((ln,k)=>
        doc.text(c.align==='right'?cx[i]+cw[i]-PAD:cx[i]+PAD,y+PAD+7+k*LH,ln,
          {size:FS,bold:true,color:'#1f2a33',align:c.align==='right'?'right':'left'})));
      y+=headH;
    };
    if(y+headH+40>bottom&&y>top)newPage();
    drawHead(false);
    if(!sec.rows.length){doc.text(M+PAD,y+12,sec.empty||'Nothing to report.',{size:8.5,color:'#666666'});y+=20;}
    sec.rows.forEach((row,ri)=>{
      const cells=row.map(c=>c&&typeof c==='object'?c:{v:c});
      const lines=cells.map((c,i)=>pdfWrap(c.v==null?'':String(c.v),FS,!!c.bold,cw[i]-2*PAD));
      let n=Math.max(1,...lines.map(l=>l.length));
      const maxRowLines=Math.floor((bottom-top-headH-40)/LH);
      if(n>maxRowLines){
        /* a cell longer than a whole page is cut, and says so */
        lines.forEach((l,i)=>{if(l.length>maxRowLines){l.length=maxRowLines;
          l[maxRowLines-1]=pdfFit(l[maxRowLines-1]+' … (continues in the Excel export)',FS,false,cw[i]-2*PAD);}});
        n=maxRowLines;
      }
      const h=n*LH+2*PAD;
      if(y+h>bottom){newPage();drawHead(true);}
      if(ri%2)doc.rect(M,y,width,h,{fill:'#f6f8fa'});
      cells.forEach((c,i)=>{
        if(c.fill)doc.rect(cx[i],y,cw[i],h,{fill:c.fill});
        lines[i].forEach((ln,k)=>doc.text(cols[i].align==='right'?cx[i]+cw[i]-PAD:cx[i]+PAD,
          y+PAD+7+k*LH,ln,{size:FS,bold:!!c.bold,color:c.color||'#1a1a1a',
          align:cols[i].align==='right'?'right':'left'}));
      });
      doc.line(M,y+h,M+width,y+h,{color:'#dde3ea',lw:0.4});
      y+=h;
    });
    y+=14;
  }
  await pdfFrame(doc,meta);
  return doc.output();
}

<script>

/* ==================================================================
   ACCOUNT ADAPTERS
   One interface, two back ends. The cloud one talks to Supabase over
   plain HTTPS for the sign-in, the licence and the company settings —
   Postgres row-level security enforces every rule. Projects never go
   there: they are files on the customer's own computer.
   ================================================================== */
function qs(filter){
  const p=[];
  if(!filter) return '';
  Object.entries(filter.eq||{}).forEach(([k,v])=>p.push(`${k}=eq.${encodeURIComponent(v)}`));
  Object.entries(filter.in||{}).forEach(([k,v])=>p.push(`${k}=in.(${v.map(x=>'"'+String(x).replace(/"/g,'')+'"').map(encodeURIComponent).join(',')})`));
  if(filter.order) p.push('order='+filter.order);
  return p.length ? '&'+p.join('&') : '';
}

function CloudStore(cfg){
  const base=cfg.url.replace(/\/$/,''), anon=cfg.anonKey;
  const SKEY='es:session';
  let ses=null;               // {access, refresh, exp (ms), user:{id,email}}
  try{ ses=JSON.parse(localStorage.getItem(SKEY)||'null'); }catch(e){}
  const keep=()=>{ try{ ses?localStorage.setItem(SKEY,JSON.stringify(ses)):localStorage.removeItem(SKEY); }catch(e){} };
  const anonIsJwt=/^eyJ/.test(String(anon||''));
  const auth=(p,opts)=>fetch(base+'/auth/v1'+p,{...opts,
    headers:{apikey:anon,'Content-Type':'application/json',...(opts&&opts.headers||{})}});
  function take(j){
    if(!j || !j.access_token) return null;
    ses={access:j.access_token, refresh:j.refresh_token||'', exp:Date.now()+((+j.expires_in||3600)*1000),
         user:{id:j.user&&j.user.id, email:j.user&&j.user.email}};
    keep(); return ses.user;
  }
  async function refresh(){
    if(!ses || !ses.refresh) return false;
    try{
      const r=await auth('/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:ses.refresh})});
      if(!r.ok) return false;
      return !!take(await r.json());
    }catch(e){ return false; }
  }
  async function fresh(){
    if(ses && ses.exp && ses.exp-Date.now()<90000) await refresh();
  }
  const hdr=extra=>({apikey:anon, ...(ses?{Authorization:'Bearer '+ses.access}:(anonIsJwt?{Authorization:'Bearer '+anon}:{})),
    'Content-Type':'application/json', ...extra});
  async function call(url,opts,retry=true){
    await fresh();
    const r=await fetch(url,{...opts,headers:hdr(opts&&opts.headers)});
    if(r.status===401 && retry && await refresh()) return call(url,opts,false);
    if(r.status===401){ ses=null; keep(); if(store.onsignout) store.onsignout(); throw Object.assign(new Error('signed-out'),{status:401}); }
    const t=await r.text();
    if(!r.ok){
      let msg='';
      try{ const j=JSON.parse(t); msg=j.message||j.hint||j.details||''; }catch(e){ msg=t.slice(0,200); }
      throw Object.assign(new Error(msg||('cloud '+r.status)),{status:r.status, serverMessage:msg});
    }
    return t?JSON.parse(t):null;
  }
  const store={
    kind:'cloud', needsAuth:true,
    get user(){ return ses&&ses.user; },
    async restore(){
      if(!ses) return null;
      await fresh();
      try{
        const r=await auth('/user',{headers:{Authorization:'Bearer '+ses.access}});
        if(!r.ok){ if(!(await refresh())){ store.signOut(); return null; } }
        else { const u=await r.json(); ses.user={id:u.id,email:u.email}; keep(); }
        return ses.user;
      }catch(e){ return ses.user; }
    },
    /* a link from a confirmation or password-reset email lands with the session in the address */
    fromHash(hash){
      const h=new URLSearchParams(String(hash||'').replace(/^#/,''));
      if(h.get('error_description')) return {error:h.get('error_description')};
      if(!h.get('access_token')) return null;
      take({access_token:h.get('access_token'), refresh_token:h.get('refresh_token'),
            expires_in:h.get('expires_in')||3600, user:{}});
      return {type:h.get('type')||''};
    },
    async signIn(email,password){
      const r=await auth('/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){
        const m=String(j.error_description||j.msg||j.message||'').toLowerCase();
        if(m.includes('confirm')) throw new Error('Confirm your email first — open the link we sent you, then sign in.');
        throw new Error('Those details were not recognised. Check your email and password.');
      }
      return take(j);
    },
    async signUp(email,password,redirect){
      const r=await auth('/signup'+(redirect?'?redirect_to='+encodeURIComponent(redirect):''),{method:'POST',body:JSON.stringify({email,password})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){
        const m=String(j.msg||j.error_description||j.error||j.message||'').toLowerCase();
        if(m.includes('already')) throw Object.assign(new Error('That email already has an account. Sign in instead.'),{exists:true});
        if(m.includes('password')) throw new Error(j.msg||j.message||'That password is not strong enough.');
        throw new Error(j.msg||j.error_description||j.message||'Could not create that account.');
      }
      if(j.access_token){ take(j); return {needsVerification:false}; }
      // a confirmed-email project returns a user with no identities when the address is already registered
      if(j.identities && !j.identities.length) throw Object.assign(new Error('That email already has an account. Sign in instead.'),{exists:true});
      return {needsVerification:true};
    },
    async resend(email,redirect){
      const r=await auth('/resend'+(redirect?'?redirect_to='+encodeURIComponent(redirect):''),{method:'POST',body:JSON.stringify({type:'signup',email})});
      if(!r.ok) throw new Error('Could not send that email again just now.');
    },
    async sendReset(email,redirect){
      const r=await auth('/recover'+(redirect?'?redirect_to='+encodeURIComponent(redirect):''),
        {method:'POST',body:JSON.stringify({email})});
      if(!r.ok) throw new Error('Could not send the reset email just now.');
    },
    async setPassword(password){
      await fresh();
      const r=await auth('/user',{method:'PUT',headers:{Authorization:'Bearer '+(ses&&ses.access)},body:JSON.stringify({password})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.msg||j.message||'Could not set that password.');
      if(j.email&&ses){ ses.user={id:j.id,email:j.email}; keep(); }
    },
    signOut(){
      const tok=ses&&ses.access;
      ses=null; keep();
      if(tok) auth('/logout',{method:'POST',headers:{Authorization:'Bearer '+tok}}).catch(()=>{});
    },
    rpc(name,args){ return call(base+'/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(args||{})}); },
    select(table,filter){ return call(base+'/rest/v1/'+table+'?select=*'+qs(filter),{}); },
    insert(table,rows,upsert){
      return call(base+'/rest/v1/'+table,{method:'POST',body:JSON.stringify(rows),
        headers:{Prefer:(upsert?'resolution=merge-duplicates,':'')+'return=minimal'}});
    },
    patch(table,filter,body){
      return call(base+'/rest/v1/'+table+'?'+qs(filter).slice(1),{method:'PATCH',body:JSON.stringify(body),
        headers:{Prefer:'return=minimal'}});
    },
    del(table,filter){
      return call(base+'/rest/v1/'+table+'?'+qs(filter).slice(1),{method:'DELETE',headers:{Prefer:'return=minimal'}});
    },
  };
  return store;
}

/* A demo copy: no sign-in, no licence; company settings kept in this browser. */
function LocalStore(){
  const KEY='estora.local.v2';
  let db;
  try{ db=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!db) db={es_meta:[]};
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){ throw new Error('This browser has run out of storage space.'); } };
  const meta=id=>db.es_meta.find(m=>m.id===id);
  return {
    kind:'local', needsAuth:false, user:{id:'local',email:''},
    async restore(){ return this.user; }, fromHash(){ return null; }, signOut(){},
    async rpc(name,args){
      if(name==='es_whoami') return {orgId:'local', orgName:((meta('org')||{data:{}}).data.name)||'My company',
        userId:'local', name:'You', active:true, isOwner:false,
        license:{plan:'demo', enforce:false, expired:false, trial:false}};
      if(name==='es_rename_org'){ this._meta('org',{name:args.p_name}); return {name:args.p_name}; }
      throw new Error('Available with an account only.');
    },
    _meta(id,patch){ let m=meta(id); if(!m){ m={id,org_id:'local',data:{}}; db.es_meta.push(m); }
      Object.assign(m.data,patch); save(); },
    async select(t){ return t==='es_meta' ? JSON.parse(JSON.stringify(db.es_meta)) : []; },
    async insert(t,rows){
      if(t!=='es_meta') return;
      rows.forEach(r=>{ const i=db.es_meta.findIndex(x=>x.id===r.id); const row={org_id:'local', updated_at:new Date().toISOString(), ...r};
        if(i<0) db.es_meta.push(row); else db.es_meta[i]={...db.es_meta[i],...row}; });
      save();
    },
    async patch(){}, async del(){},
  };
}

function makeStore(){
  let cfg=null;
  try{ const o=JSON.parse(localStorage.getItem('es:backend')||'null'); if(o&&o.url&&o.anonKey) cfg=o; }catch(e){}
  if(!cfg && CLOUD_URL && CLOUD_KEY) cfg={url:CLOUD_URL, anonKey:CLOUD_KEY};
  return cfg ? CloudStore(cfg) : LocalStore();
}

/* ==================================================================
   THE APPLICATION — account, licence, project files, the page frame
   One user per licence. The account and licence live in the cloud;
   projects are .estora files the user saves on their own computer.
   ================================================================== */
const APP = {
  store:null, screen:'loading',            // loading | auth | noaccount | setpass | app
  authScreen:'signin', authError:'', authNotice:'', authEmail:'', authBusy:false,
  who:null, org:{}, library:null, offline:false,
  payments:[], keys:[], ownerOrgs:null, recents:[], draft:null,
  view:'home',
  file:{handle:null, name:'', recentId:''}, dirty:false, savedAt:null,
};
let activeTab='home', dlgCtx=null, draftTimer=null, launchFile=null;

const rid = p => p+'-'+(crypto.getRandomValues(new Uint32Array(3))).reduce((s,x)=>s+x.toString(36),'').slice(0,18);
const initials = n => String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
const fmtDate = d => { if(!d) return '—'; const x=new Date(String(d).length<=10?d+'T00:00:00':d);
  return isNaN(x)?String(d):x.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}); };
const fmtWhen = d => { if(!d) return '—'; const x=new Date(d); if(isNaN(x)) return String(d);
  return x.toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
const today = () => new Date().toISOString().slice(0,10);
const addDays = (d,n) => { const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const isCloud = () => APP.store && APP.store.kind==='cloud';
const orgKey = () => (APP.who && APP.who.orgId) || 'local';

/* ---------- licence ---------- */
function lic(){
  const L=(APP.who && APP.who.license) || {};
  if(APP.offline && L.expiresOn){ const left=Math.round((new Date(L.expiresOn+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
    return {...L, daysLeft:left, expired:left<0}; }
  return L;
}
const expired      = () => !!(lic().enforce && lic().expired);
const canEditLines = () => !!S && !expired() && !(APP.who && APP.who.active===false);
const canManage    = canEditLines;
function canAddLine(){
  const L=lic();
  if(L.enforce && L.trial && S && S.lines.length>=(L.items||5)){
    toast(`The free trial prices up to ${L.items||5} items per project — choose a plan to add more.`,'crit'); return false; }
  return canEditLines();
}
function friendly(e){
  const m=(e && (e.serverMessage||e.message)) || String(e||'');
  if(/row-level security|permission denied|not permitted|42501/i.test(m))
    return expired() ? 'Your licence has ended, so changes are paused until it is renewed.' : 'That change is not allowed.';
  if(/Failed to fetch|NetworkError|load failed/i.test(m)) return 'Could not reach the server — check your connection and try again.';
  if(m==='signed-out') return 'Your session ended — sign in again.';
  return m.replace(/^cloud \d+\s*/,'') || 'Something went wrong.';
}

/* ---------- theme ---------- */
function applyTheme(){
  let t=''; try{ t=localStorage.getItem('es:theme')||''; }catch(e){}
  if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  try{ localStorage.setItem('es:theme',next); }catch(e){}
  applyTheme(); renderRoot();
}
const isDark = () => (document.documentElement.getAttribute('data-theme')
  || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';

/* ==================================================================
   START-UP
   ================================================================== */
function pending(k,v){
  try{ if(v===undefined) return JSON.parse(localStorage.getItem('es:pending-'+k)||'null');
       if(v===null) localStorage.removeItem('es:pending-'+k); else localStorage.setItem('es:pending-'+k,JSON.stringify(v)); }catch(e){}
  return null;
}
async function boot(){
  applyTheme();
  APP.store=makeStore();
  APP.store.onsignout=()=>{ resetSession(); APP.screen='auth'; APP.authScreen='signin';
    APP.authNotice='Your session ended — please sign in again. Your open project is kept as a draft on this computer.'; renderRoot(); };
  renderRoot();
  const h=APP.store.fromHash(location.hash);
  if(h){
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    if(h.error){ APP.authError=h.error; }
    else if(h.type==='recovery'){ APP.screen='setpass'; renderRoot(); return; }
  }
  const u=await APP.store.restore();
  if(!u){ APP.screen='auth'; renderRoot(); return; }
  await enter();
}
function resetSession(){
  APP.who=null; APP.org={}; APP.library=null; APP.ownerOrgs=null; APP.payments=[]; APP.keys=[]; APP.recents=[]; APP.draft=null;
  S=null; APP.view='home'; activeTab='home'; APP.file={handle:null,name:'',recentId:''}; APP.dirty=false; APP.offline=false;
}
const WHO_CACHE='es:who';
async function enter(){
  APP.screen='loading'; renderRoot();
  let who;
  try{ who=await APP.store.rpc('es_whoami',{}); APP.offline=false; }
  catch(e){
    // no connection: carry on with the licence we last saw, for up to 14 days
    let c=null; try{ c=JSON.parse(localStorage.getItem(WHO_CACHE)||'null'); }catch(x){}
    const me=(APP.store.user||{}).id;
    if(/Failed to fetch|NetworkError|load failed/i.test(String(e&&e.message)) && c && c.who && c.uid===me && Date.now()-c.at<14*864e5){
      who=c.who; APP.offline=true;
    } else { APP.screen='auth'; APP.authError=friendly(e); renderRoot(); return; }
  }
  if(!who || !who.orgId){
    const reg=pending('org');
    if(reg){ try{ await APP.store.rpc('es_register_org',{p_org_name:reg.org, p_person_name:reg.name}); pending('org',null); return enter(); }
      catch(e){ APP.authError=friendly(e); } }
    APP.who=who||{}; APP.screen='noaccount'; renderRoot(); return;
  }
  APP.who=who;
  if(!APP.offline){ try{ localStorage.setItem(WHO_CACHE, JSON.stringify({uid:(APP.store.user||{}).id, at:Date.now(), who})); }catch(e){} }
  try{ await loadOrg(); }catch(e){ if(!APP.offline) toast(friendly(e),'crit'); }
  await loadRecents();
  APP.screen='app';
  setView('home'); renderRoot();
  if(launchFile){ const f=launchFile; launchFile=null; openHandle(f); }
}
async function loadOrg(){
  let meta=[];
  try{ meta=await APP.store.select('es_meta'); try{ localStorage.setItem('es:meta-'+orgKey(), JSON.stringify(meta)); }catch(e){} }
  catch(e){ try{ meta=JSON.parse(localStorage.getItem('es:meta-'+orgKey())||'[]'); }catch(x){} if(!APP.offline) throw e; }
  const m=id=>((meta||[]).find(x=>x.id===id)||{}).data;
  APP.org={currency:'SAR', ...(m('org')||{}), name:(APP.who.orgName||(m('org')||{}).name||'My company')};
  APP.library=m('library')||null;
}
async function refreshWho(){
  if(!isCloud()) return;
  try{ const w=await APP.store.rpc('es_whoami',{}); if(w && w.orgId){ APP.who=w; APP.offline=false;
    try{ localStorage.setItem(WHO_CACHE, JSON.stringify({uid:(APP.store.user||{}).id, at:Date.now(), who:w})); }catch(e){} } }catch(e){}
}
function setView(v){ APP.view=v; activeTab=v; clearArmed=false; }

/* ==================================================================
   PROJECT FILES — .estora files on the user's own computer
   Chrome and Edge save straight back into the same file (File System
   Access). Other browsers download a fresh copy on every save and open
   through a file picker. Either way a draft of unsaved work is kept in
   this browser, so nothing is lost if the window closes.
   ================================================================== */
const FILE_EXT='.estora';
const FILE_TYPES=[{description:'ESTORA project', accept:{'application/json':[FILE_EXT]}}];
function fsOK(){
  if(typeof window.showSaveFilePicker!=='function' || typeof window.showOpenFilePicker!=='function') return false;
  try{ return window.self===window.top; }catch(e){ return false; }
}
const IDB=(()=>{
  let p=null;
  const db=()=>p||(p=new Promise((res,rej)=>{
    if(!('indexedDB' in window)) return rej(new Error('no storage'));
    const r=indexedDB.open('estora',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }));
  const run=async(mode,fn)=>{ const d=await db(); return new Promise((res,rej)=>{
    const t=d.transaction('kv',mode), rq=fn(t.objectStore('kv'));
    t.oncomplete=()=>res(rq?rq.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); };
  return {
    get:k=>run('readonly',s=>s.get(k)).catch(()=>undefined),
    set:(k,v)=>run('readwrite',s=>s.put(v,k)).catch(()=>undefined),
    del:k=>run('readwrite',s=>s.delete(k)).catch(()=>undefined),
  };
})();
const libOf = s => { const {project, lines, ...lib}=s; return JSON.parse(JSON.stringify(lib)); };
function projectTotals(s){
  const keep=S; S=s; dirty();
  let sell=0; try{ s.lines.forEach(l=>{ sell+=priceLine(l).amount; }); }catch(e){}
  S=keep; dirty(); return sell;
}
function serialize(){
  return JSON.stringify({format:'estora', version:2, app:'ESTORA', savedAt:new Date().toISOString(),
    by:(APP.store&&APP.store.user&&APP.store.user.email)||'', state:S});
}
function parseProject(text){
  let o; try{ o=JSON.parse(text); }catch(e){ throw new Error('That file is not an ESTORA project.'); }
  const st = o && o.format==='estora' ? o.state : (o && Array.isArray(o.lines) ? o : null);
  if(!st || !Array.isArray(st.lines)) throw new Error('That file is not an ESTORA project.');
  const s=migrate(st);
  if(!s.transport.find(t=>t[0]===s.project.location)) s.project.location=(s.transport[0]||[''])[0];
  const mx=Math.max(0,...s.lines.map(l=>parseInt(String(l.id).replace(/\D/g,''),10)||0));
  if(!(s.seq>mx)) s.seq=mx+1;
  return s;
}

async function ensurePerm(h, write){
  if(!h || !h.queryPermission) return true;
  const o={mode:write?'readwrite':'read'};
  if((await h.queryPermission(o))==='granted') return true;
  return (await h.requestPermission(o))==='granted';
}
function downloadBlob(name, blob){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
}
async function saveProject(asNew){
  if(!S) return false;
  if(!canEditLines() && !asNew){ toast(expired()?'Your licence has ended — renew it to save changes.':'This project cannot be changed.','crit'); return false; }
  const text=serialize();
  if(fsOK()){
    try{
      let h=APP.file.handle;
      if(!h || asNew) h=await window.showSaveFilePicker({suggestedName:APP.file.name||suggestName(), types:FILE_TYPES});
      if(!(await ensurePerm(h,true))) throw new Error('ESTORA was not allowed to write that file.');
      const w=await h.createWritable(); await w.write(new Blob([text],{type:'application/json'})); await w.close();
      if(asNew) APP.file.recentId='';
      APP.file.handle=h; APP.file.name=h.name;
      APP.dirty=false; APP.savedAt=new Date();
      await rememberRecent({handle:h});
    }catch(e){
      if(e && e.name==='AbortError') return false;
      toast('Could not save: '+friendly(e),'crit'); return false;
    }
  } else {
    const name=(asNew||!APP.file.name)?suggestName():APP.file.name;
    downloadBlob(name, new Blob([text],{type:'application/json'}));
    if(asNew) APP.file.recentId='';
    APP.file.name=name; APP.dirty=false; APP.savedAt=new Date();
    await rememberRecent({data:text});
  }
  await clearDraft();
  toast(fsOK()?'Saved to '+APP.file.name:'Saved — '+APP.file.name+' is in your Downloads folder');
  renderFileChip(); renderNav();
  return true;
}
function openState(s, file){

async function openFromText(text, file){

  toast('Opened '+(file.name||S.project.name||'project'));
}
async function openHandle(h){
  try{ if(!(await ensurePerm(h,false))) throw new Error('ESTORA was not allowed to read that file.');
    const f=await h.getFile(); await openFromText(await f.text(), {handle:h, name:h.name}); }
  catch(e){ toast('Could not open that file: '+friendly(e),'crit'); }
}

async function openRecent(id){
  const r=APP.recents.find(x=>x.id===id); if(!r) return;
  if(r.handle){
    try{ if(!(await ensurePerm(r.handle,false))) throw new Error('permission');
      const f=await r.handle.getFile();
      return openFromText(await f.text(), {handle:r.handle, name:r.handle.name, recentId:r.id}); }
    catch(e){ toast(`${r.fileName} could not be opened — it may have been moved or renamed. Use Open file to find it.`,'crit'); return; }
  }
  if(r.data) return openFromText(r.data, {handle:null, name:r.fileName, recentId:r.id});
  toast('That file is no longer available here — use Open file.','crit');
}

function appAddress(){
  try{ if(location.protocol==='file:') return ''; return location.origin+location.pathname.replace(/index\.html$/,''); }catch(e){ return ''; }
}
async function handleAuth(form){
  const v=id=>(document.getElementById(id)||{}).value||'';
  const kind=form.dataset.form, st=APP.store;
  APP.authError=''; APP.authNotice='';
  const fail=m=>{ APP.authBusy=false; APP.authError=m; renderRoot(); };
  const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  try{
    if(kind==='signin'){
      const e=v('si-email').trim(), p=v('si-pass');
      if(!okEmail(e)||!p) return fail('Enter your email and password.');
      APP.authBusy=true; renderRoot();
      await st.signIn(e,p); APP.authBusy=false; return enter();
    }
    if(kind==='register'){
      const org=v('rg-org').trim(), name=v('rg-name').trim(), e=v('rg-email').trim(), p=v('rg-pass');
      if(!org) return fail('Enter your company name.');
      if(!name) return fail('Enter your name.');
      if(!okEmail(e)) return fail('That email address does not look right.');
      if(p.length<8) return fail('Choose a password of at least 8 characters.');
      APP.authBusy=true; renderRoot();
      pending('org',{org,name});
      let r;
      try{ r=await st.signUp(e,p,appAddress()); }
      catch(err){ if(err.exists){ await st.signIn(e,p); APP.authBusy=false; return enter(); } throw err; }
      APP.authBusy=false;
      if(r.needsVerification){ APP.authEmail=e; APP.authScreen='verify'; renderRoot(); return; }
      return enter();
    }
    if(kind==='forgot'){
      const e=v('fg-email').trim(); if(!okEmail(e)) return fail('Enter your email.');
      APP.authBusy=true; renderRoot();
      await st.sendReset(e, appAddress());
      APP.authBusy=false; APP.authNotice='If that email has an account, a reset link is on its way.'; APP.authScreen='signin'; renderRoot(); return;
    }
    if(kind==='setpass'){
      const p=v('sp-pass'), p2=v('sp-pass2');
      if(p.length<8) return fail('Choose a password of at least 8 characters.');
      if(p!==p2) return fail('The two passwords are not the same.');
      APP.authBusy=true; renderRoot(); await st.setPassword(p); APP.authBusy=false; toast('Password saved'); return enter();
    }
    if(kind==='makeorg'){
      const org=v('no-org').trim(), name=v('no-name').trim(); if(!org) return fail('Enter your company name.');
      await st.rpc('es_register_org',{p_org_name:org, p_person_name:name}); return enter();
    }
  }catch(err){ fail(friendly(err)); }
}

function readLogo(file){
  return new Promise((res,rej)=>{
    if(!file) return rej(new Error('No file'));
    if(file.size>4*1024*1024) return rej(new Error('That image is larger than 4 MB.'));
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const max=520, sc=Math.min(1, max/img.width, 200/img.height);
        const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/png')); };
      img.onerror=()=>rej(new Error('That file could not be read as an image.')); img.src=fr.result; };
    fr.onerror=()=>rej(new Error('That file could not be read.')); fr.readAsDataURL(file);
  });
}

const curCode = () => (S && S.project.currency) || '';
const fileBase = () => String((S&&S.project.name)||'estimate').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,40)||'estimate';
function saveFile(name, bytes, type){
  downloadBlob(name, bytes instanceof Blob ? bytes : new Blob([bytes],{type:type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  toast('Downloaded '+name);
}
function describe(l){
  const t=TYPES[l.type]||TYPES.cabinet;
  if(t.fam==='door'){ const n=leafCount(l);
    return `${mm(num(l.W))} × ${mm(num(l.H))} mm opening · ${n>1?'double':'single'} leaf · ${CORE(l.core).n}${l.leafFinish?' · '+M(l.leafFinish).n:''}`; }
  if(t.fam==='profile'){ const p=PROFILE(l.profile); return `${p?p.n:'—'} · ${fmt(num(l.runM),2)} m · ${M(l.species).n}`; }
  const g=lineBuild(l).geo||{};
  return `${mm(num(l.W))} × ${mm(num(l.H))} × ${mm(num(l.D))} mm · ${int(l.doors)} doors · ${int(l.drawerQty)} ${g.inside?'inside ':''}drawers${l.carcaseFinish?' · '+M(l.carcaseFinish).n:''}`;
}
function sellTotals(){
  let cost=0, sell=0; S.lines.forEach(l=>{ const p=priceLine(l); cost+=p.cost*p.qty; sell+=p.amount; });
  const vat=sell*S.commercial.vatPct/100; return {cost, sell, vat, gross:sell+vat};
}

function timberSheet(){
  const tim=timberSummary();
  const rows=brandRows('Solid timber — '+(S.project.name||''), 'By species and nominal sawn thickness, m³ · Currency '+curCode());
  rows.push(headRow(['Species','Class','Sawn stock','Used for','Net m³','Wastage m³','To buy m³','Rate / m³','Value']));
  tim.forEach(t=>rows.push([C(t.n),C(t.cls),C(t.thk),C(t.parts.join(', ')),N(t.net),N(t.gross-t.net),N(t.gross),N(t.rate),N(t.amt)]));
  if(tim.length){
    const s=k=>tim.reduce((a,t)=>a+t[k],0);
    rows.push(['','','',{v:'Total',s:ST.bold},N(s('net')),N(s('gross')-s('net')),N(s('gross')),'',N(s('amt'))]);
    const mx=timberMatrix(tim);
    rows.push([],[{v:'By sawn thickness — m³ including wastage',s:ST.sect}]);
    rows.push(headRow(['Species',...mx.cols,'Total m³']));
    mx.groups.forEach(g=>{
      const gt=c=>tim.filter(t=>t.cls===g.cls && (!c||t.thk===c)).reduce((a,t)=>a+t.gross,0);
      rows.push([{v:g.cls,s:ST.bold},...mx.cols.map(c=>N(gt(c))),N(gt())]);
      g.rows.forEach(r=>rows.push([C('   '+r.n),...mx.cols.map(c=>N(r.by[c]||0)),N(Object.values(r.by).reduce((a,b)=>a+b,0))]));
    });

  return {name:'Timber', rows, widths:[26,12,12,40,12,12,12,12,14], freeze:7};

/* ---------------- PDF ---------------- */
const PDF_NEST=['#f0d4b4','#cfe2c4','#c3dbea','#ecccd3','#e6dcb0','#d4cbec'];
const pdfLineColor = id => PDF_NEST[lineIdx(id)%PDF_NEST.length];
async function pdfMeta(title, paper){
  return {title, subtitle:[S.project.name, S.project.code, S.project.client].filter(Boolean).join(' · '),
    org:(APP.org||{}).name||'', logo:(APP.org||{}).logo||'', paper:paper||'a4l',
    issued:new Date().toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
    footer:`${(APP.org||{}).name||''} · ${S.project.name||''} · ${title} · ESTORA`};
}
/* one document made of blocks: {h:'Heading', note}, {table:{columns, rows}}, {tiles:[[k,v]]}, {sheets:e}, {pagebreak:1} */
async function pdfBuild(meta, blocks){
  const paper=PDF_PAPER[meta.paper||'a4l']||PDF_PAPER.a4l;
  const doc=new PdfDoc(paper.w,paper.h,{title:meta.title,author:meta.org});
  const Mg=32, top=Mg+40, bottom=paper.h-Mg-6, width=paper.w-2*Mg;
  const FS=7.6, LH=9.4, PAD=3.2;
  const st={y:top};
  const newPage=()=>{ doc.addPage(); st.y=top; };
  newPage();
  const room=h=>{ if(st.y+h>bottom && st.y>top) newPage(); };

  function heading(text, note){
    room(40);
    doc.text(Mg,st.y+11,text,{size:11.5,bold:true}); st.y+=16;
    if(note){ pdfWrap(note,8,false,width).forEach(ln=>{ doc.text(Mg,st.y+8,ln,{size:8,color:'#555555'}); st.y+=10.5; }); }
    st.y+=4;
  }
  function tiles(list){
    const n=list.length, gap=8, w=(width-gap*(n-1))/n, h=38;
    room(h+10);
    list.forEach(([k,v,hi],i)=>{ const x=Mg+i*(w+gap);
      doc.rect(x,st.y,w,h,{fill:hi?'#fbe9d9':'#f6f7f9',stroke:hi?'#e3b48d':'#dde3ea',lw:0.6});
      doc.text(x+8,st.y+12,String(k).toUpperCase(),{size:6.5,color:'#666666',bold:true});
      doc.text(x+8,st.y+29,pdfFit(v,12,true,w-16),{size:12,bold:true,color:hi?'#8a3f0a':'#111111'}); });
    st.y+=h+14;
  }
  function table(sec){
    const cols=sec.columns;
    const tw=cols.reduce((a,c)=>a+(c.w||1),0);
    const cw=pdfColumnWidths(sec,width,FS,PAD)||cols.map(c=>(c.w||1)/tw*width);
    const cx=[]; cols.reduce((a,c,i)=>{ cx[i]=a; return a+cw[i]; },Mg);
    const headLines=cols.map((c,i)=>pdfWrap(c.label,FS,true,cw[i]-2*PAD));
    const headH=Math.max(...headLines.map(l=>l.length))*LH+2*PAD;
    const drawHead=cont=>{
      if(cont && sec.title){ doc.text(Mg,st.y+9,sec.title+'  (continued)',{size:9,bold:true,color:'#555555'}); st.y+=13; }
      doc.rect(Mg,st.y,width,headH,{fill:'#f6e7da'});
      cols.forEach((c,i)=>headLines[i].forEach((ln,k)=>
        doc.text(c.align==='right'?cx[i]+cw[i]-PAD:cx[i]+PAD,st.y+PAD+7+k*LH,ln,
          {size:FS,bold:true,color:'#1f2a33',align:c.align==='right'?'right':'left'})));
      st.y+=headH;
    };
    room(headH+30);
    drawHead(false);
    if(!sec.rows.length){ doc.text(Mg+PAD,st.y+12,sec.empty||'Nothing to report.',{size:8.5,color:'#666666'}); st.y+=20; }
    sec.rows.forEach((row,ri)=>{
      const cells=row.map(c=>c&&typeof c==='object'?c:{v:c});
      const lines=cells.map((c,i)=>pdfWrap(c.v==null?'':String(c.v),FS,!!c.bold,cw[i]-2*PAD));
      const n=Math.max(1,...lines.map(l=>l.length)), h=n*LH+2*PAD;
      if(st.y+h>bottom){ newPage(); drawHead(true); }
      const fill=cells.find(c=>c.rowFill);
      if(fill) doc.rect(Mg,st.y,width,h,{fill:fill.rowFill}); else if(ri%2) doc.rect(Mg,st.y,width,h,{fill:'#f8f9fb'});
      cells.forEach((c,i)=>{
        lines[i].forEach((ln,k)=>doc.text(cols[i].align==='right'?cx[i]+cw[i]-PAD:cx[i]+PAD,
          st.y+PAD+7+k*LH,ln,{size:FS,bold:!!c.bold,color:c.color||'#1a1a1a',align:cols[i].align==='right'?'right':'left'}));
      });
      doc.line(Mg,st.y+h,Mg+width,st.y+h,{color:'#dde3ea',lw:0.4});
      st.y+=h;
    });
    st.y+=14;
  }
  function sheets(e){
    const info=e.info, pk=e.pack, L=info.L, Wd=info.W, tr=pk.tr||0;
    if(pk.est){ heading('Layout not drawn','Too many pieces to draw — the count is estimated from net area at 85% yield.'); return; }
    // identical sheets are drawn once
    const groups=[], idx=new Map();
    pk.sheets.forEach((sh,i)=>{ const sig=sh.placed.map(p=>[p.x,p.y,p.w,p.h].map(v=>v.toFixed(4)).join(',')+p.lineId+p.part).join('|');
      if(idx.has(sig)) groups[idx.get(sig)].n++; else { idx.set(sig,groups.length); groups.push({sh, first:i+1, n:1}); } });
    // legend
    const ids=[...new Set(e.pieces.map(p=>p.lineId))];
    let lx=Mg; room(14);
    ids.forEach(id=>{ const l=lineById(id), label=`${id} ${l?(TYPES[l.type]||TYPES.cabinet).n:''}`, w=pdfWidth(label,7,false)+18;
      if(lx+w>Mg+width){ lx=Mg; st.y+=11; room(12); }
      doc.rect(lx,st.y+1,8,8,{fill:pdfLineColor(id),stroke:'#888888',lw:0.4}); doc.text(lx+11,st.y+8,label,{size:7,color:'#333333'}); lx+=w; });
    st.y+=16;
    const per=2, gap=16, cellW=(width-gap*(per-1))/per, maxH=Math.min(200,(bottom-top)/2-26);
    const sc=Math.min(cellW/L, maxH/Wd), sw=L*sc, sh=Wd*sc, rowH=sh+24;
    for(let i=0;i<groups.length;i+=per){
      if(st.y+rowH>bottom){ newPage(); doc.text(Mg,st.y+9,`${info.name} — cutting layout (continued)`,{size:9,bold:true,color:'#555555'}); st.y+=16; }
      groups.slice(i,i+per).forEach((g,j)=>{
        const x0=Mg+j*(cellW+gap), y0=st.y;
        doc.rect(x0,y0,sw,sh,{fill:'#ffffff',stroke:'#777777',lw:0.8});
        if(tr>0) doc.line(x0+tr*sc,y0+tr*sc,x0+(L-tr)*sc,y0+tr*sc,{color:'#999999',lw:0.4,dash:'2 2'}),
                 doc.line(x0+tr*sc,y0+(Wd-tr)*sc,x0+(L-tr)*sc,y0+(Wd-tr)*sc,{color:'#999999',lw:0.4,dash:'2 2'}),
                 doc.line(x0+tr*sc,y0+tr*sc,x0+tr*sc,y0+(Wd-tr)*sc,{color:'#999999',lw:0.4,dash:'2 2'}),
                 doc.line(x0+(L-tr)*sc,y0+tr*sc,x0+(L-tr)*sc,y0+(Wd-tr)*sc,{color:'#999999',lw:0.4,dash:'2 2'});
        g.sh.placed.forEach(p=>{
          const x=x0+(tr+p.x)*sc, y=y0+(tr+p.y)*sc, w=p.w*sc, h=p.h*sc;
          doc.rect(x,y,w,h,{fill:p.over?'#f7d0cb':pdfLineColor(p.lineId),stroke:p.over?'#b23a2e':'#555555',lw:0.4});
          if(w>16 && h>8) doc.text(x+2,y+7,pdfFit(p.lineId,5.8,true,w-3),{size:5.8,bold:true});
          if(w>34 && h>15) doc.text(x+2,y+13.5,pdfFit(`${mm(p.w)}×${mm(p.h)}`,5.3,false,w-3),{size:5.3,color:'#333333'});
          if(w>54 && h>22) doc.text(x+2,y+19.5,pdfFit(p.part,5,false,w-3),{size:5,color:'#555555'});
        });
        const used=g.sh.placed.reduce((a,p)=>a+(p.over?0:p.w*p.h),0);
        doc.text(x0,y0+sh+10,`${info.core?'Blank':'Sheet'} ${g.first}${g.n>1?` · ×${g.n} identical`:''} · ${fmt(used/(L*Wd)*100,0)}% used · ${g.sh.placed.length} pcs`,{size:7.2,color:'#444444'});
      });
      st.y+=rowH;
    }
    st.y+=6;
  }
  for(const b of blocks){
    if(b.pagebreak){ if(st.y>top) newPage(); continue; }
    if(b.h) heading(b.h, b.note);
    if(b.tiles) tiles(b.tiles);
    if(b.table) table(b.table);
    if(b.sheets) sheets(b.sheets);
  }
  await pdfFrame(doc, meta);
  return doc.output();
}

    (S.profiles=S.profiles||[]).push({id, kind, n:'New profile', ...base}); commit(); focusSoon(`input[data-prof="${id}"][data-k="n"]`); return; }
  if(ds.act==='prof-del'){ const p=PROFILE(ds.id); if(!p || profileUse(p)) return;
    S.profiles=S.profiles.filter(x=>x.id!==ds.id); commit(); toast('Profile removed'); return; }
  if(ds.act==='size-add'){ const id=uniqueId('SZC','sizeSeq',x=>(S.sizes||[]).some(z=>z.id===x));
    (S.sizes=S.sizes||[]).push({id, type:'door', n:'New size', W:0.9, H:2.1}); S.sizesTouched=true; commit(); focusSoon(`input[data-szrow="${id}"][data-k="n"]`); return; }
  if(ds.act==='size-del'){ S.sizes=(S.sizes||[]).filter(z=>z.id!==ds.id); S.sizesTouched=true;
    S.lines.forEach(l=>{ if(l.size===ds.id) l.size=''; }); commit(); return; }
  if(ds.act==='thk-add'){ const last=(S.thk||[]).slice(-1)[0]; (S.thk=S.thk||[]).push({n:'New', max:last?num(last.max)+25:22}); commit(); return; }
  if(ds.act==='thk-del'){ if((S.thk||[]).length<=1) return; S.thk.splice(+ds.id,1); commit(); return; }

  // rates
  if(t.id==='btnAddType'){
    const id=uniqueId('T','typeSeq',x=>S.types.some(tp=>tp.id===x));
    S.types.push({id, n:'New type', kind:'other'}); commit(); toast('Material type added');
    focusSoon(`input.tname[data-type="${id}"]`); return; }
  if(ds.delType){ const id=ds.delType;
    if(S.materials.some(m=>m.g===id) || SEED_TYPE_IDS.has(id)) return;
    S.types=S.types.filter(tp=>tp.id!==id); commit(); toast('Type removed'); return; }
  if(ds.addMat){ const g=ds.addMat, tp=typeById(g), kind=tp?tp.kind:'other';
    const u=KIND_UNIT[kind]||'no', id=uniqueId('CM','matSeq',x=>S.materials.some(m=>m.id===x));
    const m={id, g, n:'New '+(tp?tp.n.replace(/s$/,'').toLowerCase():'material'), u, r:0};
    if(u==='sheet'){ m.sl=S.params.sheetL; m.sw=S.params.sheetW; m.t=kind==='board'?18:(kind==='top'?12:undefined); }
    if(kind==='timber') m.cls='hard';
    S.materials.push(m); commit(); toast('Material added to '+(tp?tp.n:'type'));
    focusSoon(`input[data-mat="${id}"][data-k="n"]`); return; }
  if(ds.delMaterial){ const id=ds.delMaterial;
    if(PROTECTED_MATERIALS.has(id)) return;
    S.materials=S.materials.filter(m=>m.id!==id); commit(); toast('Material removed'); return; }
  if(t.id==='btnAddCore'){ const id=uniqueId('CC','coreSeq',x=>S.cores.some(c=>c.id===x));
    S.cores.push({id, n:'New core', r:0, t:44, fr:0, one:1}); commit(); toast('Core added');
    focusSoon(`input[data-core="${id}"][data-k="n"]`); return; }
  if(ds.delCore){ if(ds.delCore==='NONE') return;
    S.cores=S.cores.filter(c=>c.id!==ds.delCore); commit(); toast('Core removed'); return; }
  if(t.id==='btnAddTrans'){ S.transport.push(['NEW LOCATION',0]); commit(); toast('Location added');
    focusSoon(`input[data-transname="${S.transport.length-1}"]`); return; }
  if(ds.delTrans!==undefined && ds.delTrans!==''){
    if(S.transport.length<=1) return;
    const i=+ds.delTrans; const removedName=S.transport[i]?S.transport[i][0]:null;
    S.transport.splice(i,1);
    if(removedName && S.project.location===removedName){
      S.project.location = S.transport[0][0];
      toast('Active location removed — switched to '+S.project.location);
    } else toast('Location removed');
    renderProject(); commit(); return; }
  if(t.id==='btnAddIron'){ const id=uniqueId('CI','ironSeq',x=>S.ironItems.some(i=>i.id===x));
    S.ironItems.push({id, n:'New item', r:0}); commit(); toast('Item added');
    focusSoon(`input[data-iron="${id}"][data-k="n"]`); return; }
  if(ds.delIron){ if(S.ironSets.some(s=>s.items.some(x=>x[0]===ds.delIron))) return;
    S.ironItems=S.ironItems.filter(i=>i.id!==ds.delIron); commit(); toast('Item removed'); return; }
});
// one item changed its hardware: redraw that card, reprice everything
function changed(id){ dirty(); renderCard(id); softRefresh(); scheduleSave(); }

document.addEventListener('click', e=>{
  const wrap=document.getElementById('panel')?.querySelector('.addwrap');
  const menu=document.getElementById('addMenu');
  if(!wrap || !menu || menu.hidden) return;
  if(!wrap.contains(e.target)) menu.hidden=true;
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ const menu=document.getElementById('addMenu'); if(menu) menu.hidden=true; }
});
const DIM_KEYS = new Set(['W','H','D']);
ROOT.addEventListener('input',e=>{ if(!e.target.closest('#panel')) return; if(!S) return;
  const el=e.target, ds=el.dataset;
  if(el.id==='rateFilter'){ liveFilter('rates', el.value); return; }
  if(el.id==='paramFilter'){ liveFilter('params', el.value); return; }
  if(!canEditLines()) return;
  dirty();
  const nv = () => el.value===''?undefined:parseFloat(el.value);
  let touched=true;
  if(ds.line){
    const l=lineById(ds.line); if(!l) return;
    const k=ds.k;
    if(k==='size'){
      const z=(S.sizes||[]).find(x=>x.id===el.value); l.size=el.value;
      if(z){ ['W','H','D'].forEach(d=>{ if(z[d]!==undefined && z[d]!=='' && d in l) l[d]=num(z[d]); }); }
      renderCard(l.id); softRefresh();
    } else {
      l[k] = el.type==='checkbox' ? el.checked
           : (el.type==='number' ? (el.value===''?0:parseFloat(el.value)) : el.value);
      if(DIM_KEYS.has(k) && l.size){ l.size=''; const s=document.getElementById(`f_${l.id}_size`); if(s) s.value=''; }
      if(el.tagName==='SELECT' && ['drawerType','leaves','core','ironSet','type'].includes(k)){ if(k==='ironSet') delete l.iron; renderCard(l.id); }
      softRefresh();
    }
  }
  else if(ds.hwq || ds.hwmid){
    const [id,key]=splitKey(ds.hwq||ds.hwmid), l=lineById(id); if(!l) return;
    const o=lineHw(l).ovr, cur={...(o[key]||{})};
    if(ds.hwq){ if(el.value==='') delete cur.q; else cur.q=Math.max(0,parseFloat(el.value)||0); }
    else { const b=(lineBuild(l).hw||[]).find(x=>x.key===key); if(b && el.value===b.autoMid) delete cur.mid; else cur.mid=el.value; }
    if(Object.keys(cur).length) o[key]=cur; else delete o[key];
    dirty(); if(ds.hwmid) renderCard(id); softRefresh();
  }
  else if(ds.hwxq || ds.hwxmid){
    const [id,i]=splitKey(ds.hwxq||ds.hwxmid), l=lineById(id); if(!l) return;
    const x=lineHw(l).extra[+i]; if(!x) return;
    if(ds.hwxq) x.q=Math.max(0,parseFloat(el.value)||0); else x.mid=el.value;
    dirty(); if(ds.hwxmid) renderCard(id); softRefresh();
  }
  else if(ds.irq || ds.irid){
    const [id,i]=splitKey(ds.irq||ds.irid), l=lineById(id); if(!l) return;
    const it=lineIron(l).items[+i]; if(!it) return;
    if(ds.irq) it[1]=Math.max(0,parseFloat(el.value)||0); else it[0]=el.value;
    dirty(); if(ds.irid) renderCard(id); softRefresh();
  }
  else if(ds.mat){
    const m=S.materials.find(x=>x.id===ds.mat);
    if(m){
      const k=ds.k;
      if(el.type==='checkbox') m[k]=el.checked?1:0;
      else if(k==='n'||k==='g'||k==='u'||k==='cls') m[k]=el.value;
      else m[k]=nv();
    }
    if(el.tagName==='SELECT' || el.type==='checkbox') renderPanel();
    renderTotals();
  }
  else if(ds.type){
    const tp=typeById(ds.type);
    if(tp){ if(ds.k==='n') tp.n=el.value; else { tp.kind=el.value; renderPanel(); } }
    renderTotals();
  }
  else if(ds.core){
    const c=S.cores.find(x=>x.id===ds.core);
    if(c){ const k=ds.k;
      if(k==='n') c.n=el.value;
      else if(el.type==='checkbox') c[k]=el.checked?1:0;
      else if(k==='sl'||k==='sw') c[k]=nv();
      else c[k]=parseFloat(el.value)||0; }
    renderTotals();
  }
  else if(ds.iron){
    const i=S.ironItems.find(x=>x.id===ds.iron);
    if(i){ const k=ds.k; if(k==='n') i.n=el.value; else i.r=parseFloat(el.value)||0; }
    renderTotals();
  }
  else if(ds.setname){ const s=S.ironSets.find(x=>x.id===ds.setname); if(s) s.n=el.value; }
  else if(ds.setitem || ds.setq){
    const [sid,i]=splitKey(ds.setitem||ds.setq), s=S.ironSets.find(x=>x.id===sid), it=s&&s.items[+i]; if(!it) return;
    if(ds.setitem){ it[0]=el.value; renderPanel(); } else it[1]=Math.max(0,parseFloat(el.value)||0);
    renderTotals();
  }
  else if(ds.prof){
    const p=PROFILE(ds.prof); if(p){ const k=ds.k; if(k==='n') p.n=el.value; else p[k]=Math.max(0,parseFloat(el.value)||0); }
    renderTotals();
  }
  else if(ds.szrow){
    const z=(S.sizes||[]).find(x=>x.id===ds.szrow); S.sizesTouched=true;
    if(z){ const k=ds.k; if(k==='n'||k==='type') z[k]=el.value; else z[k]=nv(); if(k==='type') renderPanel(); }
  }
  else if(ds.thk!==undefined && ds.thk!==''){
    const x=(S.thk||[])[+ds.thk]; if(x){ if(ds.k==='n') x.n=el.value; else x.max=Math.max(0,parseFloat(el.value)||0); }
  }
  else if(ds.transname!==undefined && ds.transname!==''){
    const i=+ds.transname; const old=S.transport[i][0];
    S.transport[i][0]=el.value;
    if(S.project.location===old) S.project.location=el.value;
    renderProject();
  }
  else if(ds.trans!==undefined && ds.trans!==''){
    S.transport[+ds.trans][1]=parseFloat(el.value)||0; renderTotals(); }
  else if(ds.param){ S.params[ds.param]=parseFloat(el.value)||0; renderTotals(); }
  else if(ds.comm){ S.commercial[ds.comm]=parseFloat(el.value)||0; renderTotals(); }
  else touched=false;
  if(touched) scheduleSave();
});
// typed quantities redraw their table once the field is left, so the amounts catch up
ROOT.addEventListener('change',e=>{ if(!e.target.closest('#panel') || !S) return;
  const ds=e.target.dataset;
  const k=ds.hwq||ds.hwxq||ds.irq; if(k){ renderCard(splitKey(k)[0]); return; }
  if(ds.setq || ds.prof || ds.iron) renderPanel();
});
function liveFilter(scope, q){
  q=(q||'').trim().toLowerCase();
  const root=document.querySelector(`#panel [data-scope="${scope}"]`); if(!root) return;
  root.querySelectorAll('[data-q]').forEach(row=>{
    row.hidden = !!q && !row.dataset.q.includes(q);
  });
  root.querySelectorAll('.grp').forEach(grp=>{
    const rows=grp.querySelectorAll('[data-q]');
    if(!rows.length){ grp.hidden=!!q; return; }
    grp.hidden = ![...rows].some(r=>!r.hidden);
  });
}
/* reprice every card in place (sheet shares move when any item changes) without losing focus */
function softRefresh(){
  const act=document.activeElement;
  document.querySelectorAll('#panel .card[data-card]').forEach(c=>{
    const l=lineById(c.dataset.card); if(!l) return;
    const p=priceLine(l);
    c.querySelector('.lmoney').innerHTML=moneyHtml(p);
    const sub=c.querySelector('.ltitle .sub'); if(sub) sub.innerHTML=subText(l,p);
    const w=c.querySelector('.warnslot'); if(w) w.innerHTML=warnHtml(p.warn);
    const bd=c.querySelector('.bdmat'); if(bd) bd.outerHTML=breakdown(p);
    const cu=c.querySelector('.bdcut'); if(cu) cu.outerHTML=cutSection(l,p);
    const hw=c.querySelector('.hwsec'); if(hw && !hw.contains(act)){ hw.outerHTML=hwSection(l,p); if(typeof lockPanel==='function') lockPanel(); }
  });
  renderTotals();
}
function commit(){ dirty(); renderTotals(); renderNav(); renderPanel(); scheduleSave(); }

ROOT.addEventListener('input',e=>{
  const id=e.target.id;
  const k={pName:'name',pClient:'client',pCode:'code',pLoc:'location',pAccess:'access',pCur:'currency',pStatus:'status'}[id];
  if(!k || !S || !canEditLines()) return;
  S.project[k] = id==='pAccess' ? (parseFloat(e.target.value)||1) : e.target.value;
  dirty(); renderTotals();
  if(id==='pName'){ renderNav(); renderTop(); }
  if(['estimate','bom','iron','cutting'].includes(APP.view) && !['pName','pClient','pCode'].includes(id)) renderPanel();
  scheduleSave();
});

boot();
</script>
