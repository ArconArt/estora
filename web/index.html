:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --surface-inset:#f8f9fb;
  --border:#e3e6eb; --border-strong:#ccd1d9;
  --ink:#14161a; --ink-2:#565b66; --ink-3:#8a909b;
  --accent:#c2570f; --accent-ink:#8a3f0a; --accent-soft:#fbe9d9;
  --ok:#1f7a4d; --ok-soft:#e1f5ea;
  --warn:#96650a; --warn-soft:#fbf0d8;
  --crit:#b23a2e; --crit-soft:#fbe3e0;
  --nest-1:#f0d4b4; --nest-2:#cfe2c4; --nest-3:#c3dbea; --nest-4:#ecccd3; --nest-5:#e6dcb0; --nest-6:#d4cbec;
  --shadow:0 1px 2px rgba(20,22,26,.04), 0 6px 18px -10px rgba(20,22,26,.16);
  --ui:"SaudiRiyal","Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"SaudiRiyal","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1012; --surface:#17181b; --surface-2:#1d1f23; --surface-inset:#0d0e10;
  --border:#292b30; --border-strong:#3a3d44;
  --ink:#eef0f3; --ink-2:#a7acb7; --ink-3:#767b86;
  --accent:#e08a45; --accent-ink:#f2b07a; --accent-soft:#3a2413;
  --ok:#4bdb9a; --ok-soft:#0f2b1e;
  --warn:#e2b653; --warn-soft:#2e260f;
  --crit:#ef6f60; --crit-soft:#341412;
  --nest-1:#5a4128; --nest-2:#2c4a31; --nest-3:#24445a; --nest-4:#52303c; --nest-5:#4a4424; --nest-6:#3a3158;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 18px -10px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1012; --surface:#17181b; --surface-2:#1d1f23; --surface-inset:#0d0e10;
  --border:#292b30; --border-strong:#3a3d44;
  --ink:#eef0f3; --ink-2:#a7acb7; --ink-3:#767b86;
  --accent:#e08a45; --accent-ink:#f2b07a; --accent-soft:#3a2413;
  --ok:#4bdb9a; --ok-soft:#0f2b1e;
  --warn:#e2b653; --warn-soft:#2e260f;
  --crit:#ef6f60; --crit-soft:#341412;
  --nest-1:#5a4128; --nest-2:#2c4a31; --nest-3:#24445a; --nest-4:#52303c; --nest-5:#4a4424; --nest-6:#3a3158;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 18px -10px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;
  line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{display:block}
.ic{display:inline-flex;width:16px;height:16px;flex:none}
.ic svg{width:100%;height:100%}

/* ---------- app shell ---------- */
.app{display:flex;align-items:stretch;min-height:100vh}
.sidenav{width:222px;flex:0 0 222px;border-right:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;gap:20px;padding:20px 14px;
  position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;
  max-height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.brand .bname{font-weight:800;font-size:16.5px;letter-spacing:-.01em;line-height:1.15}
.brand .tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
#navList{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  color:var(--ink-2);font-weight:700;font-size:13px;background:none;border:0;text-align:left;width:100%}
.navitem .ic{opacity:.85}
.navitem .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navitem .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3);
  background:var(--surface-2);padding:1px 6px;border-radius:20px}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.active{background:var(--accent-soft);color:var(--accent-ink)}
.navitem.active .cnt{background:rgba(0,0,0,.06);color:var(--accent-ink)}
.sidefoot{margin-top:auto;padding:10px 6px 2px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.statusline{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--ok)}
.dot.busy{background:var(--warn)}
.pub{font-size:10px;color:var(--ink-3)}

.main{flex:1 1 auto;min-width:0}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);
  border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;gap:12px}
.appbar .mbrand{display:none;align-items:center;gap:8px;font-weight:800;font-size:15px}
.appbar .mbrand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex:none}
.appbar h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.01em}
.appbar .spacer{flex:1}

.metarow{display:flex;flex-wrap:wrap;gap:20px 26px;padding:14px 22px;border-bottom:1px solid var(--border)}
.metafield{display:flex;flex-direction:column;gap:3px;min-width:120px}
.metafield .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.metafield input,.metafield select{border:0;border-bottom:1.5px solid var(--border-strong);background:none;
  font-weight:700;font-size:13.5px;padding:2px 0;color:var(--ink);min-width:90px}
.metafield input:focus,.metafield select:focus{outline:none;border-color:var(--accent);color:var(--accent-ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px;padding:16px 22px 4px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:5px;letter-spacing:-.01em;white-space:nowrap}
.stat.hi{border-color:color-mix(in srgb, var(--accent) 45%, var(--border));background:var(--accent-soft)}
.stat.hi .v{color:var(--accent-ink)}
.stat.mg .v{color:var(--ok)}

.panel{padding:18px 22px 60px}
h2.sec{font-size:11px;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:26px 0 10px;font-weight:600}
h2.sec:first-child{margin-top:0}
.grp[hidden]{display:none}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--border-strong);background:var(--surface);padding:8px 14px;border-radius:9px;
  font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn.gho{border-color:transparent;background:none;color:var(--ink-3)}
.btn.gho:hover{color:var(--crit);background:var(--crit-soft)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar .spacer{flex:1 1 auto}
.confirm-inline{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);
  background:var(--crit-soft);border:1px solid var(--crit);border-radius:9px;padding:6px 6px 6px 12px}
.rmbtn{border:0;background:none;color:var(--ink-3);padding:5px;border-radius:7px;display:inline-flex}
.rmbtn:hover{color:var(--crit);background:var(--crit-soft)}
.rmbtn:disabled{opacity:.35;cursor:not-allowed}
.rmbtn:disabled:hover{color:var(--ink-3);background:none}

/* ---------- add-item popover ---------- */
.addwrap{position:relative}
.addmenu{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border);
  border-radius:11px;box-shadow:0 10px 28px -8px rgba(0,0,0,.28);padding:6px;min-width:230px;z-index:20;
  display:flex;flex-direction:column;gap:1px}
.addmenu[hidden]{display:none}
.addmenu button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;
  background:none;text-align:left;font-weight:700;font-size:12.5px;color:var(--ink);width:100%}
.addmenu button:hover{background:var(--surface-2)}
.addmenu .ic{color:var(--accent-ink)}

/* ---------- line cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;margin-bottom:12px;
  overflow:hidden;box-shadow:var(--shadow)}
.lhead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;flex:none}
.avatar .ic{width:18px;height:18px}
.avatar.door{background:var(--warn-soft);color:var(--warn)}
.ltitle{flex:1 1 170px;min-width:0}
.ltitle .name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:2px}
.ltitle .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--ink-3);background:var(--surface-2);
  padding:1px 6px;border-radius:20px;margin-left:6px}
.badge.door{background:var(--warn-soft);color:var(--warn)}
.lmoney{display:flex;gap:16px;align-items:baseline;margin-left:auto}
.lmoney div{text-align:right}
.lmoney .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lmoney .v{font-family:var(--mono);font-size:13.5px;font-weight:700;white-space:nowrap}
.lmoney .v.big{font-size:15.5px;color:var(--accent-ink)}
.chev{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:var(--surface);flex:none;color:var(--ink-3)}
.chev:hover{background:var(--surface-2);color:var(--ink)}
.chev .ic{transition:transform .15s}
.chev.open .ic{transform:rotate(180deg)}
.tchev{display:inline-flex;width:16px;height:16px;color:var(--ink-3);transition:transform .15s}
.tchev.open{transform:rotate(180deg)}

.dimrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));background:var(--surface);overflow:hidden;border-bottom:1px solid var(--border)}
.dcell{padding:8px 11px;background:var(--surface);min-width:0;box-shadow:1px 0 0 var(--border), 0 1px 0 var(--border)}
.dcell span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcell input,.dcell select{width:100%;border:0;background:none;font-weight:700;font-size:13px;padding:1px 0;
  font-family:var(--mono);color:var(--ink)}
.dcell select{font-family:var(--ui);font-size:12px}
.dcell input:focus,.dcell select:focus{outline:none;color:var(--accent-ink)}
.dcell.chk{display:flex;align-items:center;gap:7px;padding-top:15px}
.dcell.chk input{width:auto}
.dcell.chk label{font-size:12px;font-weight:700}
.dsep{grid-column:1/-1;background:var(--surface-inset);padding:5px 11px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.warnrow{display:flex;flex-direction:column;gap:3px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--warn-soft)}
.warnchip{font-size:12px;color:var(--warn);font-weight:700;display:flex;gap:7px;align-items:flex-start}
.warnchip .ic{width:14px;height:14px;margin-top:2px}
.lfoot{padding:8px 12px;display:flex;gap:8px;align-items:center}

/* ---------- breakdown ---------- */
.bd{background:var(--surface-inset);border-top:1px solid var(--border);padding:4px 0;overflow-x:auto}
.bd table{width:100%;border-collapse:collapse;font-size:12px}
.bd td{padding:5px 14px;border-bottom:1px solid var(--border)}
.bd tr:last-child td{border-bottom:0}
.bd .g td{background:var(--surface-2);font-family:var(--mono);font-size:9px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:6px 14px}
.bd .s td{font-weight:700;background:var(--surface-2)}
.bd .nt td{font-size:11px;color:var(--ink-3);font-style:italic}
.bd td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bd td.d{color:var(--ink-2)}
.bd .mut{display:block;font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}

/* ---------- BOM expand / cutting layout ---------- */
.bomrow{cursor:pointer}
.bomrow:hover td{background:var(--surface-inset)}
.bomrow.open td{background:var(--surface-inset);font-weight:700}
.bomexpand{padding:16px;background:var(--surface-inset);border-top:1px solid var(--border)}
.subhead{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:18px 0 8px}
.subhead:first-child{margin-top:0}
.nestnote{font-size:11.5px;color:var(--ink-3);margin-bottom:10px;max-width:72ch}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.kv>div{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 11px;min-width:92px}
.kv .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv .v{font-family:var(--mono);font-size:12.5px;font-weight:700;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-2);margin:0 0 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--border-strong)}
.nestgrid{display:flex;flex-wrap:wrap;gap:14px}
.sheetbox{margin:0;display:flex;flex-direction:column;gap:5px;max-width:100%}
.sheetbox svg{max-width:100%;height:auto}
.sheetbox .st{font-family:var(--mono);font-size:8.5px;font-weight:700;fill:var(--ink)}
.sheetbox .sd{font-family:var(--mono);font-size:7.5px;fill:var(--ink-2)}
.sheetcap{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.cutlist{max-height:340px;overflow:auto}

/* ---------- data tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:16px}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
table.grid th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);padding:9px 12px;
  border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600;vertical-align:bottom}
table.grid td{padding:6px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.grid tr:last-child td{border-bottom:0}
table.grid tbody tr:hover td{background:var(--surface-inset)}
table.grid tr[hidden]{display:none}
table.grid th.num,table.grid td.num{text-align:right}
table.grid td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.grid th.c,table.grid td.c{text-align:center}
table.grid tfoot td{font-weight:700;border-top:1px solid var(--border-strong);border-bottom:0}
table.grid input{width:100%;border:1px solid transparent;background:none;padding:4px 6px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;border-radius:6px}
table.grid input[type=text]{text-align:left;font-family:var(--ui)}
table.grid input[type=checkbox]{width:auto}
table.grid input:hover{border-color:var(--border)}
table.grid input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
table.grid select{width:100%;border:1px solid transparent;background:none;padding:4px 6px;
  font-family:var(--ui);font-size:12px;border-radius:6px}
table.grid select:hover{border-color:var(--border)}
table.grid select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
table.grid td.lab{color:var(--ink-2)}
table.grid td.dash{color:var(--ink-3);text-align:center}
.tw.inner{margin-bottom:0}
.flag{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 6px;
  border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--ink-3)}
.namecell{display:flex;align-items:center;gap:6px}
.namecell input{flex:1 1 auto;min-width:120px}

.typehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:28px 0 10px}
.typehead .tname{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  color:var(--ink-2);border:1px solid transparent;background:none;padding:4px 7px;border-radius:7px;width:auto;min-width:0;
  field-sizing:content;max-width:100%}
.typehead .tname:hover{border-color:var(--border)}
.typehead .tname:focus{outline:none;border-color:var(--accent);background:var(--surface);color:var(--ink)}
.typehead .kind{font-size:11.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.typehead .kind select{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:3px 6px;font-size:11.5px}
.typehead .spacer{flex:1 1 auto}
.typehead:first-child{margin-top:0}

.filterbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:11px;padding:8px 12px;margin-bottom:16px;max-width:360px}
.filterbar .ic{color:var(--ink-3)}
.filterbar input{border:0;background:none;width:100%;font-size:13px;color:var(--ink)}
.filterbar input:focus{outline:none}

.note{border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 11px 11px 0;padding:12px 15px;margin-bottom:18px;font-size:12.5px;color:var(--ink-2);max-width:110ch}
.note strong{color:var(--ink)}
.empty{border:1.5px dashed var(--border-strong);border-radius:14px;padding:40px 20px;text-align:center;
  color:var(--ink-3);background:var(--surface-inset)}
.empty .ic{width:26px;height:26px;margin:0 auto 10px;color:var(--ink-3)}
.empty p{margin:0 0 14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.pnote{font-size:11px;color:var(--ink-3)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:11px;font-size:12.5px;font-weight:700;box-shadow:0 10px 28px -8px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;max-width:82vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.crit{background:var(--crit);color:#fff}

@media (max-width:900px){
  .app{flex-direction:column}
  .sidenav{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;flex:none;flex-direction:row;
    max-height:none;border-right:0;border-top:1px solid var(--border);gap:0;align-items:stretch;
    padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));overflow-x:auto;overflow-y:hidden;z-index:15}
  .brand,.sidefoot{display:none}
  #navList{flex-direction:row;flex:1;justify-content:space-between}
  .navitem{flex-direction:column;gap:3px;padding:7px 8px;font-size:9.5px;white-space:nowrap;border-radius:9px}
  .navitem .cnt{margin-left:0;padding:0 5px}
  .main{padding-bottom:70px}
  .appbar .mbrand{display:flex}
  .panel,.metarow,.appbar{padding-left:16px;padding-right:16px}
  .stats{padding-left:16px;padding-right:16px}
  .bomexpand{position:sticky;left:0;width:calc(100vw - 34px)}
}
@media (max-width:520px){
  .lmoney{width:100%;margin-left:0;justify-content:space-between}
  .lhead{flex-wrap:wrap}
  .bomexpand{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= ESTORA app shell ================= */
[hidden]{display:none!important}
.brand .btag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.mprod{display:none}
/* Control Room frame: the page never scrolls; the work area does, and the footer is always at the bottom */
html,body{height:100%}
body{overflow:hidden}
#root{height:100vh;height:100dvh;display:flex;flex-direction:column}
.app{flex:1 1 auto;min-height:0;display:flex}
.sidenav{position:static;align-self:stretch;height:auto;max-height:none;overflow-y:auto}
.main{flex:1 1 auto;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.appbar{top:0}
.authmain{overflow-y:auto}
.appfoot{flex:none;padding-bottom:calc(7px + env(safe-area-inset-bottom,0px))}
.prod{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.prod svg{width:22px;height:22px;border-radius:6px;flex:none}
.orglogo{max-height:30px;max-width:150px;width:auto;object-fit:contain;display:block}
.orglogo.dark{background:#11161d;padding:4px 8px;border-radius:6px}
.topdiv{width:1px;height:22px;background:var(--border-strong);flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:9px;width:34px;height:34px;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.userchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);
  border-radius:20px;padding:3px 10px 3px 3px;font-size:12px;font-weight:700;color:var(--ink-2);max-width:220px}
.userchip .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex:none}
.userchip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navsec{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  padding:14px 10px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navsec:first-child{padding-top:2px}
.navproj{font-size:12.5px;font-weight:800;color:var(--ink);padding:2px 10px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidefoot .by{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sidefoot img{width:64px;height:auto;opacity:.55}
.appfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:7px 16px;background:var(--surface);border-top:1px solid var(--border);min-height:40px}
.appfoot-logo{height:26px;width:auto;object-fit:contain;display:block;flex:none}
.appfoot-text{font-size:11.5px;color:var(--ink-3);text-align:right;letter-spacing:.01em}
:root[data-theme="dark"] .appfoot-logo,:root[data-theme="dark"] .sidefoot img{filter:invert(1) brightness(1.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .appfoot-logo,
  :root:not([data-theme="light"]) .sidefoot img{filter:invert(1) brightness(1.7)}}

/* ---------- auth ---------- */
.authtop{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface)}
.authtop .spacer{flex:1}
.authmain{flex:1 1 auto;padding:48px 16px 60px}
.authwrap{max-width:390px;margin:0 auto}
.authhd{text-align:center;margin-bottom:20px}
.authhd .mk{width:52px;height:52px;margin:0 auto 14px}
.authhd .mk svg{width:100%;height:100%;border-radius:12px}
.authhd h1{font-size:22px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.authhd p{margin:0;color:var(--ink-2);font-size:13.5px}
.authcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label,.field .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select,.field textarea{border:1px solid var(--border);background:var(--surface-inset);border-radius:9px;
  padding:9px 11px;font-size:14px;color:var(--ink);width:100%}
.field textarea{font-family:var(--mono);font-size:12.5px;line-height:1.55;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:0 12px}
.authgo{width:100%;justify-content:center;padding:10px 14px;font-size:13.5px}
.authfoot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px;font-size:12.5px;color:var(--ink-3);align-items:center}
.authnote{font-size:13px;color:var(--ink-2);margin:0 0 14px}
.banner{display:flex;align-items:flex-start;gap:10px;border-radius:10px;padding:10px 13px;font-size:12.5px;margin-bottom:14px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2)}
.banner .ic{margin-top:1px}
.banner .grow{flex:1 1 auto;min-width:0}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--border));color:var(--ink-2)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,var(--border));color:var(--ink)}
.banner.crit{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 45%,var(--border));color:var(--ink)}
.banner.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,var(--border));color:var(--ink)}
.banner b{color:var(--ink)}
.loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-family:var(--mono);font-size:12px;gap:10px;padding:80px 16px}

/* ---------- dialogs ---------- */
.dlgback{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(40px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.dlgback[hidden]{display:none}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:560px;
  box-shadow:0 24px 64px -16px rgba(0,0,0,.45)}
.dlg.narrow{max-width:460px}
.dlghd{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.dlghd h3{margin:0;font-size:16px;font-weight:800}
.dlghd .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.dlgbd{padding:16px 18px}
.dlgft{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;font-size:12.5px}
.chkgrid label{display:flex;gap:7px;align-items:center;font-weight:600;color:var(--ink-2)}
.chkgrid input{width:auto}

/* ---------- pages ---------- */
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.pagehead .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.lockbox{max-width:460px;margin:40px auto;text-align:center;color:var(--ink-3)}
.lockbox .ic{width:28px;height:28px;margin:0 auto 10px}
.lockbox h2{color:var(--ink);font-size:16px;margin:0 0 6px}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;
  background:var(--surface-2);color:var(--ink-3);white-space:nowrap;letter-spacing:.03em}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.crit{background:var(--crit-soft);color:var(--crit)} .tag.info{background:var(--accent-soft);color:var(--accent-ink)}
.userrow{display:flex;align-items:center;gap:10px;min-width:0}
.userrow .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.userrow .nm{font-weight:700;display:block}
.userrow .em{font-size:11.5px;color:var(--ink-3);display:block}
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.projcard{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.projcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.projcard .pn{font-weight:800;font-size:14.5px}
.projcard .pm{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.projcard .pr{display:flex;align-items:center;gap:8px;margin-top:auto}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.plan{border:1px solid var(--border);border-radius:13px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;background:var(--surface)}
.plan.on{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.plan.best{border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
.plan .ribbon{position:absolute;top:-9px;right:12px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  background:var(--accent);color:#fff;padding:2px 8px;border-radius:20px}
.plan .nm{font-weight:800;font-size:14px}
.plan .pr{font-family:var(--mono);font-size:24px;font-weight:700}
.plan .pr small{font-size:11px;color:var(--ink-3);font-weight:500}
.plan ul{list-style:none;margin:4px 0 8px;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2)}
.plan li{display:flex;gap:7px;align-items:flex-start}
.plan li .ic{width:14px;height:14px;color:var(--ok);margin-top:2px}
.plan .btn{margin-top:auto;justify-content:center}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.cardbox{background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);margin-bottom:16px}
.cardbox .cardhd{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--border)}
.cardbox .cardhd h3{margin:0;font-size:13.5px;font-weight:800}
.cardbox .cardhd .ic{color:var(--accent-ink)}
.cardbox .cardbd{padding:14px 16px}
.logodrop{border:1.5px dashed var(--border-strong);border-radius:11px;padding:16px;text-align:center;background:var(--surface-inset)}
.logodrop img{max-height:70px;max-width:100%;margin:0 auto 10px;display:block}
.mono{font-family:var(--mono)}
.ro .dimrow input,.ro .dimrow select{pointer-events:none;color:var(--ink-2)}
@media (max-width:900px){
  .app{flex-direction:column}
  .main{order:1;padding-bottom:0}
  .sidenav{order:2;position:static;height:auto;flex:none;overflow-x:auto;overflow-y:hidden;padding:4px}

  .mprod{display:inline-flex}

/* ---------- project file ---------- */
.filechip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:20px;
  padding:4px 11px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);max-width:280px;min-width:0}
.filechip .fn{color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filechip .st{white-space:nowrap}
.filechip.dirty{border-color:color-mix(in srgb,var(--warn) 55%,var(--border));background:var(--warn-soft)}
.filechip.dirty .st{color:var(--warn);font-weight:700}
.expwrap{position:relative}
.expmenu{left:auto;right:0;min-width:260px}
.projcard .fname{display:flex;align-items:center;gap:5px}
.projcard .fname .ic{width:12px;height:12px}
.cardbox.current{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.plans.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));max-width:720px}

/* ---------- item cards: minimise, sections ---------- */
.card.mini .lhead{border-bottom:0}
.card.mini .ltitle .sub{max-width:62ch}
.lfoot{flex-wrap:wrap;border-top:1px solid var(--border)}
.btn.tgl.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));color:var(--accent-ink)}
.secttl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:8px 14px 6px}
.bd table + .secttl{margin-top:8px;border-top:1px solid var(--border)}
.bd thead th{text-align:left;font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:5px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.bd thead th.n{text-align:right}
.bd td .tag{vertical-align:1px}
.hwsec select,.hwsec input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12px}
.hwsec input{font-family:var(--mono);text-align:right}
.hwsec select:focus,.hwsec input:focus{outline:none;border-color:var(--accent)}
.hwsec tr.off td{color:var(--ink-3);text-decoration:line-through}
.hwsec tr.off td:last-child,.hwsec tr.off td select{text-decoration:none}
.hwsec tfoot td{font-weight:700;border-top:1px solid var(--border-strong)}
.hwbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px 10px}
.grprow td{background:var(--surface-2)}
.setname{font-weight:800!important;font-size:12.5px!important;text-align:left!important;font-family:var(--ui)!important;text-transform:none;letter-spacing:0}
table.grid th .setname{color:var(--ink)}
table.grid thead tr + tr th{padding-top:6px}
#toast{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
@media (max-width:560px){
  .appbar .btn > span:not(.ic){display:none}
  .appbar .btn{padding:8px 10px}
  .filechip .fn{display:none}
  .filechip{padding:4px 9px}
  .appfoot{flex-wrap:nowrap;gap:10px;padding:5px 12px calc(5px + env(safe-area-inset-bottom,0px))}
  .appfoot-logo{height:20px}
  .appfoot-text{font-size:9px;line-height:1.3;text-align:right}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .v{font-size:16px}
}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.pri:disabled:hover{filter:none}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));gap:16px;align-items:start}
.setgrid .tw{margin:0}
.setgrid input[type=number]{min-width:58px}
.setgrid select{min-width:150px}
.brand .mark svg{width:100%;height:100%}
.empty .btn .ic{width:16px;height:16px;margin:0;color:inherit}
.empty .btn{color:var(--ink)} .empty .btn.pri{color:#fff}
/* the ESTORA mark: orange bars alone in light mode, on a black tile in dark mode */
:root{--esmark-bg:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--esmark-bg:#000}}
:root[data-theme="dark"]{--esmark-bg:#000}

</style>
</head>

/* ============================================================ ENGINE — helpers */
const M    = id => S.materials.find(m=>m.id===id) || {id, n:'?', u:'', r:0, missing:true};
const CORE = id => S.cores.find(c=>c.id===id) || SEED_CORES[0];
const num  = v  => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const int  = v  => Math.max(0, Math.round(num(v)));
const ceil = n  => (n>0 ? Math.ceil(n - 1e-9) : 0);
const mm   = v  => Math.round(v*1000);
const isCoreId = mid => String(mid).indexOf('CORE:')===0;
const typeById = gid => S.types.find(t=>t.id===gid);
const kindOf   = m => (typeById(m.g) || {kind:'other'}).kind;
const thk      = mid => (num(M(mid).t) || 18)/1000;

// wastage: a material's own % if it has one, otherwise the default for how it is used
const wastePct = (m, dflt) => (m && m.w!==undefined && m.w!==null && m.w!=='' && isFinite(+m.w)) ? +m.w : (+dflt||0);
const wasteF   = (m, dflt) => 1 + wastePct(m, dflt)/100;
const DISCRETE = new Set(['no','set','pair']);
// timber profiles and standard sizes
const PROFILE  = id => (S.profiles||[]).find(p=>p.id===id);
const profileOf = (id, kind) => { const p=PROFILE(id); return (p && (!kind || p.kind===kind)) ? p : (S.profiles||[]).find(x=>x.kind===kind) || null; };
const sizesFor = type => (S.sizes||[]).filter(z=>z.type===type);
// the nominal sawn thickness a finished section is cut from
function thkClass(tmm){
  const list=(S.thk||[]).slice().sort((a,b)=>num(a.max)-num(b.max));
  const c=list.find(x=>tmm<=num(x.max)+1e-9);
  return c ? c.n : 'Over '+((list[list.length-1]||{n:'—'}).n);
}
const timberClass = m => (m && m.cls==='soft') ? 'Softwood' : 'Hardwood';

// the ironmongery on one door: its set, or the door's own customised copy of the set
function ironItemsOf(l){
  if(l && l.iron && Array.isArray(l.iron.items)) return l.iron.items;
  const set=S.ironSets.find(s=>s.id===(l?l.ironSet:''));
  return set ? set.items : [];
}
function ironSetCost(id, items){
  const set = S.ironSets.find(s=>s.id===id);
  if(!set && !items) return {total:0, parts:[], name:''};
  const parts = (items || set.items).map(([iid,q])=>{
    const it = S.ironItems.find(x=>x.id===iid) || {n:'Missing item — choose another', r:0, missing:true};
    return {id:iid, n:it.n, q:num(q), r:num(it.r), amt:num(q)*num(it.r), missing:!!it.missing};
  });
  return {total:parts.reduce((a,p)=>a+p.amt,0), parts, name:set?set.n:'Custom'};
}

// stock sheet for a nestable material (boards, sheet finishes, solid surface) or a door core blank
function sheetInfo(mid){
  const P=S.params;
  if(isCoreId(mid)){
    const c=CORE(mid.slice(5)), a=num(c.sl)||P.sheetL, b=num(c.sw)||P.sheetW;
    return {mid, L:Math.max(a,b), W:Math.min(a,b), name:c.n, rate:num(c.r), grain:false, solo:true, core:true};
  }
  const m=M(mid), a=num(m.sl)||P.sheetL, b=num(m.sw)||P.sheetW;
  return {mid, L:Math.max(a,b), W:Math.min(a,b), name:m.n, rate:num(m.r), grain:!!m.grain, solo:false, core:false};
}
// usable area: sheet minus edge trim, plus one kerf (every piece is costed with a kerf on two sides)
function usable(info){
  const P=S.params, k=Math.max(0,num(P.kerf))/1000, tr=info.core?0:Math.max(0,num(P.trim))/1000;
  return {k, tr, UL:info.L-2*tr+k, UW:info.W-2*tr+k};
}
// allowed placements of a piece; a = the dimension that runs with the grain (placed along the sheet length)
function orientations(info,a,b){
  const {k,UL,UW}=usable(info), E=1e-9, o=[];
  if(a+k<=UL+E && b+k<=UW+E) o.push([a,b]);
  if(!info.grain && Math.abs(a-b)>E && b+k<=UL+E && a+k<=UW+E) o.push([b,a]);
  return o;
}

/* ============================================================ ENGINE — item build-up
   Every item becomes a real cut list (panels with length × width × count). Sheet goods are
   nested project-wide; m² finishes come from net panel area; edge banding from panel edges;
   solid timber from profile sections × run length. Wastage is a percentage on top of the net
   quantity: the material's own figure when it has one, otherwise the project default. */
function mkCtx(){
  const acc=new Map(), hw=new Map(), ctx={pieces:[], timber:[], warn:new Set()};
  ctx.add=(key,n,q,u,r,mid)=>{ if(!(q>1e-9)) return; const e=acc.get(key); if(e) e.q+=q; else acc.set(key,{n,q,u,r:num(r),mid}); };
  // hardware the formulas count; each line can change, swap or remove it
  ctx.hw=(key,label,q,mid)=>{ if(!(q>1e-9)) return; const e=hw.get(key); if(e) e.q+=q; else hw.set(key,{key,label,q,mid}); };
  ctx.rows=()=>[...acc.values()].map(e=>({...e, amt:e.q*e.r}));
  ctx.hwList=()=>[...hw.values()];
  return ctx;
}
// one cut part: nested if its material is a sheet (or a core); otherwise priced by its own unit
function pushPart(ctx, role, mid, part, a, b, n, solo){
  if(!(a>0.001 && b>0.001 && n>0)) return;
  const P=S.params;
  if(!isCoreId(mid) && M(mid).missing){ ctx.warn.add(`${role}: the material "${mid}" no longer exists — choose another`); return; }
  if(isCoreId(mid) || M(mid).u==='sheet'){
    ctx.pieces.push({role, mid, part, a, b, n, solo:!!solo});
    const info=sheetInfo(mid);
    if(!orientations(info,a,b).length)
      ctx.warn.add(`${part} ${mm(a)} × ${mm(b)} mm is larger than the ${info.name} ${info.core?'blank':'sheet'} (${mm(info.L)} × ${mm(info.W)}) — it is cut in sections and joined`);
    return;
  }
  const m=M(mid), key=role+'|'+mid, nm=role+' — '+m.n;
  if(m.u==='m2')      ctx.add(key, nm, a*b*n*wasteF(m,P.areaWastePct), 'm2', m.r, mid);
  else if(m.u==='lm') ctx.add(key, nm, a*n*wasteF(m,P.edgeWastePct), 'lm', m.r, mid);
  else if(m.u==='m3') ctx.add(key, nm, a*b*((num(m.t)||18)/1000)*n*wasteF(m,0), 'm3', m.r, mid);
  else                ctx.add(key, nm, n*wasteF(m,0), m.u||'no', m.r, mid);
}
// a run of solid timber: a profile section (t × w mm) × length (m) × count, in the chosen species
function timberRun(ctx, sp, prof, part, len, tmm, wmm, n){
  if(!(len>1e-6 && tmm>0 && wmm>0 && n>0)) return;
  if(!sp || sp.missing){ ctx.warn.add(`${part}: the selected timber no longer exists — choose another`); return; }
  const waste = (sp.w!==undefined && sp.w!==null && sp.w!=='') ? num(sp.w) : num(prof?prof.waste:0);
  const net = len*n*tmm*wmm/1e6;
  ctx.timber.push({mid:sp.id, part, prof:prof?prof.n:'', t:tmm, w:wmm, len, n, net, waste});
  ctx.add(part+'|'+sp.id, part+' — '+sp.n, net*(1+waste/100), 'm3', sp.r, sp.id);
}
// panels → board pieces, finish pieces / areas, lacquer; returns total banded edge length
function applyPanels(ctx, panels){
  const P=S.params, o=Math.max(0,num(P.lamOversize))/1000;
  let edge=0;
  panels.forEach(p=>{
    pushPart(ctx, p.role, p.mid, p.part, p.a, p.b, p.n);
    edge += Math.max(0,p.edge||0)*p.n;
    if(!p.fin || !(p.faces>0)) return;
    const F=M(p.fin);
    if(F.missing){ ctx.warn.add(`The finish "${p.fin}" no longer exists — choose another`); return; }
    const role = (p.role==='Fronts'||p.role==='Plinth') ? 'Front finish'
               : (p.role==='Drawer boxes' ? 'Drawer box finish' : 'Carcase finish');
    if(F.u==='sheet') pushPart(ctx, role, F.id, p.part+' face', p.a+o, p.b+o, p.n*p.faces);
    else {
      const A0=p.a*p.b*p.n*p.faces;
      ctx.add(role+'|'+F.id, role+' — '+F.n, A0*wasteF(F,P.areaWastePct), F.u||'m2', F.r, F.id);
      if(F.coat){ const L=M('LACQ'); ctx.add('coat|LACQ', 'Coating — '+L.n, A0*wasteF(L,P.areaWastePct), 'm2', L.r, 'LACQ'); }
    }
  });
  return edge;
}
// counted hardware → priced rows, after this line's own changes (quantity, swap, remove, extras)
function hardwareRows(ctx, l){
  const ov=(l.hw&&l.hw.ovr)||{}, list=[], rows=[];
  ctx.hwList().forEach(h=>{
    const o=ov[h.key]||{};
    const mid=o.mid||h.mid, m=M(mid);
    const auto=DISCRETE.has(m.u||'no') ? ceil(h.q*wasteF(m,0)) : h.q*wasteF(m,0);
    const q=o.off?0:(o.q!==undefined && o.q!==null && o.q!=='' ? num(o.q) : auto);
    list.push({key:h.key, label:h.label, mid, autoMid:h.mid, auto, q, u:m.u||'no', r:num(m.r), off:!!o.off,
               manual:o.q!==undefined && o.q!==null && o.q!=='', swapped:!!o.mid && o.mid!==h.mid, missing:!!m.missing});
    if(m.missing && !o.off) ctx.warn.add(`${h.label}: the material "${mid}" no longer exists — choose another`);
    else if(q>1e-9) rows.push({n:h.label+' — '+m.n, q, u:m.u||'no', r:num(m.r), amt:q*num(m.r), mid, hw:h.key});
  });
  ((l.hw&&l.hw.extra)||[]).forEach((x,i)=>{
    const m=M(x.mid), q=num(x.q);
    list.push({key:'x'+i, extra:i, label:'Added', mid:x.mid, q, u:m.u||'no', r:num(m.r), missing:!!m.missing});
    if(m.missing) ctx.warn.add(`Added hardware "${x.mid}" no longer exists — choose another`);
    else if(q>1e-9) rows.push({n:'Added — '+m.n, q, u:m.u||'no', r:num(m.r), amt:q*num(m.r), mid:x.mid, hw:'x'+i});
  });
  return {list, rows};
}

function carcaseBuild(l){
  const P=S.params, T=TYPES[l.type], ctx=mkCtx();
  const W=num(l.W), H=num(l.H), D=num(l.D);
  if(!(W>0 && H>0 && D>0)) ctx.warn.add('Enter the width, height and depth');
  const cF = l.carcaseFinish ? M(l.carcaseFinish) : null;
  const dF = l.doorFinish ? M(l.doorFinish) : null;
  // a faced board (melamine) IS the panel — it replaces the board instead of being bought on top of it
  const carId   = cF && cF.melamine ? cF.id : l.carcaseMat;
  const boxId   = cF && cF.melamine ? cF.id : (l.boxMat || l.carcaseMat);
  const frontId = dF && dF.melamine ? dF.id : (l.doorMat || l.carcaseMat);
  const backId  = l.backMat;
  const cFin = cF && !cF.melamine ? cF.id : '';
  const dFin = dF && !dF.melamine ? dF.id : '';
  const tC=thk(carId), tB=thk(backId), tX=thk(boxId);
  const doors=int(l.doors), shelves=int(l.shelfNos), parts=int(l.partitions), drawers=int(l.drawerQty), rails=int(l.hangerNos);
  const inside = l.drawerType==='inside';
  const panels=[];
  const pan=(role,mid,part,a,b,n,fin,faces,edge)=>{ if(a>0.001 && b>0.001 && n>0) panels.push({role,mid,part,a,b,n,fin,faces,edge}); };

  const iw=W-2*tC, ih=H-2*tC, sd=D-tB-P.shelfSetback;
  const bays=parts+1, bayW=Math.max(0,(iw-parts*tC)/bays);
  pan('Carcase', carId, 'Side',         H,  D, 2, cFin, P.carcaseFaces, H);
  pan('Carcase', carId, 'Top / bottom', iw, D, 2, cFin, P.carcaseFaces, iw);
  pan('Back',    backId,'Back',         H,  W, 1, cFin, P.backFaces, 0);
  pan('Carcase', carId, 'Partition',    ih, sd, parts, cFin, P.carcaseFaces, ih);
  const shL=bayW-P.shelfClear;
  pan('Carcase', carId, 'Shelf',        shL, sd, shelves, cFin, P.carcaseFaces, shL);

  // drawers — a front each, plus a four-sided box and a bottom.
  // Outside: the fronts are on the face of the unit and the doors take the height that is left.
  // Inside: the drawers sit in a bay behind full-height doors; their fronts are carcase board.
  let stack=0, drw=0;
  if(drawers>0){
    const dfH=num(l.drawerH);
    if(!(dfH>0)) ctx.warn.add('Set the drawer front height');
    else {
      drw=drawers; stack=inside?0:drawers*dfH;
      const room = inside ? ih : H;
      if(drawers*dfH>room+1e-6) ctx.warn.add(`${drawers} drawer fronts of ${mm(dfH)} mm are taller than the ${inside?'inside of the unit':'unit'}`);
      const fh=dfH-P.doorGap;
      let base, fw;
      if(inside){ base = num(l.drawerW)>0 ? Math.min(num(l.drawerW), bayW) : bayW; fw = base-P.inDrawerClear;
        pan('Drawer boxes', boxId, 'Inner drawer front', fh, fw, drawers, cFin, P.carcaseFaces, 2*(fh+fw)); }
      else { base = num(l.drawerW)>0 ? num(l.drawerW) : W-P.doorGap; fw = base;
        pan('Fronts', frontId, 'Drawer front', fh, fw, drawers, dFin, P.doorFaces, 2*(fh+fw)); }
      const bxH=dfH-P.boxHeightDed, bxD=D-P.boxDepthDed, bxW=Math.min(inside?bayW:iw, base)-P.runnerClear;
      if(bxH>0 && bxD>0 && bxW>2*tX){
        pan('Drawer boxes', boxId, 'Box side',         bxD,      bxH, 2*drawers, cFin, P.carcaseFaces, bxD);
        pan('Drawer boxes', boxId, 'Box front / back', bxW-2*tX, bxH, 2*drawers, cFin, P.carcaseFaces, bxW-2*tX);
        pan('Drawer boxes', backId,'Box bottom',       bxD,      bxW, drawers, '', 0, 0);
      } else ctx.warn.add('Drawer front is too small for a drawer box');
    }
  }
  // doors: full height with inside drawers; otherwise the height left after the drawer fronts
  let doorH=0, doorW=0, nDoors=0;
  if(doors>0 && W>0 && H>0){
    doorH=H-stack-P.doorGap; doorW=W/doors-P.doorGap;
    if(doorH<0.05){ ctx.warn.add('No height left for doors after the drawers'); doorH=0; }
    else { nDoors=doors; pan('Fronts', frontId, 'Door', doorH, doorW, doors, dFin, P.doorFaces, 2*(doorH+doorW)); }
  }
  if(inside && drw>0 && !nDoors) ctx.warn.add('Inside drawers sit behind doors — this unit has none');
  const plH = T.plinth ? num(l.plinthH) : 0;
  if(plH>0) pan('Plinth', frontId, 'Plinth', W, plH, 1, dFin, 1, W);
  if(T.top && num(l.topW)>0){
    const tw=num(l.topW), td=num(l.topD), fa=num(l.facia);
    pan('Worktop', l.topMat, 'Worktop', tw, td, 1, '', 0, 0);
    pan('Worktop', l.topMat, 'Front facia', tw, fa, 1, '', 0, 0);
    pan('Top substrate', carId, 'Substrate', tw, td, 1, '', 0, 0);
  }
  const edgeLm = applyPanels(ctx, panels);

  // edge banding — auto: PVC for laminate/faced board, veneer lipping for veneers, none for paint
  const fAuto = cF || dF;
  const auto  = !fAuto ? 'LPVC' : (fAuto.paint ? '' : ((fAuto.u==='sheet'||fAuto.melamine) ? 'LPVC' : 'LVEN'));
  const eid = l.edgeMat==='NONE' ? '' : (l.edgeMat || auto);
  if(eid && edgeLm>0){ const E=M(eid);
    if(E.missing) ctx.warn.add('The selected edge banding no longer exists — choose another');
    else ctx.add('edge|'+eid, 'Edge banding — '+E.n, edgeLm*wasteF(E,P.edgeWastePct), E.u||'lm', E.r, eid); }

  // hardware
  if(nDoors>0) ctx.hw('HING','Hinges', Math.max(P.hingeMin, ceil(doorH/P.hingeSpacing))*nDoors, 'HING');
  if(W>0 && H>0) ctx.hw('MFIX','Assembly fittings', (4+2*parts)*P.connectorsPerJoint, 'MFIX');
  ctx.hw('SHSP','Shelf supports', shelves*P.pinsPerShelf, 'SHSP');
  ctx.hw('RUNN','Drawer runners', drw, 'RUNN');
  if(l.handle){ const h=M(l.handle);
    if(h.missing) ctx.warn.add('The selected handle no longer exists — choose another');
    else ctx.hw('HNDL','Handles', nDoors+drw, h.id); }
  if(T.hanger && rails>0){
    ctx.add('HPIP','Hanger rail', rails*bayW*wasteF(M('HPIP'),0), 'lm', M('HPIP').r, 'HPIP');
    ctx.hw('HHLD','Hanger holders', rails*P.hangerHolderPer, 'HHLD');
  }
  if(plH>0) ctx.hw('LEGS','Adjustable legs', P.legsPerUnit, 'LEGS');
  const hw=hardwareRows(ctx, l);

  const hours = P.cabHoursBase + nDoors*P.cabHoursPerDoor + drw*P.cabHoursPerDrawer + parts*P.cabHoursPerPartition;
  return {pieces:ctx.pieces, timber:ctx.timber, rows:[...ctx.rows(), ...hw.rows], hw:hw.list, hours,
    install:P.cabInstall*num(S.project.access), handover:P.handoverCab, warn:[...ctx.warn],
    geo:{doorH, doorW, nDoors, drawers:drw, inside}};
}

// leaves: Auto follows the double-leaf threshold; Single / Double are fixed
function leafCount(l){
  if(l.leaves==='single') return 1;
  if(l.leaves==='double') return 2;
  return num(l.W) > S.params.doubleThreshold ? 2 : 1;
}
function doorBuild(l){
  const P=S.params, ctx=mkCtx();
  const W=num(l.W), H=num(l.H), per=W+H+H;
  if(!(W>0 && H>0)) ctx.warn.add('Enter the opening width and height');
  if(l.core && !S.cores.find(c=>c.id===l.core)) ctx.warn.add('The selected core no longer exists — choose another');
  const core=CORE(l.core), timber=M(l.frameSpecies);
  const nLeaf = leafCount(l), dbl = nLeaf===2;
  const leafW=(W-P.leafClearW)/nLeaf, leafH=H-P.leafClearH;
  if(l.leaves==='double' && W<=P.doubleThreshold) ctx.warn.add(`Double leaf on a ${mm(W)} mm opening — each leaf is only ${mm(leafW)} mm wide`);
  if(l.leaves==='single' && W>P.doubleThreshold) ctx.warn.add(`Single leaf on a ${mm(W)} mm opening — check the leaf is not too heavy or too wide`);

  // solid timber, from the profiles chosen on the door
  const fp=profileOf(l.frameProfile,'frame'), ap=profileOf(l.archProfile,'arch'), lp=profileOf(l.lipProfile,'lip'), sp=profileOf('','stile');
  const leafT = num(core.t) || 44;
  if(fp) timberRun(ctx, timber, fp, 'Frame', per, num(fp.t), num(fp.w)>0?num(fp.w):num(l.wallThk)*1000, 1);
  else ctx.warn.add('Add a door frame profile under Profiles & sizes');
  const sides = l.archSides===undefined ? 2 : int(l.archSides);
  if(ap && sides>0) timberRun(ctx, timber, ap, 'Architrave', per, num(ap.t), num(ap.w), sides);
  if(lp) timberRun(ctx, timber, lp, 'Leaf lipping', (leafW+leafH)*P.lipEdges, num(lp.w), num(lp.t)>0?num(lp.t):leafT, nLeaf);
  if(core.tubular && sp) timberRun(ctx, timber, sp, 'Stile & rail', leafW*3+leafH*2, num(sp.t), num(sp.w), nLeaf);

  // one core blank per leaf — a double door takes two
  if(core.id!=='NONE' && leafW>0 && leafH>0){
    pushPart(ctx, 'Door core', 'CORE:'+core.id, 'Leaf core', leafH, leafW, nLeaf, true);
    if(core.tubular) pushPart(ctx, 'Crossband', 'MDF6', 'Leaf crossband', leafH, leafW, nLeaf*2);
  }
  const fin = l.leafFinish ? M(l.leafFinish) : null;
  let sheetFin=false;
  if(fin && leafW>0 && leafH>0){
    if(fin.missing) ctx.warn.add('The selected leaf finish no longer exists — choose another');
    else if(fin.u==='sheet'){
      sheetFin=true; const o=Math.max(0,num(P.lamOversize))/1000;
      pushPart(ctx, 'Leaf finish', fin.id, 'Leaf face', leafH+o, leafW+o, nLeaf*P.leafFaces);
    } else {
      const A0=leafW*leafH*nLeaf*P.leafFaces;
      ctx.add('lf|'+fin.id, 'Leaf finishing — '+fin.n, A0*wasteF(fin,P.leafWastePct), fin.u||'m2', fin.r, fin.id);
      if(fin.coat){ const L=M('LACQ'); ctx.add('coat|LACQ', 'Coating — '+L.n, A0*wasteF(L,P.leafWastePct), 'm2', L.r, 'LACQ'); }
    }
  }
  if(num(l.visionM2)>0){
    const gid = l.visionGlass || (core.fr>0 ? 'GLSF' : 'GLSN'), gl=M(gid);
    if(gl.missing) ctx.warn.add('The selected glass no longer exists — choose another');
    else ctx.add('gl|'+gid, 'Vision panel — '+gl.n, num(l.visionM2)*wasteF(gl,0), gl.u||'m2', gl.r, gid);
    if(core.fr>0 && gid==='GLSN') ctx.warn.add('Non-rated glass in a fire-rated leaf');
  }
  if(l.kick) ctx.add('KICK','Kick plate', W*P.kickHeight*wasteF(M('KICK'),0), 'm2', M('KICK').r, 'KICK');
  if(l.louverType && num(l.louverM2)>0){ const lv=M(l.louverType);
    if(lv.missing) ctx.warn.add('The selected louver no longer exists — choose another');
    else ctx.add('lv|'+lv.id, 'Louver — '+lv.n, num(l.louverM2)*wasteF(lv,0), lv.u||'m2', lv.r, lv.id); }
  if(core.fr>0){
    const mult = core.fr<=30 ? P.sealMult30 : P.sealMult60, sm=M('SEAL');
    ctx.add('SEAL','Intumescent + smoke seal', (per+(dbl?leafH:0))*mult*P.sealFactor*wasteF(sm,0), 'lm', sm.r, 'SEAL');
    ctx.add('CERT','Certification / label', nLeaf, 'no', P.certPerLeaf, 'CERT');
  }
  const brk = ceil((per*2)/P.bracketSpacing);
  ctx.hw('BRKT','Brackets', brk, 'BRKT');
  ctx.hw('SCRW','Screws', brk*P.screwsPerBracket, 'SCRW');
  const hw=hardwareRows(ctx, l);

  const rows=[...ctx.rows(), ...hw.rows];
  const im = ironSetCost(l.ironSet, l.iron && Array.isArray(l.iron.items) ? l.iron.items : null);
  if(l.ironSet && !S.ironSets.find(s=>s.id===l.ironSet)) ctx.warn.add('The selected ironmongery set no longer exists — choose another');
  if(im.parts.some(p=>p.missing)) ctx.warn.add('An ironmongery item in this door no longer exists — choose another');
  const custom = !!(l.iron && Array.isArray(l.iron.items));
  if(im.total>0) rows.push({n:'Ironmongery — '+im.name+(custom?' (customised)':''), q:1, u:'set', r:im.total,
                            amt:im.total, mid:'IRON:'+(custom?l.id:l.ironSet), parts:im.parts});
  const hours = (sheetFin ? P.doorHoursSheet : P.doorHoursWet) * (dbl ? P.doubleLeafHours : 1);
  return {pieces:ctx.pieces, timber:ctx.timber, rows, hw:hw.list, iron:im, hours,
    install:(dbl?P.doorInstallDouble:P.doorInstallSingle)*num(S.project.access),
    handover:P.handoverDoor, dbl, warn:[...ctx.warn], geo:{nLeaf, leafW, leafH}};
}

// a run of timber moulding — skirting, beads, cornices, handrails
function profileBuild(l){
  const P=S.params, ctx=mkCtx();
  const pr=PROFILE(l.profile), sp=M(l.species), len=num(l.runM);
  if(!pr) ctx.warn.add('Choose a profile — add one under Profiles & sizes');
  if(!(len>0)) ctx.warn.add('Enter the run length');
  if(pr) timberRun(ctx, sp, pr, 'Profile', len, num(pr.t), num(pr.w), 1);
  if(l.finish && pr && len>0){ const F=M(l.finish);
    if(F.missing) ctx.warn.add('The selected finish no longer exists — choose another');
    else if(F.u!=='sheet'){ const A0=len*(num(pr.w)+num(pr.t))/1000;
      ctx.add('pf|'+F.id, 'Finish — '+F.n, A0*wasteF(F,P.areaWastePct), F.u||'m2', F.r, F.id);
      if(F.coat){ const L=M('LACQ'); ctx.add('coat|LACQ', 'Coating — '+L.n, A0*wasteF(L,P.areaWastePct), 'm2', L.r, 'LACQ'); } } }
  const hw=hardwareRows(ctx, l);
  return {pieces:ctx.pieces, timber:ctx.timber, rows:[...ctx.rows(), ...hw.rows], hw:hw.list,
    hours:len*P.profHoursPerM, install:len*P.profInstallPerM*num(S.project.access), handover:0,
    warn:[...ctx.warn], geo:{len}};
}

let NEST = null;
const BUILD = new Map();
function dirty(){ NEST=null; BUILD.clear(); }
function lineBuild(l){
  let b=BUILD.get(l.id);
  if(!b){ const f=(TYPES[l.type]||TYPES.cabinet).fam;
    b = f==='door' ? doorBuild(l) : f==='profile' ? profileBuild(l) : carcaseBuild(l); BUILD.set(l.id,b); }
  return b;
}

/* ============================================================ ENGINE — nesting
   Guillotine packer (every cut runs edge to edge, so the plan works on a panel saw as well as a CNC).
   Several sort orders × split rules are tried and the plan with the fewest sheets wins. */
function packPieces(pieces, info){
  const {k,tr,UL,UW}=usable(info), E=1e-9, base={info,k,tr,UL,UW};
  const items=[];
  for(const p of pieces){
    let segs=[{a:p.a,b:p.b}], over=false;
    if(!orientations(info,p.a,p.b).length){
      const run=UL-k;
      if(run>E && p.b+k<=UW+E){ const s=Math.ceil(p.a/run-E); segs=Array.from({length:s},()=>({a:p.a/s,b:p.b})); }
      else if(run>E && !info.grain && p.a+k<=UW+E){ const s=Math.ceil(p.b/run-E); segs=Array.from({length:s},()=>({a:p.a,b:p.b/s})); }
      else over=true;
    }
    const n=Math.max(0,Math.round(p.n));
    for(let i=0;i<n;i++) segs.forEach((sg,j)=>items.push({a:sg.a, b:sg.b, over, solo:!!(p.solo||info.solo),
      lineId:p.lineId, part:segs.length>1?`${p.part} (${j+1}/${segs.length})`:p.part, joint:segs.length>1}));
  }
  if(!items.length) return {...base, sheets:[], count:0};
  if(items.length>9000){
    const A=items.reduce((s,i)=>s+i.a*i.b,0);
    return {...base, sheets:[], est:true, count:Math.max(1,Math.ceil(A/((UL-k)*(UW-k)*0.85)))};
  }
  const area=i=>i.a*i.b, lng=i=>Math.max(i.a,i.b), sht=i=>Math.min(i.a,i.b);
  const orders=[(x,y)=>area(y)-area(x), (x,y)=>lng(y)-lng(x)||area(y)-area(x),
                (x,y)=>sht(y)-sht(x)||lng(y)-lng(x), (x,y)=>(y.a+y.b)-(x.a+x.b)];
  let runs=[]; ['baf','bssf'].forEach(f=>orders.forEach(o=>['slas','maxa'].forEach(s=>runs.push([o,s,f]))));
  if(items.length>2500) runs=runs.slice(0,1); else if(items.length>800) runs=runs.slice(0,4);
  let best=null;
  for(const [o,s,f] of runs){
    const sh=guillotine(items.slice().sort(o), info, UL, UW, k, s, f);
    const used=sh.map(x=>x.placed.reduce((a,p)=>a+(p.over?0:p.w*p.h),0));
    const sc=sh.length + Math.min(...used)/(info.L*info.W)*0.999;
    if(!best || sc<best.sc-1e-12) best={sh,used,sc};
  }
  const sheets=best.sh.map((x,i)=>({placed:x.placed, used:best.used[i]}));
  return {...base, sheets, count:sheets.length};
}
function guillotine(items, info, UL, UW, k, split, fit){
  const E=1e-9, sheets=[];
  let minKeep=Infinity; items.forEach(i=>{ minKeep=Math.min(minKeep, Math.min(i.a,i.b)+k); });
  const keep=r=>r.w>E && r.h>E && Math.min(r.w,r.h)+E>=minKeep;
  for(const it of items){
    const os=orientations(info,it.a,it.b);
    if(it.over || !os.length){
      sheets.push({solo:true, free:[], placed:[{x:0,y:0,w:Math.min(it.a,UL-k),h:Math.min(it.b,UW-k),
        lineId:it.lineId, part:it.part, over:true}]}); continue; }
    if(it.solo){ const [w,h]=os[0];
      sheets.push({solo:true, free:[], placed:[{x:0,y:0,w,h,lineId:it.lineId,part:it.part,joint:it.joint}]}); continue; }
    let best=null;
    for(const sh of sheets){ if(sh.solo) continue;
      for(let fi=0;fi<sh.free.length;fi++){ const fr=sh.free[fi];
        for(const [w,h] of os){ const pw=w+k, ph=h+k;
          if(pw<=fr.w+E && ph<=fr.h+E){
            const baf=fr.w*fr.h-pw*ph, sss=Math.min(fr.w-pw, fr.h-ph);
            const sc = fit==='bssf' ? sss : baf, ss = fit==='bssf' ? baf : sss;
            if(!best || sc<best.sc-E || (Math.abs(sc-best.sc)<=E && ss<best.ss)) best={sh,fi,w,h,pw,ph,sc,ss};
          } } } }
    if(!best){
      const sh={free:[{x:0,y:0,w:UL,h:UW}], placed:[]}; sheets.push(sh);
      for(const [w,h] of os){ const pw=w+k, ph=h+k, ss=Math.min(UL-pw, UW-ph);
        if(!best || ss<best.ss) best={sh,fi:0,w,h,pw,ph,ss}; }
    }
    const sh=best.sh, fr=sh.free[best.fi]; sh.free.splice(best.fi,1);
    sh.placed.push({x:fr.x, y:fr.y, w:best.w, h:best.h, lineId:it.lineId, part:it.part, joint:it.joint});
    const rw=fr.w-best.pw, bh=fr.h-best.ph;
    const horiz = split==='slas' ? (rw<bh)
                : Math.max(rw*best.ph, fr.w*bh) >= Math.max(rw*fr.h, best.pw*bh);
    const r1 = horiz ? {x:fr.x+best.pw, y:fr.y, w:rw, h:best.ph} : {x:fr.x+best.pw, y:fr.y, w:rw, h:fr.h};
    const r2 = horiz ? {x:fr.x, y:fr.y+best.ph, w:fr.w, h:bh}    : {x:fr.x, y:fr.y+best.ph, w:best.pw, h:bh};
    if(keep(r1)) sh.free.push(r1);
    if(keep(r2)) sh.free.push(r2);
  }
  return sheets;
}
// the project nest — every item's pieces × its quantity, per material, packed together
function buildNest(){
  const mats={};
  S.lines.forEach(l=>{
    const q=Math.round(num(l.qty)); if(q<=0) return;
    lineBuild(l).pieces.forEach(p=>{
      const e = mats[p.mid] || (mats[p.mid]={mid:p.mid, pieces:[], area:0, pcs:0, byLine:{}});
      const A=p.a*p.b*p.n*q;
      e.pieces.push({...p, n:p.n*q, lineId:l.id}); e.area+=A; e.pcs+=p.n*q;
      e.byLine[l.id]=(e.byLine[l.id]||0)+A;
    });
  });
  Object.values(mats).forEach(e=>{ e.info=sheetInfo(e.mid); e.pack=packPieces(e.pieces, e.info); e.count=e.pack.count; });
  return {mats};
}
function getNest(){ return NEST || (NEST=buildNest()); }
// an item's share of a material's nested sheets (by net area; by blank for one-per-leaf cores)
function sheetShare(mid, l, b){
  const e=getNest().mats[mid];
  if(e && e.byLine[l.id]) return e;
  const pcs=b.pieces.filter(p=>p.mid===mid).map(p=>({...p, lineId:l.id})), info=sheetInfo(mid);
  return {info, count:packPieces(pcs,info).count,
    area:pcs.reduce((s,p)=>s+p.a*p.b*p.n,0), pcs:pcs.reduce((s,p)=>s+p.n,0)};
}

// solid timber across the project, by species × hardwood/softwood × nominal sawn thickness
function timberSummary(){
  const acc=new Map(), order=(S.thk||[]).slice().sort((a,b)=>num(a.max)-num(b.max)).map(x=>x.n);
  S.lines.forEach(l=>{ const q=num(l.qty); if(!(q>0)) return;
    (lineBuild(l).timber||[]).forEach(t=>{
      const m=M(t.mid), cls=thkClass(Math.min(t.t,t.w)), k=t.mid+'|'+cls;
      let e=acc.get(k);
      if(!e){ e={mid:t.mid, n:m.n, cls:timberClass(m), thk:cls, net:0, gross:0, rate:num(m.r), parts:new Set(), lines:new Set()}; acc.set(k,e); }
      e.net+=t.net*q; e.gross+=t.net*(1+t.waste/100)*q; e.parts.add(t.part); e.lines.add(l.id);
    }); });
  const oi=n=>{ const i=order.indexOf(n); return i<0?999:i; };
  return [...acc.values()].map(e=>({...e, parts:[...e.parts], lines:[...e.lines], amt:e.gross*e.rate}))
    .sort((a,b)=>a.cls.localeCompare(b.cls)*-1 || a.n.localeCompare(b.n) || oi(a.thk)-oi(b.thk));
}

function priceLine(l){
  const P=S.params, C=S.commercial, b=lineBuild(l);
  const grp=new Map();
  b.pieces.forEach(p=>{ const k=p.role+'|'+p.mid;
    if(!grp.has(k)) grp.set(k,{role:p.role, mid:p.mid, area:0, pcs:0});
    const g=grp.get(k); g.area+=p.a*p.b*p.n; g.pcs+=p.n; });
  const sheetRows=[...grp.values()].map(g=>{
    const e=sheetShare(g.mid,l,b), info=e.info;
    const q = info.solo ? (e.pcs>0 ? g.pcs*e.count/e.pcs : 0) : (e.area>0 ? g.area*e.count/e.area : 0);
    return {n:g.role+' — '+info.name, q, u:'sheet', r:info.rate, amt:q*info.rate, mid:g.mid,
            area:g.area, pcs:g.pcs, nest:true};
  });
  const rows=[...sheetRows, ...b.rows];
  const material = rows.reduce((a,r)=>a+r.amt,0);
  const labour   = b.hours * P.labourRate;
  const consum   = material * P.consumablesPct/100;
  const trans    = (S.transport.find(t=>t[0]===S.project.location)||['',0])[1];
  const manpower = labour + (+trans) + b.install + b.handover;
  const direct   = material + consum + manpower;
  const projOH   = direct * C.projectOverheadPct/100;
  const coOH     = direct * C.companyOverheadPct/100;
  const cont     = direct * C.contingencyPct/100;
  const cost     = direct + projOH + coOH + cont;
  const margin   = cost * C.marginPct/100;
  const rate     = cost + margin + num(l.extra);
  return {...b, rows, material, labour, consum, trans:+trans, manpower, direct,
    projOH, coOH, cont, cost, margin, rate, qty:num(l.qty), amount:rate*num(l.qty)};
}


/* ============================================================ MIGRATE */
function migrate(o){
  const f = freshState();
  const s = {...f, ...o,
    project:{...f.project,...(o.project||{})},
    params:{...f.params,...(o.params||{})},
    commercial:{...f.commercial,...(o.commercial||{})},
    types:(o.types&&o.types.length)?o.types:f.types,
    materials:(o.materials&&o.materials.length)?o.materials:f.materials,
    cores:(o.cores&&o.cores.length)?o.cores:f.cores,
    ironItems:(o.ironItems&&o.ironItems.length)?o.ironItems:f.ironItems,
    ironSets:(o.ironSets&&o.ironSets.length)?o.ironSets:f.ironSets,
    transport:(o.transport&&o.transport.length)?o.transport:f.transport,
  };
  const firstUpgrade = !o.types;
  s.materials = s.materials.map(m=>{
    const x={...m};
    delete x.note; delete x.conflict; delete x.seed; delete x.perSheet;
    if(!x.g) x.g='misc';
    if(firstUpgrade && (x.id==='LVWD'||x.id==='LVAL') && x.g==='misc') x.g='louver';
    if(x.u==='sheet' && x.t===undefined){ const t=/(\d+(?:\.\d+)?)\s*mm/i.exec(x.n||''); if(t) x.t=parseFloat(t[1]); }
    if(firstUpgrade && x.coat===undefined && ['VOAK','VWAL','VMAH','VCHE','VASH'].includes(x.id)) x.coat=1;
    return x;
  });
  s.materials.forEach(m=>{ if(!s.types.find(t=>t.id===m.g)) s.types.push({id:m.g, n:m.g, kind:'other'}); });
  SEED_MATERIALS.forEach(sm=>{
    const need = PROTECTED_MATERIALS.has(sm.id) || (firstUpgrade && sm.id==='HNDL');
    if(need && !s.materials.find(m=>m.id===sm.id)) s.materials.push({...sm});
  });
  s.cores = s.cores.map(c=>({...c, one: c.one===undefined ? (num(c.fr)>0?1:0) : c.one}));
  s.materials.forEach(m=>{ const tp=s.types.find(t=>t.id===m.g); if(tp && tp.kind==='timber' && !m.cls) m.cls='hard'; });

  // earlier versions kept wastage as factors (1.20) and the door timber sections as parameters
  const op=o.params||{}, pct=f=>Math.round((num(f)-1)*1000)/10;
  if(op.wasteFactor!==undefined && o.params.areaWastePct===undefined)    s.params.areaWastePct=pct(op.wasteFactor);
  if(op.veneerCoverage!==undefined && o.params.leafWastePct===undefined) s.params.leafWastePct=pct(op.veneerCoverage);
  if(op.lippingWaste!==undefined && o.params.edgeWastePct===undefined)   s.params.edgeWastePct=pct(op.lippingWaste);
  if(!(o.profiles && o.profiles.length)){
    s.profiles=SEED_PROFILES.map(p=>({...p}));
    const P0=s.profiles, by=id=>P0.find(p=>p.id===id);
    if(op.frameThk!==undefined){ const p=by('FR50'); p.t=Math.round(num(op.frameThk)*1000); p.waste=pct(op.frameAllow||2); p.n=`Frame ${p.t} mm × wall`; }
    if(op.archW!==undefined){ const p=by('AR70'); p.w=Math.round(num(op.archW)*1000); p.t=Math.round(num(op.archT||0.025)*1000); p.waste=pct(op.archAllow||2); p.n=`Architrave ${p.w} × ${p.t} mm`; }
    if(op.lipW!==undefined){ const p=by('LP20'); p.w=Math.round(num(op.lipW)*1000); p.waste=pct(op.lipAllow||2); p.n=`Lipping ${p.w} mm`; }
    if(op.stileRailAllow!==undefined){ by('SR44').waste=pct(op.stileRailAllow); }
  }
  ['wasteFactor','veneerCoverage','lippingWaste','frameThk','frameAllow','archW','archT','archFaces','archAllow',
   'lipW','lipAllow','stileRailAllow'].forEach(k=>delete s.params[k]);
  if(!(o.sizes && o.sizes.length) && !o.sizesTouched) s.sizes=SEED_SIZES.map(z=>({...z}));
  if(!(o.thk && o.thk.length)) s.thk=SEED_THK.map(x=>({...x}));
  const archSides = op.archFaces!==undefined ? int(op.archFaces) : 2;
  s.lines = (o.lines||[]).map(l=>{
    const x={...lineDefaults(l.type), ...l};
    if((TYPES[x.type]||{}).fam==='door' && l.archSides===undefined) x.archSides=archSides;
    return x;
  });
  return s;
}

/* ---------- BOM ---------- */
function bomName(r){
  if(isCoreId(r.mid)) return CORE(r.mid.slice(5)).n;
  if(String(r.mid).indexOf('IRONITEM:')===0){ const it=S.ironItems.find(x=>x.id===r.mid.slice(9)); return it?it.n:r.n; }
  if(String(r.mid).indexOf('IRON:')===0) return r.n.replace(/^Ironmongery — /,'');
  if(r.mid==='CERT') return 'Certification / label';
  const m=M(r.mid); return m.missing ? r.n : m.n;
}
function bomRows(){
  const nest=getNest(), acc={};
  S.lines.forEach(l=>{ const p=priceLine(l), q=num(l.qty), t=TYPES[l.type]||TYPES.cabinet;
    // ironmongery is bought item by item, so a set is listed as its items
    const flat=[]; p.rows.forEach(r=>{ if(r.parts) r.parts.forEach(x=>flat.push({n:x.n, q:x.q, u:'no', r:x.r, amt:x.amt, mid:'IRONITEM:'+x.id}));
      else flat.push(r); });
    flat.forEach(r=>{
      if(!r.mid) return;
      const k=r.mid+'|'+r.u;
      const a = acc[k] || (acc[k]={mid:r.mid, u:r.u, n:bomName(r), q:0, amt:0, byLine:{}, nest:!!r.nest});
      a.q += r.q*q; a.amt += r.amt*q;
      const bl = a.byLine[l.id] || (a.byLine[l.id]={lineId:l.id, label:t.n, perItem:0, lineQty:q, amt:0, area:0, pcs:0});
      bl.perItem += r.q; bl.amt += r.amt*q;
      if(r.nest){ bl.area += r.area; bl.pcs += r.pcs; }
    });
  });
  Object.values(acc).forEach(a=>{
    if(!a.nest) return;
    const e=nest.mats[a.mid];
    if(e){ a.q=e.count; a.amt=e.count*e.info.rate; }   // the BOM buys exactly the sheets in the layout
  });
  return Object.values(acc).map(a=>({...a, byLine:Object.values(a.byLine).sort((x,y)=>y.amt-x.amt)}))
    .sort((a,b)=>b.amt-a.amt);
}
function lineIdx(id){ return Math.max(0, S.lines.findIndex(l=>l.id===id)); }
function lineColor(id){ return `var(--nest-${(lineIdx(id)%6)+1})`; }
function sheetSvg(sh, pk, caption){
  const {info,tr}=pk, L=info.L, Wd=info.W;
  const sc=Math.min(300/L, 170/Wd), vw=L*sc, vh=Wd*sc;
  let body=`<rect x="0.5" y="0.5" width="${(vw-1).toFixed(1)}" height="${(vh-1).toFixed(1)}" rx="2" style="fill:var(--surface);stroke:var(--border-strong);stroke-width:1"/>`;
  if(tr>0) body+=`<rect x="${(tr*sc).toFixed(1)}" y="${(tr*sc).toFixed(1)}" width="${((L-2*tr)*sc).toFixed(1)}" height="${((Wd-2*tr)*sc).toFixed(1)}" style="fill:none;stroke:var(--ink-3);stroke-width:.6;stroke-dasharray:2 2"/>`;
  sh.placed.forEach(p=>{
    const x=(tr+p.x)*sc, y=(tr+p.y)*sc, w=p.w*sc, h=p.h*sc;
    const fill=p.over?'var(--crit-soft)':lineColor(p.lineId), stroke=p.over?'var(--crit)':'var(--ink-3)';
    const tip=`${p.lineId} · ${p.part} · ${mm(p.w)} × ${mm(p.h)} mm${p.joint?' · joined section':''}${p.over?' · larger than the sheet':''}`;
    body+=`<g><title>${esc(tip)}</title><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="fill:${fill};stroke:${stroke};stroke-width:.6"/>`;
    if(w>24 && h>11) body+=`<text x="${(x+2.5).toFixed(1)}" y="${(y+9).toFixed(1)}" class="st">${esc(p.lineId)}</text>`;
    if(w>54 && h>21) body+=`<text x="${(x+2.5).toFixed(1)}" y="${(y+18.5).toFixed(1)}" class="sd">${mm(p.w)}×${mm(p.h)}</text>`;
    body+='</g>';
  });
  return `<figure class="sheetbox"><svg viewBox="0 0 ${vw.toFixed(1)} ${vh.toFixed(1)}" width="${vw.toFixed(0)}" height="${vh.toFixed(0)}" role="img" aria-label="${esc(caption)}">${body}</svg>
    <figcaption class="sheetcap">${esc(caption)}</figcaption></figure>`;
}
function layoutHtml(e){
  const pk=e.pack, info=e.info, A=info.L*info.W;
  if(pk.est) return `<div class="nestnote">Too many pieces to draw here — the sheet count is estimated from net area at 85% yield.</div>`;
  const groups=[], idx=new Map();
  pk.sheets.forEach((sh,i)=>{
    const sig=sh.placed.map(p=>[p.x,p.y,p.w,p.h].map(v=>v.toFixed(4)).join(',')+p.lineId+p.part).join('|');
    if(idx.has(sig)) groups[idx.get(sig)].n++; else { idx.set(sig,groups.length); groups.push({sh, first:i+1, n:1}); }
  });
  const ids=[...new Set(e.pieces.map(p=>p.lineId))];
  let h=`<div class="legend">${ids.map(id=>{ const l=S.lines.find(x=>x.id===id);
    return `<span><i style="background:${lineColor(id)}"></i>${esc(id)} ${esc(l?TYPES[l.type].n:'')}</span>`; }).join('')}</div>`;
  h+='<div class="nestgrid">';
  groups.slice(0,30).forEach(g=>{
    h+=sheetSvg(g.sh, pk, `Sheet ${g.first}${g.n>1?` · ×${g.n} identical`:''} · ${fmt(g.sh.used/A*100,0)}% used`);
  });
  h+='</div>';
  if(groups.length>30) h+=`<div class="nestnote">+ ${groups.length-30} more distinct layouts — all included in the count and the cut list.</div>`;
  return h;
}
function cutListRows(e){
  const agg=new Map();
  e.pieces.forEach(p=>{ const k=p.lineId+'|'+p.part+'|'+p.a.toFixed(4)+'|'+p.b.toFixed(4);
    const x=agg.get(k); if(x) x.n+=p.n; else agg.set(k,{...p}); });
  return [...agg.values()].sort((x,y)=>lineIdx(x.lineId)-lineIdx(y.lineId) || y.a*y.b-x.a*x.b);

    cl.forEach(p=>{ const fits=orientations(info,p.a,p.b).length>0;

  return h+'</div>';

  const P=S.params;
  if(m.u==='m2') return String(kindOf(m)==='finish' ? P.areaWastePct+' / '+P.leafWastePct : P.areaWastePct);

/* ---------- profiles & standard sizes ---------- */
function profileUse(p){
  return S.lines.filter(l=>{ const f=(TYPES[l.type]||{}).fam;
    if(f==='profile') return l.profile===p.id;
    if(f!=='door') return false;
    if(p.kind==='stile') return CORE(l.core).tubular && profileOf('','stile')===p;
    return [l.frameProfile,l.archProfile,l.lipProfile].includes(p.id) || profileOf(l[{frame:'frameProfile',arch:'archProfile',lip:'lipProfile'}[p.kind]],p.kind)===p;
  }).length;
}

<script>
/* ==================== XLSX writer (no dependencies, logo-capable) ==================== */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;}
const ENC=new TextEncoder();
const bytesOf=v=>typeof v==='string'?ENC.encode(v):v;

function zipStore(files){
  const parts=[],central=[];let off=0;
  for(const f of files){
    const name=ENC.encode(f.name),data=bytesOf(f.data),crc=crc32(data);
    const lh=new Uint8Array(30+name.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);
    dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0x21,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true);dv.setUint16(28,0,true);
    lh.set(name,30);parts.push(lh,data);
    const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0x21,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,off,true);
    ch.set(name,46);central.push(ch);
    off+=lh.length+data.length;
  }
  let cs=0;central.forEach(c=>cs+=c.length);
  const eo=new Uint8Array(22),ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,central.length,true);
  ev.setUint16(10,central.length,true);ev.setUint32(12,cs,true);ev.setUint32(16,off,true);
  let total=off+cs+22;const out=new Uint8Array(total);let p=0;
  for(const b of parts){out.set(b,p);p+=b.length;}
  for(const b of central){out.set(b,p);p+=b.length;}
  out.set(eo,p);
  return out;
}

const xe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
const colName=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-n%26)/26|0;}return s;};

/* a cell is: value, or {v,s} where s = style index, or {v,s,n:true} for numeric */
function cellXml(c,r,i){
  const ref=colName(i)+r;
  if(c===null||c===undefined||c==='')return `<c r="${ref}"${c&&c.s?` s="${c.s}"`:''}/>`;
  const o=(typeof c==='object'&&!Array.isArray(c))?c:{v:c};
  const st=o.s?` s="${o.s}"`:'';
  if(o.n||typeof o.v==='number')return `<c r="${ref}"${st}><v>${Number(o.v)||0}</v></c>`;
  return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xe(o.v)}</t></is></c>`;
}
function sheetXml(rows,opts){

function dataUriToBytes(uri){

/* read PNG width/height from IHDR so the logo keeps its aspect ratio */
function pngSize(bytes){
  try{const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
    if(dv.getUint32(0)!==0x89504E47)return null;
    return {w:dv.getUint32(16),h:dv.getUint32(20)};}catch(e){return null;}
}

/**

function buildXlsx(sheets,logoUri){
  const files=[];

    logoBytes=dataUriToBytes(logoUri);
    const sz=logoBytes&&pngSize(logoBytes);

      if(ext.cx>2600000){ext.cx=2600000;ext.cy=Math.round(2600000/ratio);}}

  }
  const hasLogo=!!(logoUri&&logoBytes);

/** Any image the browser can show, as a JPEG the PDF can embed. White
    behind transparency, capped in size so a phone photo does not make a
    40 MB report. */
async function pdfJpeg(src,maxPx){
  if(!src)return null;
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';
      i.onload=()=>res(i);i.onerror=rej;i.src=src;});
    const k=Math.min(1,(maxPx||1200)/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);
    x.drawImage(im,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
    if(!blob)return null;
    return {bytes:new Uint8Array(await blob.arrayBuffer()),w:c.width,h:c.height};
  }catch(e){return null;}
}

/** Draws the header and footer on every page once the page count is known. */
async function pdfFrame(doc,meta){

  const lh=logo?doc.addJpeg(logo.bytes,logo.w,logo.h):0;

  doc.pages.forEach((pg,i)=>{
    doc.cur={ops:[]};

    if(lh){const hh=26,ww=Math.min(120,logo.w*hh/logo.h);
      doc.image(lh,M,M-4,ww,hh);tx=M+ww+12;}
    doc.text(tx,M+8,meta.title||'Report',{size:14,bold:true});

/** A paginated report made of table sections.

    A cell is a string/number or {v, bold, color, fill}. */
/** Column widths measured from the content. Each column gets at least
    the width of its longest word (so identifiers such as BQ-001 are never
    split), then the rest of the page goes to the columns whose text is
    longest. Returns null when even the minimum widths do not fit. */
function pdfColumnWidths(sec,width,FS,PAD){
  const cols=sec.columns;
  const cellText=(r,i)=>{const c=r[i];return c&&typeof c==='object'?String(c.v==null?'':c.v):String(c==null?'':c);};
  const words=t=>String(t).split(/\s+/).filter(Boolean);
  const mins=[],nats=[];
  cols.forEach((c,i)=>{
    let mn=0,nat=0;
    words(c.label).forEach(w=>{mn=Math.max(mn,pdfWidth(w,FS,true));});
    nat=Math.max(nat,pdfWidth(c.label,FS,true));
    sec.rows.slice(0,400).forEach(r=>{
      const t=cellText(r,i);
      words(t).forEach(w=>{mn=Math.max(mn,Math.min(pdfWidth(w,FS,false),110));});
      nat=Math.max(nat,Math.min(pdfWidth(t,FS,false),width*0.45));
    });
    mins.push(Math.max(mn,14)+2*PAD+1);nats.push(Math.max(nat+2*PAD+1,mins[i]));
  });
  const sumMin=mins.reduce((a,b)=>a+b,0),sumNat=nats.reduce((a,b)=>a+b,0);
  if(sumMin>width)return null;
  if(sumNat<=width){const k=width/sumNat;return nats.map(n=>n*k);}
  const spare=width-sumMin,want=nats.map((n,i)=>n-mins[i]),tw=want.reduce((a,b)=>a+b,0)||1;
  return mins.map((m,i)=>m+spare*want[i]/tw);
