function focusSoon(sel){
  setTimeout(()=>{ const el=document.querySelector(sel);
    if(el){ el.focus(); if(el.select) el.select(); el.scrollIntoView({block:'center', behavior:'smooth'}); } }, 30);
}
function uniqueId(prefix, seqKey, exists){
  let id; do{ id=prefix+(S[seqKey]++); } while(exists(id)); return id;
}
ROOT.addEventListener('keydown', e=>{ if(!e.target.closest('#panel')) return;
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-bomtoggle]')){ e.preventDefault(); e.target.click(); }
});
ROOT.addEventListener('click',e=>{ if(!e.target.closest('#panel')) return;
  const bomRow = e.target.closest('[data-bomtoggle]');
  if(bomRow){ const mid=bomRow.dataset.bomtoggle;
    openBom.has(mid)?openBom.delete(mid):openBom.add(mid); renderPanel(); return; }
  const t=e.target.closest('button'); if(!t || t.disabled) return;
  if(t.id==='btnAdd'){ const m=document.getElementById('addMenu'); m.hidden=!m.hidden; return; }
  if(t.dataset.add){ S.lines.push(newLine(t.dataset.add)); open.add(S.lines[S.lines.length-1].id);
    const m=document.getElementById('addMenu'); if(m) m.hidden=true; commit(); return; }
  if(t.dataset.del){ S.lines=S.lines.filter(l=>l.id!==t.dataset.del); commit(); return; }
  if(t.dataset.dup){ const o=S.lines.find(l=>l.id===t.dataset.dup);
    if(o){ const c={...o,id:'L'+(S.seq++)}; S.lines.splice(S.lines.indexOf(o)+1,0,c); commit(); } return; }
  if(t.dataset.toggle){ const id=t.dataset.toggle;
    open.has(id)?open.delete(id):open.add(id); renderPanel(); return; }
  if(t.id==='btnClear'){ clearArmed=true; renderPanel(); return; }
  if(t.id==='btnClearNo'){ clearArmed=false; renderPanel(); return; }
  if(t.id==='btnClearYes'){ S.lines=[]; clearArmed=false; commit(); toast('Schedule cleared'); return; }
  if(t.id==='btnBom'){ exportBom(); return; }
  if(t.id==='btnCut'){ exportCut(); return; }
  if(t.id==='btnAddType'){
    const id=uniqueId('T','typeSeq',x=>S.types.some(tp=>tp.id===x));
    S.types.push({id, n:'New type', kind:'other'}); commit(); toast('Material type added');
    focusSoon(`input.tname[data-type="${id}"]`); return; }
  if(t.dataset.delType){ const id=t.dataset.delType;
    if(S.materials.some(m=>m.g===id) || SEED_TYPE_IDS.has(id)) return;
    S.types=S.types.filter(tp=>tp.id!==id); commit(); toast('Type removed'); return; }
  if(t.dataset.addMat){ const g=t.dataset.addMat, tp=typeById(g), kind=tp?tp.kind:'other';
    const u=KIND_UNIT[kind]||'no', id=uniqueId('CM','matSeq',x=>S.materials.some(m=>m.id===x));
    const m={id, g, n:'New '+(tp?tp.n.replace(/s$/,'').toLowerCase():'material'), u, r:0};
    if(u==='sheet'){ m.sl=S.params.sheetL; m.sw=S.params.sheetW; m.t=kind==='board'?18:(kind==='top'?12:undefined); }
    S.materials.push(m); commit(); toast('Material added to '+(tp?tp.n:'type'));
    focusSoon(`input[data-mat="${id}"][data-k="n"]`); return; }
  if(t.dataset.delMaterial){ const id=t.dataset.delMaterial;
    if(PROTECTED_MATERIALS.has(id)) return;
    S.materials=S.materials.filter(m=>m.id!==id); commit(); toast('Material removed'); return; }
  if(t.id==='btnAddCore'){ const id=uniqueId('CC','coreSeq',x=>S.cores.some(c=>c.id===x));
    S.cores.push({id, n:'New core', r:0, t:44, fr:0, one:0}); commit(); toast('Core added');
    focusSoon(`input[data-core="${id}"][data-k="n"]`); return; }
  if(t.dataset.delCore){ if(t.dataset.delCore==='NONE') return;
    S.cores=S.cores.filter(c=>c.id!==t.dataset.delCore); commit(); toast('Core removed'); return; }
  if(t.id==='btnAddTrans'){ S.transport.push(['NEW LOCATION',0]); commit(); toast('Location added');
    focusSoon(`input[data-transname="${S.transport.length-1}"]`); return; }
  if(t.dataset.delTrans!==undefined && t.dataset.delTrans!==''){
    if(S.transport.length<=1) return;
    const i=+t.dataset.delTrans; const removedName=S.transport[i]?S.transport[i][0]:null;
    S.transport.splice(i,1);
    if(removedName && S.project.location===removedName){
      S.project.location = S.transport[0][0];
      toast('Active location removed — switched to '+S.project.location);
    } else toast('Location removed');
    renderProject(); commit(); return; }
  if(t.id==='btnAddIron'){ const id=uniqueId('CI','ironSeq',x=>S.ironItems.some(i=>i.id===x));
    S.ironItems.push({id, n:'New item', r:0}); commit(); toast('Item added');
    focusSoon(`input[data-iron="${id}"][data-k="n"]`); return; }
  if(t.dataset.delIron){ S.ironItems=S.ironItems.filter(i=>i.id!==t.dataset.delIron); commit(); toast('Item removed'); return; }
});

ROOT.addEventListener('input',e=>{ if(!e.target.closest('#panel')) return; if(!S) return;
  const el=e.target;
  if(el.id==='rateFilter'){ liveFilter('rates', el.value); return; }
  if(el.id==='paramFilter'){ liveFilter('params', el.value); return; }
  dirty();
  let touched=true;
  if(el.dataset.line){
    const l=S.lines.find(x=>x.id===el.dataset.line); if(!l) return;
    l[el.dataset.k] = el.type==='checkbox' ? el.checked
                    : (el.type==='number' ? (el.value===''?0:parseFloat(el.value)) : el.value);
    softRefresh();
  }
  else if(el.dataset.mat){
    const m=S.materials.find(x=>x.id===el.dataset.mat);
    if(m){
      const k=el.dataset.k;
      if(el.type==='checkbox') m[k]=el.checked?1:0;
      else if(k==='n'||k==='g'||k==='u') m[k]=el.value;
      else m[k]=el.value===''?undefined:parseFloat(el.value);
    }
    if(el.tagName==='SELECT' || el.type==='checkbox') renderPanel();
    renderTotals();
  }
  else if(el.dataset.type){
    const tp=typeById(el.dataset.type);
    if(tp){ if(el.dataset.k==='n') tp.n=el.value; else { tp.kind=el.value; renderPanel(); } }
    renderTotals();
  }
  else if(el.dataset.core){
    const c=S.cores.find(x=>x.id===el.dataset.core);
    if(c){ const k=el.dataset.k;
      if(k==='n') c.n=el.value;
      else if(el.type==='checkbox') c[k]=el.checked?1:0;
      else if(k==='sl'||k==='sw') c[k]=el.value===''?undefined:parseFloat(el.value);
      else c[k]=parseFloat(el.value)||0; }
    renderTotals();
  }
  else if(el.dataset.iron){
    const i=S.ironItems.find(x=>x.id===el.dataset.iron);
    if(i){ const k=el.dataset.k; if(k==='n') i.n=el.value; else i.r=parseFloat(el.value)||0; }
    renderTotals();
  }
  else if(el.dataset.transname!==undefined && el.dataset.transname!==''){
    const i=+el.dataset.transname; const old=S.transport[i][0];
    S.transport[i][0]=el.value;
    if(S.project.location===old) S.project.location=el.value;
    renderProject();
  }
  else if(el.dataset.trans!==undefined && el.dataset.trans!==''){
    S.transport[+el.dataset.trans][1]=parseFloat(el.value)||0; renderTotals(); }
  else if(el.dataset.param){ S.params[el.dataset.param]=parseFloat(el.value)||0; renderTotals(); }
  else if(el.dataset.comm){ S.commercial[el.dataset.comm]=parseFloat(el.value)||0; renderTotals(); }
  else touched=false;
  if(touched) scheduleSave();
});
function liveFilter(scope, q){
  q=(q||'').trim().toLowerCase();
  const root=document.querySelector(`#panel [data-scope="${scope}"]`); if(!root) return;
  root.querySelectorAll('[data-q]').forEach(row=>{
    row.hidden = !!q && !row.dataset.q.includes(q);
  });
  root.querySelectorAll('.grp').forEach(grp=>{
    const rows=grp.querySelectorAll('[data-q]');
    if(!rows.length){ grp.hidden=!!q; return; }
    grp.hidden = ![...rows].some(r=>!r.hidden);
  });
}
/* reprice every card in place (sheet shares move when any item changes) without losing focus */
function softRefresh(){
  document.querySelectorAll('#panel .card[data-card]').forEach(c=>{
    const l=S.lines.find(x=>x.id===c.dataset.card); if(!l) return;
    const p=priceLine(l);
    c.querySelector('.lmoney').innerHTML=moneyHtml(p);
    const sub=c.querySelector('.ltitle .sub'); if(sub) sub.innerHTML=subText(l,p);
    const w=c.querySelector('.warnslot'); if(w) w.innerHTML=warnHtml(p.warn);
    const bd=c.querySelector('.bd'); if(bd) bd.outerHTML=breakdown(p);
  });
  renderTotals();
}
function commit(){ dirty(); renderTotals(); renderNav(); renderPanel(); scheduleSave(); }

ROOT.addEventListener('input',e=>{
  const id=e.target.id;
  const k={pName:'name',pClient:'client',pLoc:'location',pAccess:'access',pCur:'currency',pStatus:'status'}[id];
  if(!k || !S || !canEditLines()) return;
  S.project[k] = id==='pAccess' ? (parseFloat(e.target.value)||1) : e.target.value;
  dirty(); renderTotals();
  if(id==='pName'){ renderNav(); document.title=(S.project.name||'Project')+' · ESTORA'; }
  if(['estimate','bom','iron'].includes(APP.view) && id!=='pName' && id!=='pClient') renderPanel();
  scheduleSave();
});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});

boot();
</script>
