<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESTORA</title>
<meta name="description" content="ESTORA — joinery, fit-out and door estimating: cut-list pricing, cutting layouts, BOM and team workspaces.">

:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --surface-inset:#f8f9fb;
  --border:#e3e6eb; --border-strong:#ccd1d9;
  --ink:#14161a; --ink-2:#565b66; --ink-3:#8a909b;
  --accent:#c2570f; --accent-ink:#8a3f0a; --accent-soft:#fbe9d9;
  --ok:#1f7a4d; --ok-soft:#e1f5ea;
  --warn:#96650a; --warn-soft:#fbf0d8;
  --crit:#b23a2e; --crit-soft:#fbe3e0;
  --nest-1:#f0d4b4; --nest-2:#cfe2c4; --nest-3:#c3dbea; --nest-4:#ecccd3; --nest-5:#e6dcb0; --nest-6:#d4cbec;
  --shadow:0 1px 2px rgba(20,22,26,.04), 0 6px 18px -10px rgba(20,22,26,.16);
  --ui:"SaudiRiyal","Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"SaudiRiyal","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1012; --surface:#17181b; --surface-2:#1d1f23; --surface-inset:#0d0e10;
  --border:#292b30; --border-strong:#3a3d44;
  --ink:#eef0f3; --ink-2:#a7acb7; --ink-3:#767b86;
  --accent:#e08a45; --accent-ink:#f2b07a; --accent-soft:#3a2413;
  --ok:#4bdb9a; --ok-soft:#0f2b1e;
  --warn:#e2b653; --warn-soft:#2e260f;
  --crit:#ef6f60; --crit-soft:#341412;
  --nest-1:#5a4128; --nest-2:#2c4a31; --nest-3:#24445a; --nest-4:#52303c; --nest-5:#4a4424; --nest-6:#3a3158;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 18px -10px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1012; --surface:#17181b; --surface-2:#1d1f23; --surface-inset:#0d0e10;
  --border:#292b30; --border-strong:#3a3d44;
  --ink:#eef0f3; --ink-2:#a7acb7; --ink-3:#767b86;
  --accent:#e08a45; --accent-ink:#f2b07a; --accent-soft:#3a2413;
  --ok:#4bdb9a; --ok-soft:#0f2b1e;
  --warn:#e2b653; --warn-soft:#2e260f;
  --crit:#ef6f60; --crit-soft:#341412;
  --nest-1:#5a4128; --nest-2:#2c4a31; --nest-3:#24445a; --nest-4:#52303c; --nest-5:#4a4424; --nest-6:#3a3158;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 18px -10px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;
  line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{display:block}
.ic{display:inline-flex;width:16px;height:16px;flex:none}
.ic svg{width:100%;height:100%}

/* ---------- app shell ---------- */
.app{display:flex;align-items:stretch;min-height:100vh}
.sidenav{width:222px;flex:0 0 222px;border-right:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;gap:20px;padding:20px 14px;
  position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;
  max-height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.brand .bname{font-weight:800;font-size:16.5px;letter-spacing:-.01em;line-height:1.15}
.brand .tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
#navList{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  color:var(--ink-2);font-weight:700;font-size:13px;background:none;border:0;text-align:left;width:100%}
.navitem .ic{opacity:.85}
.navitem .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navitem .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3);
  background:var(--surface-2);padding:1px 6px;border-radius:20px}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.active{background:var(--accent-soft);color:var(--accent-ink)}
.navitem.active .cnt{background:rgba(0,0,0,.06);color:var(--accent-ink)}
.sidefoot{margin-top:auto;padding:10px 6px 2px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.statusline{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--ok)}
.dot.busy{background:var(--warn)}
.pub{font-size:10px;color:var(--ink-3)}

.main{flex:1 1 auto;min-width:0}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);
  border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;gap:12px}
.appbar .mbrand{display:none;align-items:center;gap:8px;font-weight:800;font-size:15px}
.appbar .mbrand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex:none}
.appbar h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.01em}
.appbar .spacer{flex:1}

.metarow{display:flex;flex-wrap:wrap;gap:20px 26px;padding:14px 22px;border-bottom:1px solid var(--border)}
.metafield{display:flex;flex-direction:column;gap:3px;min-width:120px}
.metafield .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.metafield input,.metafield select{border:0;border-bottom:1.5px solid var(--border-strong);background:none;
  font-weight:700;font-size:13.5px;padding:2px 0;color:var(--ink);min-width:90px}
.metafield input:focus,.metafield select:focus{outline:none;border-color:var(--accent);color:var(--accent-ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px;padding:16px 22px 4px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:5px;letter-spacing:-.01em;white-space:nowrap}
.stat.hi{border-color:color-mix(in srgb, var(--accent) 45%, var(--border));background:var(--accent-soft)}
.stat.hi .v{color:var(--accent-ink)}
.stat.mg .v{color:var(--ok)}

.panel{padding:18px 22px 60px}
h2.sec{font-size:11px;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:26px 0 10px;font-weight:600}
h2.sec:first-child{margin-top:0}
.grp[hidden]{display:none}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--border-strong);background:var(--surface);padding:8px 14px;border-radius:9px;
  font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn.gho{border-color:transparent;background:none;color:var(--ink-3)}
.btn.gho:hover{color:var(--crit);background:var(--crit-soft)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar .spacer{flex:1 1 auto}
.confirm-inline{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);
  background:var(--crit-soft);border:1px solid var(--crit);border-radius:9px;padding:6px 6px 6px 12px}
.rmbtn{border:0;background:none;color:var(--ink-3);padding:5px;border-radius:7px;display:inline-flex}
.rmbtn:hover{color:var(--crit);background:var(--crit-soft)}
.rmbtn:disabled{opacity:.35;cursor:not-allowed}
.rmbtn:disabled:hover{color:var(--ink-3);background:none}

/* ---------- add-item popover ---------- */
.addwrap{position:relative}
.addmenu{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border);
  border-radius:11px;box-shadow:0 10px 28px -8px rgba(0,0,0,.28);padding:6px;min-width:230px;z-index:20;
  display:flex;flex-direction:column;gap:1px}
.addmenu[hidden]{display:none}
.addmenu button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;
  background:none;text-align:left;font-weight:700;font-size:12.5px;color:var(--ink);width:100%}
.addmenu button:hover{background:var(--surface-2)}
.addmenu .ic{color:var(--accent-ink)}

/* ---------- line cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;margin-bottom:12px;
  overflow:hidden;box-shadow:var(--shadow)}
.lhead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;flex:none}
.avatar .ic{width:18px;height:18px}
.avatar.door{background:var(--warn-soft);color:var(--warn)}
.ltitle{flex:1 1 170px;min-width:0}
.ltitle .name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:2px}
.ltitle .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--ink-3);background:var(--surface-2);
  padding:1px 6px;border-radius:20px;margin-left:6px}
.badge.door{background:var(--warn-soft);color:var(--warn)}
.lmoney{display:flex;gap:16px;align-items:baseline;margin-left:auto}
.lmoney div{text-align:right}
.lmoney .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lmoney .v{font-family:var(--mono);font-size:13.5px;font-weight:700;white-space:nowrap}
.lmoney .v.big{font-size:15.5px;color:var(--accent-ink)}
.chev{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:var(--surface);flex:none;color:var(--ink-3)}
.chev:hover{background:var(--surface-2);color:var(--ink)}
.chev .ic{transition:transform .15s}
.chev.open .ic{transform:rotate(180deg)}
.tchev{display:inline-flex;width:16px;height:16px;color:var(--ink-3);transition:transform .15s}
.tchev.open{transform:rotate(180deg)}

.dimrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));background:var(--surface);overflow:hidden;border-bottom:1px solid var(--border)}
.dcell{padding:8px 11px;background:var(--surface);min-width:0;box-shadow:1px 0 0 var(--border), 0 1px 0 var(--border)}
.dcell span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcell input,.dcell select{width:100%;border:0;background:none;font-weight:700;font-size:13px;padding:1px 0;
  font-family:var(--mono);color:var(--ink)}
.dcell select{font-family:var(--ui);font-size:12px}
.dcell input:focus,.dcell select:focus{outline:none;color:var(--accent-ink)}
.dcell.chk{display:flex;align-items:center;gap:7px;padding-top:15px}
.dcell.chk input{width:auto}
.dcell.chk label{font-size:12px;font-weight:700}
.dsep{grid-column:1/-1;background:var(--surface-inset);padding:5px 11px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.warnrow{display:flex;flex-direction:column;gap:3px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--warn-soft)}
.warnchip{font-size:12px;color:var(--warn);font-weight:700;display:flex;gap:7px;align-items:flex-start}
.warnchip .ic{width:14px;height:14px;margin-top:2px}
.lfoot{padding:8px 12px;display:flex;gap:8px;align-items:center}

/* ---------- breakdown ---------- */
.bd{background:var(--surface-inset);border-top:1px solid var(--border);padding:4px 0;overflow-x:auto}
.bd table{width:100%;border-collapse:collapse;font-size:12px}
.bd td{padding:5px 14px;border-bottom:1px solid var(--border)}
.bd tr:last-child td{border-bottom:0}
.bd .g td{background:var(--surface-2);font-family:var(--mono);font-size:9px;

/* ---------- data tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:16px}

table.grid input:focus{outline:none;border-color:var(--accent);background:var(--surface)}

  font-family:var(--ui);font-size:12px;border-radius:6px}
table.grid select:hover{border-color:var(--border)}
table.grid select:focus{outline:none;border-color:var(--accent);background:var(--surface)}

.tw.inner{margin-bottom:0}

  border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--ink-3)}
.namecell{display:flex;align-items:center;gap:6px}

.typehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:28px 0 10px}

.filterbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);

.note{border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--accent-soft);

.note strong{color:var(--ink)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));

    W:0.8, H:0.72, D:0.6, doors:2, shelfNos:1, partitions:0,
    drawerQty:0, drawerH:0.18, drawerW:0, hangerNos:0,
    carcaseMat:'MDF18', backMat:'MDF6', doorMat:'', boxMat:'',
    carcaseFinish:'HPL', doorFinish:'HPL', edgeMat:'', handle:'HNDL',
    topMat:'CORI', topW:0, topD:0, facia:0, plinthH:0,
  });
  if(type==='kitchen-base') Object.assign(d,{carcaseMat:'MRM18', backMat:'MRM6', topW:0.8, topD:0.6, facia:0.1, plinthH:0.10});
  if(type==='vanity')       Object.assign(d,{carcaseMat:'MRM18', backMat:'MRM6', topW:0.8, topD:0.6, facia:0.1});
  if(type==='kitchen-wall') Object.assign(d,{H:0.75, D:0.35, carcaseMat:'MRM18', backMat:'MRM6'});
  if(type==='kitchen-tall') Object.assign(d,{H:2.1, D:0.6, doors:2, shelfNos:4, carcaseMat:'MRM18', backMat:'MRM6', plinthH:0.10});
  if(t.fam==='door') Object.assign(d,{
    W:1.0, H:2.4, wallThk:0.10, frameSpecies:'MERA', core:'F60HS',
    leafFinish:'VOAK', ironSet:'IM02', visionGlass:'', visionM2:0, kick:false, louverType:'', louverM2:0});
  return d;
}
function newLine(type){ return {id:'L'+(S.seq++), ...lineDefaults(type)}; }

/* ============================================================ ENGINE — helpers */
const M    = id => S.materials.find(m=>m.id===id) || {id, n:'?', u:'', r:0, missing:true};
const CORE = id => S.cores.find(c=>c.id===id) || SEED_CORES[0];
const num  = v  => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const int  = v  => Math.max(0, Math.round(num(v)));
const ceil = n  => (n>0 ? Math.ceil(n - 1e-9) : 0);
const mm   = v  => Math.round(v*1000);
const isCoreId = mid => String(mid).indexOf('CORE:')===0;
const typeById = gid => S.types.find(t=>t.id===gid);
const kindOf   = m => (typeById(m.g) || {kind:'other'}).kind;
const thk      = mid => (num(M(mid).t) || 18)/1000;

function ironSetCost(id){
  const set = S.ironSets.find(s=>s.id===id);
  if(!set) return {total:0, parts:[]};
  const parts = set.items.map(([iid,q])=>{
    const it = S.ironItems.find(x=>x.id===iid) || {n:'?',r:0};
    return {n:it.n, q, r:+it.r, amt:q*(+it.r)};
  });
  return {total:parts.reduce((a,p)=>a+p.amt,0), parts, name:set.n};
}

// stock sheet for a nestable material (boards, sheet finishes, solid surface) or a door core blank
function sheetInfo(mid){
  const P=S.params;
  if(isCoreId(mid)){
    const c=CORE(mid.slice(5)), a=num(c.sl)||P.sheetL, b=num(c.sw)||P.sheetW;
    return {mid, L:Math.max(a,b), W:Math.min(a,b), name:c.n, rate:num(c.r), grain:false, solo:!!c.one, core:true};
  }
  const m=M(mid), a=num(m.sl)||P.sheetL, b=num(m.sw)||P.sheetW;
  return {mid, L:Math.max(a,b), W:Math.min(a,b), name:m.n, rate:num(m.r), grain:!!m.grain, solo:false, core:false};
}
// usable area: sheet minus edge trim, plus one kerf (every piece is costed with a kerf on two sides)
function usable(info){
  const P=S.params, k=Math.max(0,num(P.kerf))/1000, tr=info.core?0:Math.max(0,num(P.trim))/1000;
  return {k, tr, UL:info.L-2*tr+k, UW:info.W-2*tr+k};
}
// allowed placements of a piece; a = the dimension that runs with the grain (placed along the sheet length)
function orientations(info,a,b){
  const {k,UL,UW}=usable(info), E=1e-9, o=[];
  if(a+k<=UL+E && b+k<=UW+E) o.push([a,b]);
  if(!info.grain && Math.abs(a-b)>E && b+k<=UL+E && a+k<=UW+E) o.push([b,a]);
  return o;
}

/* ============================================================ ENGINE — item build-up
   Every item becomes a real cut list (panels with length × width × count). Sheet goods are
   nested project-wide; m² finishes come from net panel area; edge banding from panel edges. */
function mkCtx(){
  const acc=new Map(), ctx={pieces:[], warn:new Set()};
  ctx.add=(key,n,q,u,r,mid)=>{ if(!(q>1e-9)) return; const e=acc.get(key); if(e) e.q+=q; else acc.set(key,{n,q,u,r:num(r),mid}); };
  ctx.rows=()=>[...acc.values()].map(e=>({...e, amt:e.q*e.r}));
  return ctx;
}
// one cut part: nested if its material is a sheet (or a core); otherwise priced by its own unit
function pushPart(ctx, role, mid, part, a, b, n, solo){
  if(!(a>0.001 && b>0.001 && n>0)) return;
  const P=S.params;
  if(!isCoreId(mid) && M(mid).missing){ ctx.warn.add(`${role}: the material "${mid}" no longer exists — choose another`); return; }
  if(isCoreId(mid) || M(mid).u==='sheet'){
    ctx.pieces.push({role, mid, part, a, b, n, solo:!!solo});
    const info=sheetInfo(mid);
    if(!orientations(info,a,b).length)
      ctx.warn.add(`${part} ${mm(a)} × ${mm(b)} mm is larger than the ${info.name} ${info.core?'blank':'sheet'} (${mm(info.L)} × ${mm(info.W)}) — it is cut in sections and joined`);
    return;
  }
  const m=M(mid), key=role+'|'+mid, nm=role+' — '+m.n;
  if(m.u==='m2')      ctx.add(key, nm, a*b*n*P.wasteFactor, 'm2', m.r, mid);
  else if(m.u==='lm') ctx.add(key, nm, a*n*P.lippingWaste, 'lm', m.r, mid);
  else if(m.u==='m3') ctx.add(key, nm, a*b*((num(m.t)||18)/1000)*n, 'm3', m.r, mid);
  else                ctx.add(key, nm, n, m.u||'no', m.r, mid);
}
// panels → board pieces, finish pieces / areas, lacquer; returns total banded edge length
function applyPanels(ctx, panels){
  const P=S.params, o=Math.max(0,num(P.lamOversize))/1000;
  let edge=0;
  panels.forEach(p=>{
    pushPart(ctx, p.role, p.mid, p.part, p.a, p.b, p.n);
    edge += Math.max(0,p.edge||0)*p.n;
    if(!p.fin || !(p.faces>0)) return;
    const F=M(p.fin);
    if(F.missing){ ctx.warn.add(`The finish "${p.fin}" no longer exists — choose another`); return; }
    const role = (p.role==='Fronts'||p.role==='Plinth') ? 'Front finish'
               : (p.role==='Drawer boxes' ? 'Drawer box finish' : 'Carcase finish');
    if(F.u==='sheet') pushPart(ctx, role, F.id, p.part+' face', p.a+o, p.b+o, p.n*p.faces);
    else {
      const A=p.a*p.b*p.n*p.faces*P.wasteFactor;
      ctx.add(role+'|'+F.id, role+' — '+F.n, A, F.u||'m2', F.r, F.id);
      if(F.coat) ctx.add('coat|LACQ', 'Coating — '+M('LACQ').n, A, 'm2', M('LACQ').r, 'LACQ');
    }
  });
  return edge;
}

function carcaseBuild(l){
  const P=S.params, T=TYPES[l.type], ctx=mkCtx();
  const W=num(l.W), H=num(l.H), D=num(l.D);
  if(!(W>0 && H>0 && D>0)) ctx.warn.add('Enter the width, height and depth');
  const cF = l.carcaseFinish ? M(l.carcaseFinish) : null;
  const dF = l.doorFinish ? M(l.doorFinish) : null;
  // a faced board (melamine) IS the panel — it replaces the board instead of being bought on top of it
  const carId   = cF && cF.melamine ? cF.id : l.carcaseMat;
  const boxId   = cF && cF.melamine ? cF.id : (l.boxMat || l.carcaseMat);
  const frontId = dF && dF.melamine ? dF.id : (l.doorMat || l.carcaseMat);
  const backId  = l.backMat;
  const cFin = cF && !cF.melamine ? cF.id : '';
  const dFin = dF && !dF.melamine ? dF.id : '';
  const tC=thk(carId), tB=thk(backId), tX=thk(boxId);
  const doors=int(l.doors), shelves=int(l.shelfNos), parts=int(l.partitions), drawers=int(l.drawerQty), rails=int(l.hangerNos);
  const panels=[];
  const pan=(role,mid,part,a,b,n,fin,faces,edge)=>{ if(a>0.001 && b>0.001 && n>0) panels.push({role,mid,part,a,b,n,fin,faces,edge}); };

  const iw=W-2*tC, ih=H-2*tC, sd=D-tB-P.shelfSetback;
  const bays=parts+1, bayW=Math.max(0,(iw-parts*tC)/bays);
  pan('Carcase', carId, 'Side',         H,  D, 2, cFin, P.carcaseFaces, H);
  pan('Carcase', carId, 'Top / bottom', iw, D, 2, cFin, P.carcaseFaces, iw);
  pan('Back',    backId,'Back',         H,  W, 1, cFin, P.backFaces, 0);
  pan('Carcase', carId, 'Partition',    ih, sd, parts, cFin, P.carcaseFaces, ih);
  const shL=bayW-P.shelfClear;
  pan('Carcase', carId, 'Shelf',        shL, sd, shelves, cFin, P.carcaseFaces, shL);

  // drawers — a front each, plus a four-sided box and a bottom
  let stack=0, drw=0;
  if(drawers>0){
    const dfH=num(l.drawerH), dfW=num(l.drawerW)>0 ? num(l.drawerW) : W-P.doorGap;
    if(!(dfH>0)) ctx.warn.add('Set the drawer front height');
    else {
      drw=drawers; stack=drawers*dfH;
      if(stack>H+1e-6) ctx.warn.add(`${drawers} drawer fronts of ${mm(dfH)} mm are taller than the unit`);
      const fh=dfH-P.doorGap;
      pan('Fronts', frontId, 'Drawer front', fh, dfW, drawers, dFin, P.doorFaces, 2*(fh+dfW));
      const bxH=dfH-P.boxHeightDed, bxD=D-P.boxDepthDed, bxW=Math.min(iw,dfW)-P.runnerClear;
      if(bxH>0 && bxD>0 && bxW>2*tX){
        pan('Drawer boxes', boxId, 'Box side',         bxD,      bxH, 2*drawers, cFin, P.carcaseFaces, bxD);
        pan('Drawer boxes', boxId, 'Box front / back', bxW-2*tX, bxH, 2*drawers, cFin, P.carcaseFaces, bxW-2*tX);
        pan('Drawer boxes', backId,'Box bottom',       bxD,      bxW, drawers, '', 0, 0);
      } else ctx.warn.add('Drawer front is too small for a drawer box');
    }
  }
  // doors take the height left after the drawers
  let doorH=0, doorW=0, nDoors=0;
  if(doors>0 && W>0 && H>0){
    doorH=H-stack-P.doorGap; doorW=W/doors-P.doorGap;
    if(doorH<0.05){ ctx.warn.add('No height left for doors after the drawers'); doorH=0; }
    else { nDoors=doors; pan('Fronts', frontId, 'Door', doorH, doorW, doors, dFin, P.doorFaces, 2*(doorH+doorW)); }
  }
  const plH = T.plinth ? num(l.plinthH) : 0;
  if(plH>0) pan('Plinth', frontId, 'Plinth', W, plH, 1, dFin, 1, W);
  if(T.top && num(l.topW)>0){
    const tw=num(l.topW), td=num(l.topD), fa=num(l.facia);
    pan('Worktop', l.topMat, 'Worktop', tw, td, 1, '', 0, 0);
    pan('Worktop', l.topMat, 'Front facia', tw, fa, 1, '', 0, 0);
    pan('Top substrate', carId, 'Substrate', tw, td, 1, '', 0, 0);
  }
  const edgeLm = applyPanels(ctx, panels);

  // edge banding — auto: PVC for laminate/faced board, veneer lipping for veneers, none for paint
  const fAuto = cF || dF;
  const auto  = !fAuto ? 'LPVC' : (fAuto.paint ? '' : ((fAuto.u==='sheet'||fAuto.melamine) ? 'LPVC' : 'LVEN'));
  const eid = l.edgeMat==='NONE' ? '' : (l.edgeMat || auto);
  if(eid && edgeLm>0){ const E=M(eid);
    if(E.missing) ctx.warn.add('The selected edge banding no longer exists — choose another');
    else ctx.add('edge|'+eid, 'Edge banding — '+E.n, edgeLm*P.lippingWaste, E.u||'lm', E.r, eid); }

  // hardware
  if(nDoors>0) ctx.add('HING','Hinges', Math.max(P.hingeMin, ceil(doorH/P.hingeSpacing))*nDoors, 'no', M('HING').r, 'HING');
  if(W>0 && H>0) ctx.add('MFIX','Assembly fittings', (4+2*parts)*P.connectorsPerJoint, 'no', M('MFIX').r, 'MFIX');
  ctx.add('SHSP','Shelf supports', shelves*P.pinsPerShelf, 'no', M('SHSP').r, 'SHSP');
  ctx.add('RUNN','Drawer runners', drw, 'set', M('RUNN').r, 'RUNN');
  if(l.handle){ const h=M(l.handle);
    if(h.missing) ctx.warn.add('The selected handle no longer exists — choose another');
    else ctx.add('hdl|'+h.id, 'Handles — '+h.n, nDoors+drw, h.u||'no', h.r, h.id); }
  if(T.hanger && rails>0){
    ctx.add('HPIP','Hanger rail', rails*bayW, 'lm', M('HPIP').r, 'HPIP');
    ctx.add('HHLD','Hanger holders', rails*P.hangerHolderPer, 'no', M('HHLD').r, 'HHLD');
  }
  if(plH>0) ctx.add('LEGS','Adjustable legs', P.legsPerUnit, 'no', M('LEGS').r, 'LEGS');

  const hours = P.cabHoursBase + nDoors*P.cabHoursPerDoor + drw*P.cabHoursPerDrawer + parts*P.cabHoursPerPartition;
  return {pieces:ctx.pieces, rows:ctx.rows(), hours,
    install:P.cabInstall*num(S.project.access), handover:P.handoverCab, warn:[...ctx.warn],
    geo:{doorH, doorW, nDoors, drawers:drw}};
}

function doorBuild(l){
  const P=S.params, ctx=mkCtx();
  const W=num(l.W), H=num(l.H), per=W+H+H;
  if(!(W>0 && H>0)) ctx.warn.add('Enter the opening width and height');
  if(l.core && !S.cores.find(c=>c.id===l.core)) ctx.warn.add('The selected core no longer exists — choose another');
  const core=CORE(l.core), timber=M(l.frameSpecies);
  const dbl = W > P.doubleThreshold, nLeaf = dbl?2:1;
  const leafW=(W-P.leafClearW)/nLeaf, leafH=H-P.leafClearH;

  if(timber.missing) ctx.warn.add('The selected frame timber no longer exists — choose another');
  else {
    const tAdd=(nm,q)=>ctx.add(nm+'|'+timber.id, nm+' — '+timber.n, q, 'm3', timber.r, timber.id);
    tAdd('Frame', per*num(l.wallThk)*P.frameThk*P.frameAllow);
    tAdd('Architrave', per*P.archW*P.archT*P.archFaces*P.archAllow);
    tAdd('Leaf lipping', (leafW+leafH)*nLeaf*P.lipEdges*(num(core.t)/1000)*P.lipW*P.lipAllow);
    if(core.tubular) tAdd('Stile & rail', (leafW*3+leafH*2)*nLeaf*0.044*0.05*P.stileRailAllow);
  }
  if(core.id!=='NONE' && leafW>0 && leafH>0){
    pushPart(ctx, 'Door core', 'CORE:'+core.id, 'Leaf core', leafH, leafW, nLeaf, core.one);
    if(core.tubular) pushPart(ctx, 'Crossband', 'MDF6', 'Leaf crossband', leafH, leafW, nLeaf*2);
  }
  const fin = l.leafFinish ? M(l.leafFinish) : null;
  let sheetFin=false;
  if(fin && leafW>0 && leafH>0){
    if(fin.missing) ctx.warn.add('The selected leaf finish no longer exists — choose another');
    else if(fin.u==='sheet'){
      sheetFin=true; const o=Math.max(0,num(P.lamOversize))/1000;
      pushPart(ctx, 'Leaf finish', fin.id, 'Leaf face', leafH+o, leafW+o, nLeaf*P.leafFaces);
    } else {
      const q=leafW*leafH*nLeaf*P.leafFaces*P.veneerCoverage;
      ctx.add('lf|'+fin.id, 'Leaf finishing — '+fin.n, q, fin.u||'m2', fin.r, fin.id);
      if(fin.coat) ctx.add('coat|LACQ', 'Coating — '+M('LACQ').n, q, 'm2', M('LACQ').r, 'LACQ');
    }
  }
  if(num(l.visionM2)>0){
    const gid = l.visionGlass || (core.fr>0 ? 'GLSF' : 'GLSN'), gl=M(gid);
    if(gl.missing) ctx.warn.add('The selected glass no longer exists — choose another');
    else ctx.add('gl|'+gid, 'Vision panel — '+gl.n, num(l.visionM2), gl.u||'m2', gl.r, gid);
    if(core.fr>0 && gid==='GLSN') ctx.warn.add('Non-rated glass in a fire-rated leaf');
  }
  if(l.kick) ctx.add('KICK','Kick plate', W*P.kickHeight, 'm2', M('KICK').r, 'KICK');
  if(l.louverType && num(l.louverM2)>0){ const lv=M(l.louverType);
    if(lv.missing) ctx.warn.add('The selected louver no longer exists — choose another');
    else ctx.add('lv|'+lv.id, 'Louver — '+lv.n, num(l.louverM2), lv.u||'m2', lv.r, lv.id); }
  if(core.fr>0){
    const mult = core.fr<=30 ? P.sealMult30 : P.sealMult60;
    ctx.add('SEAL','Intumescent + smoke seal', (per+(dbl?leafH:0))*mult*P.sealFactor, 'lm', M('SEAL').r, 'SEAL');
    ctx.add('CERT','Certification / label', nLeaf, 'no', P.certPerLeaf, 'CERT');
  }
  const brk = ceil((per*2)/P.bracketSpacing);
  ctx.add('BRKT','Brackets', brk, 'no', M('BRKT').r, 'BRKT');
  ctx.add('SCRW','Screws', brk*P.screwsPerBracket, 'no', M('SCRW').r, 'SCRW');

  const rows=ctx.rows();
  const im = ironSetCost(l.ironSet);
  if(im.total>0) rows.push({n:'Ironmongery — '+im.name, q:1, u:'set', r:im.total,
                            amt:im.total, mid:'IRON:'+l.ironSet, parts:im.parts});
  const hours = (sheetFin ? P.doorHoursSheet : P.doorHoursWet) * (dbl ? P.doubleLeafHours : 1);
  return {pieces:ctx.pieces, rows, hours,
    install:(dbl?P.doorInstallDouble:P.doorInstallSingle)*num(S.project.access),
    handover:P.handoverDoor, dbl, warn:[...ctx.warn], geo:{nLeaf, leafW, leafH}};
}

let NEST = null;
const BUILD = new Map();
function dirty(){ NEST=null; BUILD.clear(); }
function lineBuild(l){
  let b=BUILD.get(l.id);
  if(!b){ b = (TYPES[l.type]||TYPES.cabinet).fam==='door' ? doorBuild(l) : carcaseBuild(l); BUILD.set(l.id,b); }
  return b;
}

/* ============================================================ ENGINE — nesting
   Guillotine packer (every cut runs edge to edge, so the plan works on a panel saw as well as a CNC).
   Several sort orders × split rules are tried and the plan with the fewest sheets wins. */
function packPieces(pieces, info){
  const {k,tr,UL,UW}=usable(info), E=1e-9, base={info,k,tr,UL,UW};
  const items=[];
  for(const p of pieces){
    let segs=[{a:p.a,b:p.b}], over=false;
    if(!orientations(info,p.a,p.b).length){
      const run=UL-k;
      if(run>E && p.b+k<=UW+E){ const s=Math.ceil(p.a/run-E); segs=Array.from({length:s},()=>({a:p.a/s,b:p.b})); }
      else if(run>E && !info.grain && p.a+k<=UW+E){ const s=Math.ceil(p.b/run-E); segs=Array.from({length:s},()=>({a:p.a,b:p.b/s})); }
      else over=true;
    }
    const n=Math.max(0,Math.round(p.n));
    for(let i=0;i<n;i++) segs.forEach((sg,j)=>items.push({a:sg.a, b:sg.b, over, solo:!!(p.solo||info.solo),
      lineId:p.lineId, part:segs.length>1?`${p.part} (${j+1}/${segs.length})`:p.part, joint:segs.length>1}));
  }
  if(!items.length) return {...base, sheets:[], count:0};
  if(items.length>9000){
    const A=items.reduce((s,i)=>s+i.a*i.b,0);
    return {...base, sheets:[], est:true, count:Math.max(1,Math.ceil(A/((UL-k)*(UW-k)*0.85)))};
  }
  const area=i=>i.a*i.b, lng=i=>Math.max(i.a,i.b), sht=i=>Math.min(i.a,i.b);
  const orders=[(x,y)=>area(y)-area(x), (x,y)=>lng(y)-lng(x)||area(y)-area(x),
                (x,y)=>sht(y)-sht(x)||lng(y)-lng(x), (x,y)=>(y.a+y.b)-(x.a+x.b)];
  let runs=[]; ['baf','bssf'].forEach(f=>orders.forEach(o=>['slas','maxa'].forEach(s=>runs.push([o,s,f]))));
  if(items.length>2500) runs=runs.slice(0,1); else if(items.length>800) runs=runs.slice(0,4);
  let best=null;
  for(const [o,s,f] of runs){
    const sh=guillotine(items.slice().sort(o), info, UL, UW, k, s, f);
    const used=sh.map(x=>x.placed.reduce((a,p)=>a+(p.over?0:p.w*p.h),0));
    const sc=sh.length + Math.min(...used)/(info.L*info.W)*0.999;
    if(!best || sc<best.sc-1e-12) best={sh,used,sc};
  }
  const sheets=best.sh.map((x,i)=>({placed:x.placed, used:best.used[i]}));
  return {...base, sheets, count:sheets.length};
}
function guillotine(items, info, UL, UW, k, split, fit){
  const E=1e-9, sheets=[];
  let minKeep=Infinity; items.forEach(i=>{ minKeep=Math.min(minKeep, Math.min(i.a,i.b)+k); });
  const keep=r=>r.w>E && r.h>E && Math.min(r.w,r.h)+E>=minKeep;
  for(const it of items){
    const os=orientations(info,it.a,it.b);
    if(it.over || !os.length){
      sheets.push({solo:true, free:[], placed:[{x:0,y:0,w:Math.min(it.a,UL-k),h:Math.min(it.b,UW-k),
        lineId:it.lineId, part:it.part, over:true}]}); continue; }
    if(it.solo){ const [w,h]=os[0];
      sheets.push({solo:true, free:[], placed:[{x:0,y:0,w,h,lineId:it.lineId,part:it.part,joint:it.joint}]}); continue; }
    let best=null;
    for(const sh of sheets){ if(sh.solo) continue;
      for(let fi=0;fi<sh.free.length;fi++){ const fr=sh.free[fi];
        for(const [w,h] of os){ const pw=w+k, ph=h+k;
          if(pw<=fr.w+E && ph<=fr.h+E){
            const baf=fr.w*fr.h-pw*ph, sss=Math.min(fr.w-pw, fr.h-ph);
            const sc = fit==='bssf' ? sss : baf, ss = fit==='bssf' ? baf : sss;
            if(!best || sc<best.sc-E || (Math.abs(sc-best.sc)<=E && ss<best.ss)) best={sh,fi,w,h,pw,ph,sc,ss};
          } } } }
    if(!best){
      const sh={free:[{x:0,y:0,w:UL,h:UW}], placed:[]}; sheets.push(sh);
      for(const [w,h] of os){ const pw=w+k, ph=h+k, ss=Math.min(UL-pw, UW-ph);
        if(!best || ss<best.ss) best={sh,fi:0,w,h,pw,ph,ss}; }
    }
    const sh=best.sh, fr=sh.free[best.fi]; sh.free.splice(best.fi,1);
    sh.placed.push({x:fr.x, y:fr.y, w:best.w, h:best.h, lineId:it.lineId, part:it.part, joint:it.joint});
    const rw=fr.w-best.pw, bh=fr.h-best.ph;
    const horiz = split==='slas' ? (rw<bh)
                : Math.max(rw*best.ph, fr.w*bh) >= Math.max(rw*fr.h, best.pw*bh);
    const r1 = horiz ? {x:fr.x+best.pw, y:fr.y, w:rw, h:best.ph} : {x:fr.x+best.pw, y:fr.y, w:rw, h:fr.h};
    const r2 = horiz ? {x:fr.x, y:fr.y+best.ph, w:fr.w, h:bh}    : {x:fr.x, y:fr.y+best.ph, w:best.pw, h:bh};
    if(keep(r1)) sh.free.push(r1);
    if(keep(r2)) sh.free.push(r2);
  }
  return sheets;
}
// the project nest — every item's pieces × its quantity, per material, packed together
function buildNest(){
  const mats={};
  S.lines.forEach(l=>{
    const q=Math.round(num(l.qty)); if(q<=0) return;
    lineBuild(l).pieces.forEach(p=>{
      const e = mats[p.mid] || (mats[p.mid]={mid:p.mid, pieces:[], area:0, pcs:0, byLine:{}});
      const A=p.a*p.b*p.n*q;
      e.pieces.push({...p, n:p.n*q, lineId:l.id}); e.area+=A; e.pcs+=p.n*q;
      e.byLine[l.id]=(e.byLine[l.id]||0)+A;
    });
  });
  Object.values(mats).forEach(e=>{ e.info=sheetInfo(e.mid); e.pack=packPieces(e.pieces, e.info); e.count=e.pack.count; });
  return {mats};
}
function getNest(){ return NEST || (NEST=buildNest()); }
// an item's share of a material's nested sheets (by net area; by blank for one-per-leaf cores)
function sheetShare(mid, l, b){
  const e=getNest().mats[mid];
  if(e && e.byLine[l.id]) return e;
  const pcs=b.pieces.filter(p=>p.mid===mid).map(p=>({...p, lineId:l.id})), info=sheetInfo(mid);
  return {info, count:packPieces(pcs,info).count,
    area:pcs.reduce((s,p)=>s+p.a*p.b*p.n,0), pcs:pcs.reduce((s,p)=>s+p.n,0)};
}

function priceLine(l){
  const P=S.params, C=S.commercial, b=lineBuild(l);
  const grp=new Map();
  b.pieces.forEach(p=>{ const k=p.role+'|'+p.mid;
    if(!grp.has(k)) grp.set(k,{role:p.role, mid:p.mid, area:0, pcs:0});
    const g=grp.get(k); g.area+=p.a*p.b*p.n; g.pcs+=p.n; });
  const sheetRows=[...grp.values()].map(g=>{
    const e=sheetShare(g.mid,l,b), info=e.info;
    const q = info.solo ? (e.pcs>0 ? g.pcs*e.count/e.pcs : 0) : (e.area>0 ? g.area*e.count/e.area : 0);
    return {n:g.role+' — '+info.name, q, u:'sheet', r:info.rate, amt:q*info.rate, mid:g.mid,
            area:g.area, pcs:g.pcs, nest:true};
  });
  const rows=[...sheetRows, ...b.rows];
  const material = rows.reduce((a,r)=>a+r.amt,0);
  const labour   = b.hours * P.labourRate;
  const consum   = material * P.consumablesPct/100;
  const trans    = (S.transport.find(t=>t[0]===S.project.location)||['',0])[1];
  const manpower = labour + (+trans) + b.install + b.handover;
  const direct   = material + consum + manpower;
  const projOH   = direct * C.projectOverheadPct/100;
  const coOH     = direct * C.companyOverheadPct/100;
  const cont     = direct * C.contingencyPct/100;
  const cost     = direct + projOH + coOH + cont;
  const margin   = cost * C.marginPct/100;
  const rate     = cost + margin + num(l.extra);
  return {...b, rows, material, labour, consum, trans:+trans, manpower, direct,
    projOH, coOH, cont, cost, margin, rate, qty:num(l.qty), amount:rate*num(l.qty)};
}


/* ============================================================ MIGRATE */
function migrate(o){
  const f = freshState();
  const s = {...f, ...o,
    project:{...f.project,...(o.project||{})},
    params:{...f.params,...(o.params||{})},
    commercial:{...f.commercial,...(o.commercial||{})},
    types:(o.types&&o.types.length)?o.types:f.types,
    materials:(o.materials&&o.materials.length)?o.materials:f.materials,
    cores:(o.cores&&o.cores.length)?o.cores:f.cores,
    ironItems:(o.ironItems&&o.ironItems.length)?o.ironItems:f.ironItems,
    ironSets:(o.ironSets&&o.ironSets.length)?o.ironSets:f.ironSets,
    transport:(o.transport&&o.transport.length)?o.transport:f.transport,
  };
  const firstUpgrade = !o.types;
  s.materials = s.materials.map(m=>{
    const x={...m};
    delete x.note; delete x.conflict; delete x.seed; delete x.perSheet;
    if(!x.g) x.g='misc';
    if(firstUpgrade && (x.id==='LVWD'||x.id==='LVAL') && x.g==='misc') x.g='louver';
    if(x.u==='sheet' && x.t===undefined){ const t=/(\d+(?:\.\d+)?)\s*mm/i.exec(x.n||''); if(t) x.t=parseFloat(t[1]); }
    if(firstUpgrade && x.coat===undefined && ['VOAK','VWAL','VMAH','VCHE','VASH'].includes(x.id)) x.coat=1;
    return x;
  });
  s.materials.forEach(m=>{ if(!s.types.find(t=>t.id===m.g)) s.types.push({id:m.g, n:m.g, kind:'other'}); });
  SEED_MATERIALS.forEach(sm=>{
    const need = PROTECTED_MATERIALS.has(sm.id) || (firstUpgrade && sm.id==='HNDL');
    if(need && !s.materials.find(m=>m.id===sm.id)) s.materials.push({...sm});
  });
  s.cores = s.cores.map(c=>({...c, one: c.one===undefined ? (num(c.fr)>0?1:0) : c.one}));
  s.lines = (o.lines||[]).map(l=>({...lineDefaults(l.type), ...l}));
  return s;
}

/* ---------- BOM ---------- */
function bomName(r){
  if(isCoreId(r.mid)) return CORE(r.mid.slice(5)).n;
  if(String(r.mid).indexOf('IRON:')===0) return r.n.replace(/^Ironmongery — /,'');
  if(r.mid==='CERT') return 'Certification / label';
  const m=M(r.mid); return m.missing ? r.n : m.n;
}
function bomRows(){
  const nest=getNest(), acc={};
  S.lines.forEach(l=>{ const p=priceLine(l), q=num(l.qty), t=TYPES[l.type];
    p.rows.forEach(r=>{
      if(!r.mid) return;
      const k=r.mid+'|'+r.u;
      const a = acc[k] || (acc[k]={mid:r.mid, u:r.u, n:bomName(r), q:0, amt:0, byLine:{}, nest:!!r.nest});
      a.q += r.q*q; a.amt += r.amt*q;
      const bl = a.byLine[l.id] || (a.byLine[l.id]={lineId:l.id, label:t.n, perItem:0, lineQty:q, amt:0, area:0, pcs:0});
      bl.perItem += r.q; bl.amt += r.amt*q;
      if(r.nest){ bl.area += r.area; bl.pcs += r.pcs; }
    });
  });
  Object.values(acc).forEach(a=>{
    if(!a.nest) return;
    const e=nest.mats[a.mid];
    if(e){ a.q=e.count; a.amt=e.count*e.info.rate; }   // the BOM buys exactly the sheets in the layout
  });
  return Object.values(acc).map(a=>({...a, byLine:Object.values(a.byLine).sort((x,y)=>y.amt-x.amt)}))
    .sort((a,b)=>b.amt-a.amt);
}
function lineIdx(id){ return Math.max(0, S.lines.findIndex(l=>l.id===id)); }
function lineColor(id){ return `var(--nest-${(lineIdx(id)%6)+1})`; }
function sheetSvg(sh, pk, caption){
  const {info,tr}=pk, L=info.L, Wd=info.W;
  const sc=Math.min(300/L, 170/Wd), vw=L*sc, vh=Wd*sc;
  let body=`<rect x="0.5" y="0.5" width="${(vw-1).toFixed(1)}" height="${(vh-1).toFixed(1)}" rx="2" style="fill:var(--surface);stroke:var(--border-strong);stroke-width:1"/>`;
  if(tr>0) body+=`<rect x="${(tr*sc).toFixed(1)}" y="${(tr*sc).toFixed(1)}" width="${((L-2*tr)*sc).toFixed(1)}" height="${((Wd-2*tr)*sc).toFixed(1)}" style="fill:none;stroke:var(--ink-3);stroke-width:.6;stroke-dasharray:2 2"/>`;
  sh.placed.forEach(p=>{
    const x=(tr+p.x)*sc, y=(tr+p.y)*sc, w=p.w*sc, h=p.h*sc;
    const fill=p.over?'var(--crit-soft)':lineColor(p.lineId), stroke=p.over?'var(--crit)':'var(--ink-3)';
    const tip=`${p.lineId} · ${p.part} · ${mm(p.w)} × ${mm(p.h)} mm${p.joint?' · joined section':''}${p.over?' · larger than the sheet':''}`;
    body+=`<g><title>${esc(tip)}</title><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" style="fill:${fill};stroke:${stroke};stroke-width:.6"/>`;
    if(w>24 && h>11) body+=`<text x="${(x+2.5).toFixed(1)}" y="${(y+9).toFixed(1)}" class="st">${esc(p.lineId)}</text>`;
    if(w>54 && h>21) body+=`<text x="${(x+2.5).toFixed(1)}" y="${(y+18.5).toFixed(1)}" class="sd">${mm(p.w)}×${mm(p.h)}</text>`;
    body+='</g>';
  });
  return `<figure class="sheetbox"><svg viewBox="0 0 ${vw.toFixed(1)} ${vh.toFixed(1)}" width="${vw.toFixed(0)}" height="${vh.toFixed(0)}" role="img" aria-label="${esc(caption)}">${body}</svg>
    <figcaption class="sheetcap">${esc(caption)}</figcaption></figure>`;
}
function layoutHtml(e){
  const pk=e.pack, info=e.info, A=info.L*info.W;
  if(pk.est) return `<div class="nestnote">Too many pieces to draw here — the sheet count is estimated from net area at 85% yield.</div>`;
  const groups=[], idx=new Map();
  pk.sheets.forEach((sh,i)=>{
    const sig=sh.placed.map(p=>[p.x,p.y,p.w,p.h].map(v=>v.toFixed(4)).join(',')+p.lineId+p.part).join('|');
    if(idx.has(sig)) groups[idx.get(sig)].n++; else { idx.set(sig,groups.length); groups.push({sh, first:i+1, n:1}); }
  });
  const ids=[...new Set(e.pieces.map(p=>p.lineId))];
  let h=`<div class="legend">${ids.map(id=>{ const l=S.lines.find(x=>x.id===id);
    return `<span><i style="background:${lineColor(id)}"></i>${esc(id)} ${esc(l?TYPES[l.type].n:'')}</span>`; }).join('')}</div>`;
  h+='<div class="nestgrid">';
  groups.slice(0,30).forEach(g=>{
    h+=sheetSvg(g.sh, pk, `Sheet ${g.first}${g.n>1?` · ×${g.n} identical`:''} · ${fmt(g.sh.used/A*100,0)}% used`);
  });
  h+='</div>';
  if(groups.length>30) h+=`<div class="nestnote">+ ${groups.length-30} more distinct layouts — all included in the count and the cut list.</div>`;
  return h;
}
function cutListRows(e){
  const agg=new Map();
  e.pieces.forEach(p=>{ const k=p.lineId+'|'+p.part+'|'+p.a.toFixed(4)+'|'+p.b.toFixed(4);
    const x=agg.get(k); if(x) x.n+=p.n; else agg.set(k,{...p}); });
  return [...agg.values()].sort((x,y)=>lineIdx(x.lineId)-lineIdx(y.lineId) || y.a*y.b-x.a*x.b);
}
function bomExpand(r){
  const e = r.nest ? getNest().mats[r.mid] : null;
  let h='<div class="bomexpand">';
  if(e){
    const info=e.info, pk=e.pack, tot=e.count*info.L*info.W, yl=tot>0?e.area/tot*100:0;
    h+=`<div class="kv">${kv('Stock sheet', `${mm(info.L)} × ${mm(info.W)} mm`)}${kv('Sheets', fmt(e.count,0))}
      ${kv('Net parts', fmt(e.area,2)+' m²')}${kv('Yield', fmt(yl,0)+'%')}${kv('Offcut & waste', fmt(Math.max(0,tot-e.area),2)+' m²')}
      ${kv('Kerf · trim', `${fmt(pk.k*1000,0)} · ${fmt(pk.tr*1000,0)} mm`)}${info.grain?kv('Grain','follows length'):''}
      ${info.solo?kv('Rule','one blank per leaf'):''}</div>`;
    h+=`<div class="subhead">Usage by item</div><div class="tw inner"><table class="grid"><thead><tr>
      <th>Item</th><th class="num">Pieces / item</th><th class="num">Net m² / item</th><th class="num">Sheets / item</th>
      <th class="num">Item qty</th><th class="num">Sheets</th><th class="num">Value</th></tr></thead><tbody>`;
    r.byLine.forEach(b=>{ h+=`<tr><td>${esc(b.label)} <span class="badge">${esc(b.lineId)}</span></td>

    h+=`</tbody><tfoot><tr><td>Total</td><td></td><td></td><td></td><td></td><td class="num">${fmt(e.count,0)}</td><td class="num">${money(r.amt)}</td></tr></tfoot></table></div>`;

      <th class="num">Length mm</th><th class="num">Width mm</th><th class="num">Qty</th><th>Note</th></tr></thead><tbody>`;
    cl.forEach(p=>{ const fits=orientations(info,p.a,p.b).length>0;
      h+=`<tr><td><span class="badge" style="margin-left:0">${esc(p.lineId)}</span></td><td>${esc(p.role)} · ${esc(p.part)}</td>
        <td class="num">${mm(p.a)}</td><td class="num">${mm(p.b)}</td><td class="num">${fmt(p.n,0)}</td>
        <td class="lab">${fits?'':'cut in sections and joined'}</td></tr>`; });
    h+='</tbody></table></div>';
  } else {
    h+=`<div class="subhead">Usage by item</div><div class="tw inner"><table class="grid"><thead><tr>
      <th>Item</th><th class="num">Qty / item</th><th>Unit</th><th class="num">Item qty</th>
      <th class="num">Extended qty</th><th class="num">Value</th></tr></thead><tbody>`;
    r.byLine.forEach(b=>{ h+=`<tr><td>${esc(b.label)} <span class="badge">${esc(b.lineId)}</span></td>
      <td class="num">${qfmt(b.perItem,r.u)}</td><td class="lab">${esc(r.u)}</td><td class="num">${fmt(b.lineQty,0)}</td>

    h+=`</tbody><tfoot><tr><td>Total</td><td></td><td></td><td></td><td class="num">${qfmt(r.q,r.u)}</td><td class="num">${money(r.amt)}</td></tr></tfoot></table></div>`;

function viewBom(){

  const tot=rows.reduce((a,r)=>a+r.amt,0);
  let h = `<div class="note"><strong>This is the procurement BOM.</strong> Click a material to see which items use it —
    quantity per item and extended. Every sheet material opens its cutting layout and cut list, and its quantity is the
    number of sheets in that layout, so the BOM and the cutting plan always agree.</div>`;
  h += `<div class="bar"><button class="btn" id="btnBom">${icon('download')}<span>Export BOM</span></button>
    <button class="btn" id="btnCut">${icon('download')}<span>Export cut list</span></button></div>`;

    <th class="num">Value</th><th class="num">% of material</th>
  </tr></thead><tbody>`;
  rows.forEach(r=>{
    const isOpen = openBom.has(r.mid);
    h += `<tr class="bomrow${isOpen?' open':''}" data-bomtoggle="${esc(r.mid)}" tabindex="0" aria-expanded="${isOpen}">
      <td><span class="tchev${isOpen?' open':''}">${icon('chevron')}</span></td>
      <td>${esc(r.n)}</td><td class="num">${qfmt(r.q,r.u)}</td><td class="lab">${esc(r.u)}</td>

  h+='<div class="note">Sets reference items — if you remove an item a set uses, that line of the set shows as zero until you add a replacement.</div>';
  S.ironSets.forEach(s=>{
    const c=ironSetCost(s.id);
    if(!s.items.length) return;

      <th>${esc(s.n)}</th><th class="num" style="width:70px">Qty</th>

      </tbody><tfoot><tr><td>Set total</td><td></td><td></td><td class="num">${money(c.total)}</td></tr></tfoot></table></div>`;
  });
  return h;
}

<script>
/* ==================== XLSX writer (no dependencies, logo-capable) ==================== */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;}
const ENC=new TextEncoder();
const bytesOf=v=>typeof v==='string'?ENC.encode(v):v;

function zipStore(files){
  const parts=[],central=[];let off=0;
  for(const f of files){
    const name=ENC.encode(f.name),data=bytesOf(f.data),crc=crc32(data);
    const lh=new Uint8Array(30+name.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);
    dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0x21,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);
    dv.setUint16(26,name.length,true);dv.setUint16(28,0,true);
    lh.set(name,30);parts.push(lh,data);
    const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0x21,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,off,true);
    ch.set(name,46);central.push(ch);
    off+=lh.length+data.length;
  }
  let cs=0;central.forEach(c=>cs+=c.length);
  const eo=new Uint8Array(22),ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,central.length,true);
  ev.setUint16(10,central.length,true);ev.setUint32(12,cs,true);ev.setUint32(16,off,true);
  let total=off+cs+22;const out=new Uint8Array(total);let p=0;
  for(const b of parts){out.set(b,p);p+=b.length;}
  for(const b of central){out.set(b,p);p+=b.length;}
  out.set(eo,p);
  return out;
}

const xe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))

function cellXml(c,r,i){

  const o=(typeof c==='object'&&!Array.isArray(c))?c:{v:c};

  if(o.n||typeof o.v==='number')return `<c r="${ref}"${st}><v>${Number(o.v)||0}</v></c>`;

<script>

/* ==================================================================
   STORAGE ADAPTERS
   One interface, two back ends. The cloud one talks to Supabase over
   plain HTTPS, where Postgres row-level security enforces every
   permission; the local one keeps a demo copy in this browser.
   ================================================================== */
function qs(filter){
  const p=[];
  if(!filter) return '';
  Object.entries(filter.eq||{}).forEach(([k,v])=>p.push(`${k}=eq.${encodeURIComponent(v)}`));
  Object.entries(filter.in||{}).forEach(([k,v])=>p.push(`${k}=in.(${v.map(x=>'"'+String(x).replace(/"/g,'')+'"').map(encodeURIComponent).join(',')})`));
  if(filter.order) p.push('order='+filter.order);
  return p.length ? '&'+p.join('&') : '';
}

function CloudStore(cfg){
  const base=cfg.url.replace(/\/$/,''), anon=cfg.anonKey;
  const SKEY='es:session';
  let ses=null;               // {access, refresh, exp (ms), user:{id,email}}
  try{ ses=JSON.parse(localStorage.getItem(SKEY)||'null'); }catch(e){}
  const keep=()=>{ try{ ses?localStorage.setItem(SKEY,JSON.stringify(ses)):localStorage.removeItem(SKEY); }catch(e){} };
  const anonIsJwt=/^eyJ/.test(String(anon||''));
  const auth=(p,opts)=>fetch(base+'/auth/v1'+p,{...opts,
    headers:{apikey:anon,'Content-Type':'application/json',...(opts&&opts.headers||{})}});
  function take(j){
    if(!j || !j.access_token) return null;
    ses={access:j.access_token, refresh:j.refresh_token||'', exp:Date.now()+((+j.expires_in||3600)*1000),
         user:{id:j.user&&j.user.id, email:j.user&&j.user.email}};
    keep(); return ses.user;
  }
  async function refresh(){
    if(!ses || !ses.refresh) return false;
    try{
      const r=await auth('/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:ses.refresh})});
      if(!r.ok) return false;
      return !!take(await r.json());
    }catch(e){ return false; }
  }
  async function fresh(){
    if(ses && ses.exp && ses.exp-Date.now()<90000) await refresh();
  }
  const hdr=extra=>({apikey:anon, ...(ses?{Authorization:'Bearer '+ses.access}:(anonIsJwt?{Authorization:'Bearer '+anon}:{})),
    'Content-Type':'application/json', ...extra});
  async function call(url,opts,retry=true){
    await fresh();
    const r=await fetch(url,{...opts,headers:hdr(opts&&opts.headers)});
    if(r.status===401 && retry && await refresh()) return call(url,opts,false);
    if(r.status===401){ ses=null; keep(); if(store.onsignout) store.onsignout(); throw Object.assign(new Error('signed-out'),{status:401}); }
    const t=await r.text();
    if(!r.ok){
      let msg='';
      try{ const j=JSON.parse(t); msg=j.message||j.hint||j.details||''; }catch(e){ msg=t.slice(0,200); }
      throw Object.assign(new Error(msg||('cloud '+r.status)),{status:r.status, serverMessage:msg});
    }
    return t?JSON.parse(t):null;
  }
  const store={
    kind:'cloud', needsAuth:true,
    get user(){ return ses&&ses.user; },
    async restore(){
      if(!ses) return null;
      await fresh();
      try{
        const r=await auth('/user',{headers:{Authorization:'Bearer '+ses.access}});
        if(!r.ok){ if(!(await refresh())){ store.signOut(); return null; } }
        else { const u=await r.json(); ses.user={id:u.id,email:u.email}; keep(); }
        return ses.user;
      }catch(e){ return ses.user; }
    },
    /* a link from a confirmation or password-reset email lands with the session in the address */
    fromHash(hash){
      const h=new URLSearchParams(String(hash||'').replace(/^#/,''));
      if(h.get('error_description')) return {error:h.get('error_description')};
      if(!h.get('access_token')) return null;
      take({access_token:h.get('access_token'), refresh_token:h.get('refresh_token'),
            expires_in:h.get('expires_in')||3600, user:{}});
      return {type:h.get('type')||''};
    },
    async signIn(email,password){
      const r=await auth('/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){
        const m=String(j.error_description||j.msg||j.message||'').toLowerCase();
        if(m.includes('confirm')) throw new Error('Confirm your email first — open the link we sent you, then sign in.');
        throw new Error('Those details were not recognised. Check your email and password.');
      }
      return take(j);
    },
    async signUp(email,password,redirect){
      const r=await auth('/signup'+(redirect?'?redirect_to='+encodeURIComponent(redirect):''),{method:'POST',body:JSON.stringify({email,password})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){
        const m=String(j.msg||j.error_description||j.error||j.message||'').toLowerCase();
        if(m.includes('already')) throw Object.assign(new Error('That email already has an account. Sign in instead.'),{exists:true});
        if(m.includes('password')) throw new Error(j.msg||j.message||'That password is not strong enough.');
        throw new Error(j.msg||j.error_description||j.message||'Could not create that account.');
      }
      if(j.access_token){ take(j); return {needsVerification:false}; }
      // a confirmed-email project returns a user with no identities when the address is already registered
      if(j.identities && !j.identities.length) throw Object.assign(new Error('That email already has an account. Sign in instead.'),{exists:true});
      return {needsVerification:true};
    },
    async resend(email,redirect){
      const r=await auth('/resend'+(redirect?'?redirect_to='+encodeURIComponent(redirect):''),{method:'POST',body:JSON.stringify({type:'signup',email})});
      if(!r.ok) throw new Error('Could not send that email again just now.');
    },
    async sendReset(email,redirect){
      const r=await auth('/recover'+(redirect?'?redirect_to='+encodeURIComponent(redirect):''),
        {method:'POST',body:JSON.stringify({email})});
      if(!r.ok) throw new Error('Could not send the reset email just now.');
    },
    async setPassword(password){
      await fresh();
      const r=await auth('/user',{method:'PUT',headers:{Authorization:'Bearer '+(ses&&ses.access)},body:JSON.stringify({password})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.msg||j.message||'Could not set that password.');
      if(j.email&&ses){ ses.user={id:j.id,email:j.email}; keep(); }
    },
    signOut(){
      const tok=ses&&ses.access;
      ses=null; keep();
      if(tok) auth('/logout',{method:'POST',headers:{Authorization:'Bearer '+tok}}).catch(()=>{});
    },
    rpc(name,args){ return call(base+'/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(args||{})}); },
    select(table,filter){ return call(base+'/rest/v1/'+table+'?select=*'+qs(filter),{}); },
    insert(table,rows,upsert){
      return call(base+'/rest/v1/'+table,{method:'POST',body:JSON.stringify(rows),
        headers:{Prefer:(upsert?'resolution=merge-duplicates,':'')+'return=minimal'}});
    },
    patch(table,filter,body){
      return call(base+'/rest/v1/'+table+'?'+qs(filter).slice(1),{method:'PATCH',body:JSON.stringify(body),
        headers:{Prefer:'return=minimal'}});
    },
    del(table,filter){
      return call(base+'/rest/v1/'+table+'?'+qs(filter).slice(1),{method:'DELETE',headers:{Prefer:'return=minimal'}});
    },
  };
  return store;
}

/* A demo copy: everything in this browser, one administrator, no licence. */
function LocalStore(){
  const KEY='estora.local.v1';
  let db;
  try{ db=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!db) db={es_projects:[], es_lines:[], es_meta:[]};
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){ throw new Error('This browser has run out of storage space.'); } };
  const match=(r,f)=>{
    if(!f) return true;
    for(const [k,v] of Object.entries(f.eq||{})) if(String(r[k])!==String(v)) return false;
    for(const [k,v] of Object.entries(f.in||{})) if(!v.map(String).includes(String(r[k]))) return false;
    return true;
  };
  const pk=(t,r)=>t==='es_meta'?r.id:r.id;
  return {
    kind:'local', needsAuth:false, user:{id:'local',email:''},
    async restore(){ return this.user; }, fromHash(){ return null; }, signOut(){},
    async rpc(name,args){
      if(name==='es_whoami') return {orgId:'local', orgName:(db.es_meta.find(m=>m.id==='org')||{data:{}}).data.name||'My company',
        userId:'local', name:'You', role:'Admin', projects:'all', tabs:TABS.map(t=>TAB_KEY[t[0]]), active:true,
        license:{plan:'demo', enforce:false, expired:false, trial:false, seats:UNLIMITED, projects:UNLIMITED}, isOwner:false};
      if(name==='es_delete_project'){ db.es_projects=db.es_projects.filter(p=>p.id!==args.p_id);
        db.es_lines=db.es_lines.filter(l=>l.project_id!==args.p_id); save(); return {removed:args.p_id}; }
      if(name==='es_rename_org'){ this._meta('org',{name:args.p_name}); return {name:args.p_name}; }
      throw new Error('Available in the cloud workspace only.');
    },
    _meta(id,patch){ let m=db.es_meta.find(x=>x.id===id); if(!m){ m={id,org_id:'local',data:{}}; db.es_meta.push(m); }
      Object.assign(m.data,patch); save(); },
    async select(t,f){ return JSON.parse(JSON.stringify((db[t]||[]).filter(r=>match(r,f)))); },
    async insert(t,rows){
      const arr=db[t]||(db[t]=[]);
      rows.forEach(r=>{ const i=arr.findIndex(x=>pk(t,x)===pk(t,r));
        const row={org_id:'local', updated_at:new Date().toISOString(), created_at:new Date().toISOString(), ...r};
        if(i<0) arr.push(row); else arr[i]={...arr[i],...row}; });
      save();
    },
    async patch(t,f,body){ (db[t]||[]).forEach((r,i,a)=>{ if(match(r,f)) a[i]={...r,...body,updated_at:new Date().toISOString()}; }); save(); },
    async del(t,f){ db[t]=(db[t]||[]).filter(r=>!match(r,f)); save(); },
  };
}

function makeStore(){
  let cfg=null;
  try{ const o=JSON.parse(localStorage.getItem('es:backend')||'null'); if(o&&o.url&&o.anonKey) cfg=o; }catch(e){}
  if(!cfg && CLOUD_URL && CLOUD_KEY) cfg={url:CLOUD_URL, anonKey:CLOUD_KEY};
  return cfg ? CloudStore(cfg) : LocalStore();
}

/* ---------- permissions ---------- */
function rank(){ const w=APP.who; if(!w || w.active===false) return 0; return (ROLES[w.role]||{rank:0}).rank; }
const isAdmin   = () => rank()>=5;
const lic       = () => (APP.who && APP.who.license) || {};
const expired   = () => !!(lic().enforce && lic().expired);
const canEditLines = () => rank()>=3 && !expired();
const canManage = () => rank()>=4 && !expired();
function tabAllowed(view){
  if(!TAB_KEY[view]) return true;
  if(isAdmin()) return true;
  const t=(APP.who&&APP.who.tabs)||[];
  return t.includes(TAB_KEY[view]);
}
function viewEditable(view){
  if(!APP.project) return false;
  if(['estimate','rates','iron'].includes(view)) return canEditLines();
  if(['params','commercial'].includes(view)) return canManage();
  return false;
}
function friendly(e){
  const m=(e && (e.serverMessage||e.message)) || String(e||'');
  if(/row-level security|permission denied|not permitted|42501/i.test(m))
    return expired() ? 'Your licence has expired, so the workspace is read-only until it is renewed.'
                     : 'Your role does not allow that change.';
  if(/Failed to fetch|NetworkError|load failed/i.test(m)) return 'Could not reach the server — check your connection and try again.';
  if(m==='signed-out') return 'Your session ended — sign in again.';
  return m.replace(/^cloud \d+\s*/,'') || 'Something went wrong.';
}

/* ---------- boot ---------- */
function pending(k,v){
  try{ if(v===undefined) return JSON.parse(localStorage.getItem('es:pending-'+k)||'null');
       if(v===null) localStorage.removeItem('es:pending-'+k); else localStorage.setItem('es:pending-'+k,JSON.stringify(v)); }catch(e){}
  return null;
}
async function boot(){
  applyTheme();
  APP.store=makeStore();
  APP.store.onsignout=()=>{ stopPolling(); resetSession(); APP.screen='auth'; APP.authScreen='signin';
    APP.authNotice='Your session ended — please sign in again.'; renderRoot(); };
  renderRoot();
  const h=APP.store.fromHash(location.hash);
  if(h){
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    if(h.error){ APP.authError=h.error; }
    else if(h.type==='recovery'){ APP.screen='setpass'; renderRoot(); return; }
  }
  const u=await APP.store.restore();
  if(!u){ APP.screen='auth'; renderRoot(); return; }
  await enter();
}
function resetSession(){
  APP.who=null; APP.org={}; APP.library=null; APP.users=[]; APP.projects=[]; APP.project=null;
  APP.ownerOrgs=null; APP.payments=[]; APP.keys=[]; S=null; APP.view='projects'; activeTab='projects';
}
async function enter(){
  APP.screen='loading'; renderRoot();
  let who;
  try{ who=await APP.store.rpc('es_whoami',{}); }
  catch(e){ APP.screen='auth'; APP.authError=friendly(e); renderRoot(); return; }
  if(!who || !who.orgId){
    const reg=pending('org'), join=pending('join');
    try{
      if(join){ await APP.store.rpc('es_claim_invite',{p_code:join.code}); pending('join',null); return enter(); }
      if(reg){ await APP.store.rpc('es_register_org',{p_org_name:reg.org, p_person_name:reg.name}); pending('org',null); return enter(); }
    }catch(e){ pending('join',null); APP.authError=friendly(e); }
    APP.who=who||{}; APP.screen='noaccount'; renderRoot(); return;
  }
  APP.who=who;
  try{ await loadOrg(); }catch(e){ toast(friendly(e),'crit'); }
  APP.screen='app';
  let last=null; try{ last=JSON.parse(localStorage.getItem('es:last-'+who.orgId)||'null'); }catch(e){}
  if(last && last.projectId && APP.projects.some(p=>p.id===last.projectId)) await openProject(last.projectId, last.view||'estimate', true);
  else { setView('projects'); renderRoot(); }

/* ---------- a project and its estimate ---------- */
function libOf(s){ const {project, lines, ...lib}=s; return JSON.parse(JSON.stringify(lib)); }
function projRowOf(s){
  return {name:s.project.name||'Untitled project', client:s.project.client||'', code:s.project.code||'',
    location:s.project.location||'', access:+s.project.access||1, currency:s.project.currency||'SAR',
    status:s.project.status||'Estimating', library:libOf(s), seq:s.seq};
}
function composeState(row, lineRows){
  const lib=(row.library && Object.keys(row.library).length) ? row.library : (APP.library || {});
  const o={...JSON.parse(JSON.stringify(lib)),
    project:{name:row.name, client:row.client||'', code:row.code||'', location:row.location||'',
             access:+row.access||1, currency:row.currency||'SAR', status:row.status||'Estimating'},
    lines:(lineRows||[]).slice().sort((a,b)=>a.pos-b.pos)
            .map(r=>({...(r.data||{}), id:(r.data&&r.data.id)||String(r.id).split(':').pop()})),
    seq:lib.seq||row.seq||1};
  const s=migrate(o);
  if(!s.transport.find(t=>t[0]===s.project.location)) s.project.location=(s.transport[0]||[''])[0];
  const mx=Math.max(0,...s.lines.map(l=>parseInt(String(l.id).replace(/\D/g,''),10)||0));
  if(!(s.seq>mx)) s.seq=mx+1;
  return s;
}
function snapshot(s){
  return {lines:new Map(s.lines.map((l,i)=>[l.id, JSON.stringify([i,l])])), proj:JSON.stringify(projRowOf(s))};
}
async function openProject(id, view, quiet){
  await flushNow();
  try{
    const [rows, lines]=await Promise.all([APP.store.select('es_projects',{eq:{id}}),
                                           APP.store.select('es_lines',{eq:{project_id:id}, order:'pos.asc'})]);
    if(!rows || !rows.length){ if(!quiet) toast('That project is no longer available to you.','crit'); setView('projects'); renderRoot(); return; }
    APP.project=rows[0];
    S=composeState(rows[0], lines);
    APP.lastSaved=snapshot(S);
    open.clear(); openBom.clear(); dirty();
    let v=view||'estimate'; if(!tabAllowed(v)) v=(TABS.find(t=>tabAllowed(t[0]))||['projects'])[0];
    setView(v);
  }catch(e){ toast(friendly(e),'crit'); setView('projects'); }
  renderRoot();
}
function closeProject(){ APP.project=null; S=null; setView('projects'); }

/* ---------- saving: whatever changed since the last save, and nothing else ---------- */
function markSync(t,cls){
  const el=document.getElementById('syncTop'); if(!el) return;
  el.innerHTML=`<span class="dot${cls?' '+cls:''}"></span>${esc(t)}`;
}
function scheduleSave(){
  if(!APP.project || !S) return;
  APP.pending=true; markSync('saving…','busy');
  clearTimeout(saveTimer); saveTimer=setTimeout(flush, 700);
}
async function flushNow(){ if(APP.pending){ clearTimeout(saveTimer); await flush(); } }
async function flush(){
  if(!APP.project || !S) return;
  if(APP.saving){ APP.again=true; return; }
  APP.saving=true;
  const pid=APP.project.id, snap=snapshot(S), prevIds=new Set([...APP.lastSaved.lines.keys()].map(k=>pid+':'+k));
  try{
    const ups=[], dels=[];
    S.lines.forEach((l,i)=>{ if(APP.lastSaved.lines.get(l.id)!==snap.lines.get(l.id))
      ups.push({id:pid+':'+l.id, project_id:pid, pos:i, data:l, updated_by:(APP.who&&APP.who.name)||''}); });
    APP.lastSaved.lines.forEach((j,id)=>{ if(!snap.lines.has(id)) dels.push(pid+':'+id); });
    if(snap.proj!==APP.lastSaved.proj){
      const body=JSON.parse(snap.proj);
      await APP.store.patch('es_projects',{eq:{id:pid}},body);
      const li=APP.projects.find(p=>p.id===pid); if(li) Object.assign(li,{...body, library:undefined, updated_at:new Date().toISOString()});
    }
    if(dels.length) await APP.store.del('es_lines',{in:{id:dels}});
    if(ups.length) await APP.store.insert('es_lines',ups,true);
    APP.lastSaved=snap; APP.pending=false;
    markSync(isCloud()?'saved':'saved on this device','ok');
    if(lic().trial && (dels.length || ups.some(u=>!prevIds.has(u.id)))) refreshWho().then(renderBanner);
  }catch(e){
    APP.saving=false;
    const m=friendly(e);
    if(/free trial prices up to/i.test(m)){
      const before=S.lines.length;
      S.lines=S.lines.filter(l=>APP.lastSaved.lines.has(l.id));
      toast(m,'crit'); dirty(); renderRoot();
      if(S.lines.length!==before) return flush();
    }
    APP.pending=false; markSync('not saved','crit'); toast(m,'crit');
    if(e && e.status===401) return;
    return;
  }
  APP.saving=false;
  if(APP.again){ APP.again=false; flush(); }
}

/* ---------- keeping in step with colleagues ---------- */
function startPolling(){
  stopPolling();
  if(!isCloud()) return;
  let n=0;
  pollTimer=setInterval(async ()=>{
    if(document.visibilityState==='hidden' || APP.screen!=='app') return;
    n++;
    if(n%4===0){ await refreshWho(); renderBanner(); }
    if(!APP.project || APP.pending || APP.saving) return;
    const a=document.activeElement;
    if(a && a.closest && a.closest('#panel,.metarow') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
    try{
      const pid=APP.project.id;
      const [rows, lines]=await Promise.all([APP.store.select('es_projects',{eq:{id:pid}}),
                                             APP.store.select('es_lines',{eq:{project_id:pid}, order:'pos.asc'})]);
      if(!APP.project || APP.project.id!==pid || APP.pending || APP.saving) return;
      if(!rows.length){ toast('This project was removed.'); closeProject(); renderRoot(); return; }
      const s2=composeState(rows[0], lines), snap=snapshot(s2);
      const same = snap.proj===APP.lastSaved.proj && snap.lines.size===APP.lastSaved.lines.size
        && [...snap.lines].every(([k,v])=>APP.lastSaved.lines.get(k)===v);
      if(!same){ APP.project=rows[0]; S=s2; APP.lastSaved=snap; dirty(); renderRoot(); markSync('updated','ok'); }
    }catch(e){ markSync('offline','crit'); }
  }, 15000);
}
function stopPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushNow(); });

function appAddress(){
  try{ if(location.protocol==='file:') return ''; return location.origin+location.pathname.replace(/index\.html$/,''); }catch(e){ return ''; }
}
async function handleAuth(form){
  const v=id=>(document.getElementById(id)||{}).value||'';
  const kind=form.dataset.form, st=APP.store;
  APP.authError=''; APP.authNotice='';
  const fail=m=>{ APP.authBusy=false; APP.authError=m; renderRoot(); };
  const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  try{
    if(kind==='signin'){
      const e=v('si-email').trim(), p=v('si-pass');
      if(!okEmail(e)||!p) return fail('Enter your email and password.');
      APP.authBusy=true; renderRoot();
      await st.signIn(e,p); APP.authBusy=false; return enter();
    }
    if(kind==='register'){
      const org=v('rg-org').trim(), name=v('rg-name').trim(), e=v('rg-email').trim(), p=v('rg-pass');
      if(!org) return fail('Enter your company name.');
      if(!name) return fail('Enter your name.');
      if(!okEmail(e)) return fail('That email address does not look right.');
      if(p.length<8) return fail('Choose a password of at least 8 characters.');
      APP.authBusy=true; renderRoot();
      pending('org',{org,name});
      let r;
      try{ r=await st.signUp(e,p,appAddress()); }
      catch(err){ if(err.exists){ await st.signIn(e,p); APP.authBusy=false; return enter(); } throw err; }
      APP.authBusy=false;
      if(r.needsVerification){ APP.authEmail=e; APP.authScreen='verify'; renderRoot(); return; }
      return enter();
    }
    if(kind==='join'){
      const e=v('jn-email').trim(), code=v('jn-code').trim().toUpperCase(), p=v('jn-pass'), p2=v('jn-pass2');
      if(!okEmail(e)) return fail('Enter the email your administrator added.');
      if(!code) return fail('Enter the invitation code from your invitation.');
      if(p.length<8) return fail('Choose a password of at least 8 characters.');
      if(p!==p2) return fail('The two passwords are not the same.');
      APP.authBusy=true; renderRoot();
      pending('join',{code}); pending('org',null);
      let r;
      try{ r=await st.signUp(e,p,appAddress()); }
      catch(err){ if(err.exists){ await st.signIn(e,p); APP.authBusy=false; return enter(); } throw err; }
      APP.authBusy=false;
      if(r.needsVerification){ APP.authEmail=e; APP.authScreen='verify'; renderRoot(); return; }
      return enter();
    }
    if(kind==='forgot'){
      const e=v('fg-email').trim(); if(!okEmail(e)) return fail('Enter your email.');
      APP.authBusy=true; renderRoot();
      await st.sendReset(e, appAddress());
      APP.authBusy=false; APP.authNotice='If that email has an account, a reset link is on its way.'; APP.authScreen='signin'; renderRoot(); return;
    }
    if(kind==='setpass'){
      const p=v('sp-pass'), p2=v('sp-pass2');
      if(p.length<8) return fail('Choose a password of at least 8 characters.');
      if(p!==p2) return fail('The two passwords are not the same.');
      APP.authBusy=true; renderRoot(); await st.setPassword(p); APP.authBusy=false; toast('Password saved'); return enter();
    }
    if(kind==='claim'){
      const code=v('no-code').trim().toUpperCase(); if(!code) return fail('Enter the code from your invitation.');
      await st.rpc('es_claim_invite',{p_code:code}); return enter();
    }
    if(kind==='makeorg'){
      const org=v('no-org').trim(), name=v('no-name').trim(); if(!org) return fail('Enter your company name.');
      await st.rpc('es_register_org',{p_org_name:org, p_person_name:name}); return enter();
    }
  }catch(err){ fail(friendly(err)); }
}

function readLogo(file){
  return new Promise((res,rej)=>{
    if(!file) return rej(new Error('No file'));
    if(file.size>4*1024*1024) return rej(new Error('That image is larger than 4 MB.'));
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const max=520, sc=Math.min(1, max/img.width, 200/img.height);
        const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/png')); };
      img.onerror=()=>rej(new Error('That file could not be read as an image.')); img.src=fr.result; };
    fr.onerror=()=>rej(new Error('That file could not be read.')); fr.readAsDataURL(file);
  });
}

function brandRows(title, subtitle){
  const org=APP.org||{};
  return [[{v:org.logo?'':(org.name||''),s:ST.title}],[],[{v:title,s:ST.title}],[{v:subtitle||'',s:ST.note}],
    [{v:`${org.name||''}  ·  Generated ${new Date().toLocaleString()}  ·  ESTORA`,s:ST.note}],[]];
}
const headRow = labels => labels.map(l=>({v:l,s:ST.head}));
const N = (v,s) => ({v:Math.round((+v||0)*1000)/1000, s:s||ST.int, n:true});
function saveFile(name, bytes, type){
  const b=new Blob([bytes],{type:type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
  toast('Downloaded '+name);
}
const fileBase = () => String((S&&S.project.name)||'estimate').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,40)||'estimate';
function exportSchedule(){
  const cur=S.project.currency;
  const rows=brandRows('Estimate schedule — '+(S.project.name||''), `${S.project.client||''}  ·  ${S.project.location}  ·  Currency ${cur}  ·  Status ${S.project.status||''}`);
  rows.push(headRow(['Ref','Type','Description','Material','Labour','Direct cost','Total cost','Margin','Rate','Qty','Amount']));
  let cost=0, sell=0;
  S.lines.forEach(l=>{ const p=priceLine(l), t=TYPES[l.type];
    const d=t.fam==='door' ? `${mm(num(l.W))} × ${mm(num(l.H))} mm opening · ${CORE(l.core).n}`
      : `${mm(num(l.W))} × ${mm(num(l.H))} × ${mm(num(l.D))} mm · ${int(l.doors)} doors · ${int(l.drawerQty)} drawers`;
    cost+=p.cost*p.qty; sell+=p.amount;
    rows.push([{v:l.id,s:ST.cell},{v:t.n,s:ST.cell},{v:d,s:ST.cell},N(p.material),N(p.labour),N(p.direct),N(p.cost),N(p.margin),N(p.rate),N(p.qty),N(p.amount)]); });
  const vat=sell*S.commercial.vatPct/100;
  rows.push([]);
  [['Total cost',cost],['Sell excl. VAT',sell],[`VAT ${S.commercial.vatPct}%`,vat],['Sell incl. VAT',sell+vat]]
    .forEach(([k,v])=>rows.push(['','','','','','','','',{v:k,s:ST.bold},'',N(v,ST.int)]));
  const bd=[...brandRows('Cost build-up — '+(S.project.name||''),'Material rows per item, then manpower and commercial')];
  bd.push(headRow(['Ref','Line','Qty','Unit','Rate','Amount']));
  S.lines.forEach(l=>{ const p=priceLine(l);
    bd.push([{v:l.id+' · '+TYPES[l.type].n,s:ST.sect},'','','','','']);
    p.rows.forEach(r=>bd.push([{v:l.id,s:ST.cell},{v:r.n,s:ST.cell},N(r.q),{v:r.u,s:ST.cell},N(r.r),N(r.amt)]));
    [['Labour',p.labour],['Consumables',p.consum],['Transport',p.trans],['Installation',p.install],['Handover',p.handover],
     ['Overheads & contingency',p.projOH+p.coOH+p.cont],['Margin',p.margin],['Sell rate',p.rate]]
      .forEach(([k,v])=>bd.push([{v:l.id,s:ST.cell},{v:k,s:ST.bold},'','','',N(v)])); });
  saveFile(fileBase()+'-schedule.xlsx', buildXlsx([
    {name:'Schedule', rows, widths:[8,20,46,13,12,13,13,12,13,7,15], freeze:7},
    {name:'Build-up', rows:bd, widths:[16,52,11,8,12,14], freeze:7}], APP.org.logo||''));
}
function bomSheets(){
  const nest=getNest();
  const rows=brandRows('Material BOM — '+(S.project.name||''), `Sheet quantities are the sheets in the cutting layout · Currency ${S.project.currency}`);
  rows.push(headRow(['Material','Quantity','Unit','Value','Sheet size (mm)','Net area (m²)','Yield %']));
  let tot=0;
  bomRows().forEach(r=>{ const e=r.nest?nest.mats[r.mid]:null; tot+=r.amt;
    rows.push([{v:r.n,s:ST.cell},N(r.q),{v:r.u,s:ST.cell},N(r.amt),{v:e?`${mm(e.info.L)} × ${mm(e.info.W)}`:'',s:ST.cell},
      e?N(e.area):{v:'',s:ST.cell}, e&&e.count?N(e.area/(e.count*e.info.L*e.info.W)*100):{v:'',s:ST.cell}]); });
  rows.push(['','',{v:'Total',s:ST.bold},N(tot)]);
  const cut=brandRows('Cut list — '+(S.project.name||''), `Kerf ${S.params.kerf} mm · edge trim ${S.params.trim} mm`);
  Object.values(nest.mats).sort((a,b)=>a.info.name.localeCompare(b.info.name)).forEach(e=>{
    cut.push([{v:`${e.info.name} — ${e.count} sheet${e.count===1?'':'s'} of ${mm(e.info.L)} × ${mm(e.info.W)} mm${e.info.grain?' · grain locked':''}`,s:ST.sect},'','','','','']);
    cut.push(headRow(['Item','Role','Part','Length mm','Width mm','Qty']));
    cutListRows(e).forEach(p=>cut.push([{v:p.lineId,s:ST.cell},{v:p.role,s:ST.cell},{v:p.part,s:ST.cell},N(mm(p.a)),N(mm(p.b)),N(p.n)]));
    cut.push([]);
  });
  return [{name:'BOM',rows,widths:[40,12,8,15,18,14,10],freeze:7},{name:'Cut list',rows:cut,widths:[10,20,28,12,12,8]}];
}
function exportBom(){ saveFile(fileBase()+'-bom.xlsx', buildXlsx(bomSheets(), APP.org.logo||'')); }
function exportCut(){ saveFile(fileBase()+'-cut-list.xlsx', buildXlsx([bomSheets()[1]], APP.org.logo||'')); }
